<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -20; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13.5px; fill: #64748B; }
      .card-good { fill: #F0FDF4; stroke: #34D399; stroke-width: 2; rx: 14; }
      .card-bad { fill: #FFF5F5; stroke: #F87171; stroke-width: 1.8; rx: 14; }
      .inner-slot { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 6; }
      .flow-good {
        stroke: #10B981;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 5, 5;
        fill: none;
        animation: flowDash 3.5s linear infinite;
      }
      .flow-bad {
        stroke: #EF4444;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 4, 4;
        fill: none;
        animation: flowDash 4.5s linear infinite;
      }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; fill: #1E293B; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" class="bg" />

  <!-- Global Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">V8 Engine: Monomorphic Memory Offsets vs Dynamic Hash Probing</text>
    <text x="0" y="18" class="sketch-subtitle">Consistent property initialization orders compile raw memory address offsets directly into machine code</text>
  </g>

  <!-- Left: Monomorphic Fast Path -->
  <g transform="translate(40, 68)">
    <rect width="430" height="280" class="card-good" />
    <rect x="18" y="14" width="165" height="20" rx="4" fill="#DCFCE7" />
    <text x="24" y="28" class="txt-badge" fill="#065F46">MONOMORPHIC SHAPE</text>
    <text x="18" y="56" class="txt-heading" fill="#065F46">Fixed Constructor Property Order</text>

    <!-- Visual Memory Slot Array -->
    <g transform="translate(18, 70)">
      <rect width="394" height="110" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />

      <!-- Fixed Slot Strips -->
      <g transform="translate(14, 16)">
        <rect x="0" y="0" width="85" height="42" class="inner-slot" stroke="#10B981" />
        <text x="8" y="18" class="txt-badge" font-size="8.5px" fill="#065F46">+0x08</text>
        <text x="8" y="32" class="txt-code" font-size="9.5px">children</text>

        <rect x="92" y="0" width="85" height="42" class="inner-slot" stroke="#10B981" />
        <text x="100" y="18" class="txt-badge" font-size="8.5px" fill="#065F46">+0x10</text>
        <text x="100" y="32" class="txt-code" font-size="9.5px">isEnd</text>

        <rect x="184" y="0" width="85" height="42" class="inner-slot" stroke="#10B981" />
        <text x="192" y="18" class="txt-badge" font-size="8.5px" fill="#065F46">+0x18</text>
        <text x="192" y="32" class="txt-code" font-size="9.5px">frequency</text>

        <rect x="276" y="0" width="90" height="42" class="inner-slot" stroke="#10B981" />
        <text x="284" y="18" class="txt-badge" font-size="8.5px" fill="#065F46">+0x28</text>
        <text x="284" y="32" class="txt-code" font-size="9.5px">topSuggestions</text>

        <!-- Direct Jump Pointer Arrow -->
        <path d="M 0 68 L 270 68" class="flow-good" marker-end="url(#arr-green)" />
        <text x="8" y="60" class="txt-sub" font-size="11.5px" fill="#047857">&#8594; Direct Memory Offset [Base + 0x28]</text>
      </g>
    </g>

    <!-- Speed Verdict Card -->
    <g transform="translate(18, 196)">
      <rect width="394" height="68" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="1.2" />
      <text x="18" y="24" class="txt-heading" font-size="16px" fill="#065F46">&#9889; 1 Machine Instruction (Direct Hardware Pointer)</text>
      <text x="18" y="44" class="txt-sub" font-size="12px" fill="#065F46">&#8226; Zero hash map lookups. Read latency &lt; 1 nanosecond.</text>
      <text x="18" y="58" class="txt-badge" font-size="9.5px" fill="#047857">Status: JIT Optimized Fast Path</text>
    </g>
  </g>

  <!-- Right: Megamorphic Slow Path -->
  <g transform="translate(490, 68)">
    <rect width="430" height="280" class="card-bad" />
    <rect x="18" y="14" width="165" height="20" rx="4" fill="#FEE2E2" />
    <text x="24" y="28" class="txt-badge" fill="#991B1B">MEGAMORPHIC SHAPE</text>
    <text x="18" y="56" class="txt-heading" fill="#991B1B">Dynamic Runtime Key Injections</text>

    <!-- Visual Hash Bucket Probing -->
    <g transform="translate(18, 70)">
      <rect width="394" height="110" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2" />

      <!-- Fragmented Hash Buckets -->
      <g transform="translate(14, 16)">
        <rect x="0" y="0" width="85" height="42" class="inner-slot" stroke="#EF4444" stroke-dasharray="3,3" />
        <text x="8" y="18" class="txt-badge" font-size="8.5px" fill="#991B1B">Bucket 0</text>
        <text x="8" y="32" class="txt-code" font-size="9.5px">customId ?</text>

        <rect x="92" y="0" width="85" height="42" class="inner-slot" stroke="#EF4444" stroke-dasharray="3,3" />
        <text x="100" y="18" class="txt-badge" font-size="8.5px" fill="#991B1B">Bucket 1</text>
        <text x="100" y="32" class="txt-code" font-size="9.5px">tempScore</text>

        <rect x="184" y="0" width="85" height="42" class="inner-slot" stroke="#EF4444" stroke-dasharray="3,3" />
        <text x="192" y="18" class="txt-badge" font-size="8.5px" fill="#991B1B">Bucket 2</text>
        <text x="192" y="32" class="txt-code" font-size="9.5px">field_99 ?</text>

        <rect x="276" y="0" width="90" height="42" class="inner-slot" stroke="#EF4444" stroke-dasharray="3,3" />
        <text x="284" y="18" class="txt-badge" font-size="8.5px" fill="#991B1B">Bucket 3</text>
        <text x="284" y="32" class="txt-code" font-size="9.5px">isEnd</text>

        <!-- Wavy Probing Arrow -->
        <path d="M 0 68 Q 90 58 180 72 T 270 68" class="flow-bad" marker-end="url(#arr-red)" />
        <text x="8" y="60" class="txt-sub" font-size="11.5px" fill="#DC2626">&#8595; Hash Table Probing across dynamic property buckets</text>
      </g>
    </g>

    <!-- Penalty Verdict Card -->
    <g transform="translate(18, 196)">
      <rect width="394" height="68" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2" />
      <text x="18" y="24" class="txt-heading" font-size="16px" fill="#991B1B">&#9888; Deoptimizes to Dictionary Hash Map</text>
      <text x="18" y="44" class="txt-sub" font-size="12px" fill="#991B1B">&#8226; 5x – 10x slower property lookups and CPU cache thrashing.</text>
      <text x="18" y="58" class="txt-badge" font-size="9.5px" fill="#991B1B">Status: Shape Miss on Every Keystroke</text>
    </g>
  </g>
</svg>
