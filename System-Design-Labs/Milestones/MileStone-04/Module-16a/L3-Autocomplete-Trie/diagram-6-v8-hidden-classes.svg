<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -20; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 14px; fill: #64748B; }
      .card-good {
        fill: #F0FDF4;
        stroke: #34D399;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        rx: 12;
      }
      .card-bad {
        fill: #FFF5F5;
        stroke: #F87171;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        rx: 12;
      }
      .inner-code { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
      .flow-good {
        stroke: #10B981;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 5, 5;
        fill: none;
        animation: flowDash 3.5s linear infinite;
      }
      .flow-bad {
        stroke: #EF4444;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 4, 4;
        fill: none;
        animation: flowDash 4.5s linear infinite;
      }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; fill: #1E293B; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" class="bg" />

  <!-- Global Header -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" class="sketch-title">Production Engineering: V8 Hidden Classes &amp; Monomorphic Memory Layout</text>
    <text x="0" y="18" class="sketch-subtitle">Predictable constructor property ordering enables the V8 JIT engine to compile raw memory pointer offsets</text>
  </g>

  <!-- Left: Monomorphic Fast Path -->
  <g transform="translate(40, 68)">
    <rect width="425" height="305" class="card-good" />
    <rect x="18" y="14" width="165" height="22" fill="#DCFCE7" rx="4" />
    <text x="24" y="29" class="txt-badge" fill="#065F46">MONOMORPHIC SHAPE</text>
    <text x="18" y="58" class="txt-heading" fill="#065F46">Strict Constructor Property Order</text>

    <!-- Code Block -->
    <rect x="18" y="75" width="389" height="120" class="inner-code" />
    <text x="28" y="94" class="txt-code" fill="#059669">// Linear Transition: Shape C0 &#8594; C1 &#8594; C2 &#8594; C3 &#8594; C4</text>
    <text x="28" y="112" class="txt-code">this.children = new Map();     // offset +0x08</text>
    <text x="28" y="128" class="txt-code">this.isEnd = false;             // offset +0x10</text>
    <text x="28" y="144" class="txt-code">this.frequency = 0;             // offset +0x18</text>
    <text x="28" y="160" class="txt-code">this.word = null;               // offset +0x20</text>
    <text x="28" y="176" class="txt-code">this.topSuggestions = [];       // offset +0x28</text>

    <!-- Calm Animated Flow Line -->
    <path d="M 28 210 L 390 210" class="flow-good" marker-end="url(#arr-green)" />

    <!-- Benefit Card -->
    <rect x="18" y="222" width="389" height="65" fill="#DCFCE7" stroke="#10B981" rx="8" />
    <text x="28" y="244" class="txt-heading" font-size="15px" fill="#065F46">Direct Hardware Offset Reads [base + offset]:</text>
    <text x="28" y="264" class="txt-sub" fill="#065F46">V8 JIT compiles pointer dereference into 1 machine instruction. Zero hash probing!</text>
  </g>

  <!-- Right: Megamorphic Slow Path -->
  <g transform="translate(495, 68)">
    <rect width="425" height="305" class="card-bad" />
    <rect x="18" y="14" width="165" height="22" fill="#FEE2E2" rx="4" />
    <text x="24" y="29" class="txt-badge" fill="#991B1B">MEGAMORPHIC SHAPE</text>
    <text x="18" y="58" class="txt-heading" fill="#991B1B">Dynamic Runtime Key Injection</text>

    <!-- Code Block -->
    <rect x="18" y="75" width="389" height="120" class="inner-code" />
    <text x="28" y="94" class="txt-code" fill="#DC2626">// Dynamic properties cause Shape Tree Explosion</text>
    <text x="28" y="112" class="txt-code">if (cond) node.customMetadata = 123;</text>
    <text x="28" y="128" class="txt-code">delete node.tempScore;</text>
    <text x="28" y="144" class="txt-code">node["field_" + index] = true;</text>
    <text x="28" y="168" class="txt-code" fill="#B91C1C">// Shape cache misses on every access!</text>

    <!-- Calm Animated Flow Line -->
    <path d="M 28 210 L 390 210" class="flow-bad" marker-end="url(#arr-red)" />

    <!-- Penalty Card -->
    <rect x="18" y="222" width="389" height="65" fill="#FEE2E2" stroke="#EF4444" rx="8" />
    <text x="28" y="244" class="txt-heading" font-size="15px" fill="#991B1B">Deoptimizes to Hash Map Mode:</text>
    <text x="28" y="264" class="txt-sub" fill="#991B1B">V8 abandons fast offsets. 5x – 10x slower property lookups and CPU cache thrashing.</text>
  </g>
</svg>