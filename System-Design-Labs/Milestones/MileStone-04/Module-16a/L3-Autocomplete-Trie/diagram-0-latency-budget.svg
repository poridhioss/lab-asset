<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .sketch-card {
        fill: #FFFFFF;
        stroke: #334155;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        rx: 12;
      }
      .card-client { fill: #F0F7FF; stroke: #3B82F6; }
      .card-gateway { fill: #F8FAFC; stroke: #64748B; }
      .card-hero { fill: #ECFDF5; stroke: #10B981; stroke-width: 2.2; }
      .card-egress { fill: #FEF9C3; stroke: #EAB308; }
      .flow-wire {
        stroke: #94A3B8;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: flowDash 4.0s linear infinite;
      }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-card-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .txt-card-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; fill: #475569; }
    </style>

    <marker id="arr-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="270" class="bg" />

  <!-- Top Title -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">The 50ms Keystroke Latency Budget &amp; Jitter Buffer</text>
    <text x="0" y="18" class="sketch-subtitle">Network physics leaves a tight budget: Trie lookups must finish in &lt;= 3ms</text>
  </g>

  <!-- Flow Connector Line with Slow Traveling Packet -->
  <path d="M 160 110 L 890 110" class="flow-wire" marker-end="url(#arr-ink)" />
  <circle r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5">
    <animate attributeName="cx" values="160;330;560;780;890" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;110;110;110;110" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;1;0" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 1: User Keystroke (Client) -->
  <g transform="translate(40, 68)">
    <rect width="150" height="84" class="sketch-card card-client" />
    <text x="14" y="24" class="txt-card-title">1. Keystroke</text>
    <text x="14" y="44" class="txt-card-sub">User types character</text>
    <rect x="14" y="55" width="85" height="18" fill="#DBEAFE" rx="4" />
    <text x="20" y="68" class="txt-badge" fill="#1E40AF">Client: 0ms</text>
  </g>

  <!-- Stage 2: Ingress & Gateway -->
  <g transform="translate(240, 68)">
    <rect width="170" height="84" class="sketch-card card-gateway" />
    <text x="14" y="24" class="txt-card-title">2. Ingress &amp; Gateway</text>
    <text x="14" y="44" class="txt-card-sub">Radio + Fiber + TLS</text>
    <rect x="14" y="55" width="100" height="18" fill="#E2E8F0" rx="4" />
    <text x="20" y="68" class="txt-badge" fill="#334155">Transit: ~17ms</text>
  </g>

  <!-- Stage 3: In-Memory Trie Engine (HERO) -->
  <g transform="translate(460, 60)">
    <rect width="190" height="96" class="sketch-card card-hero" />
    <rect x="14" y="10" width="76" height="16" fill="#10B981" rx="4" />
    <text x="18" y="22" class="txt-badge" font-size="9px" fill="#FFFFFF">OUR ENGINE</text>
    <text x="14" y="44" class="txt-card-title" fill="#065F46">3. Trie Lookup</text>
    <text x="14" y="62" class="txt-card-sub">O(L) walk + Top-5 slice</text>
    <rect x="14" y="70" width="162" height="18" fill="#A7F3D0" rx="4" />
    <text x="20" y="83" class="txt-badge" fill="#065F46">SLA: &lt;= 3ms (Act: 0.003ms)</text>
  </g>

  <!-- Stage 4: Egress & DOM Paint -->
  <g transform="translate(700, 68)">
    <rect width="190" height="84" class="sketch-card card-egress" />
    <text x="14" y="24" class="txt-card-title">4. Egress &amp; UI Paint</text>
    <text x="14" y="44" class="txt-card-sub">Fiber return + DOM diff</text>
    <rect x="14" y="55" width="125" height="18" fill="#FEF08A" rx="4" />
    <text x="20" y="68" class="txt-badge" fill="#854D0E">Return + DOM: ~19ms</text>
  </g>

  <!-- Bottom Timeline Breakdown Bar: Clean & Minimal -->
  <g transform="translate(40, 180)">
    <!-- Baseline Bar Background -->
    <rect width="880" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" rx="8" />

    <!-- 39ms Consumed Transit Pill -->
    <rect x="4" y="4" width="610" height="34" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" rx="6" />
    <text x="20" y="26" class="txt-card-title" font-size="14px" fill="#1E40AF">39ms Consumed Transit</text>
    <text x="185" y="25" class="txt-badge" font-size="11px" fill="#3B82F6">(17ms Ingress + 3ms Trie + 19ms Egress &amp; DOM)</text>

    <!-- 11ms Safety Headroom Pill -->
    <g transform="translate(620, 4)">
      <rect width="256" height="34" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4,3" rx="6" />
      <text x="15" y="22" class="txt-card-title" font-size="14px" fill="#7E22CE">10–15ms Safety Headroom</text>
      <text x="175" y="22" class="txt-badge" font-size="10px" fill="#9333EA">Jitter Buffer</text>
    </g>

    <!-- Legend Caption -->
    <text x="4" y="60" class="sketch-subtitle" font-size="12px">Total Keystroke Budget: 50ms &#8226; Headroom absorbs 4G/5G radio scheduling jitter &amp; Wi-Fi packet drops</text>
  </g>
</svg>