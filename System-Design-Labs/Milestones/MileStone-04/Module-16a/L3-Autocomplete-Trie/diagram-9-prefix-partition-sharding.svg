<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .txt-note { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arr-red9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arr-green9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="170" class="bg" />

  <!-- LEFT: Scatter-Gather Trap -->
  <g transform="translate(20, 14)">
    <rect width="395" height="142" class="sketch-box" fill="#FEF2F2" stroke="#FCA5A5" />
    <rect x="12" y="8" width="130" height="18" rx="3" fill="#FEE2E2" />
    <text x="18" y="21" class="txt-badge" fill="#991B1B">SCATTER-GATHER TRAP</text>
    <text x="155" y="22" class="txt-title" fill="#991B1B">DocID Random Sharding</text>

    <!-- Query input -->
    <rect x="12" y="34" width="371" height="26" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="20" y="51" class="txt-code" fill="#334155">Keystroke "ka" &#8594; Fan-out to 16 Shards</text>

    <!-- Fanout chips -->
    <rect x="12" y="68" width="90" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="18" y="84" class="txt-code" fill="#991B1B">Shard 1..16</text>

    <path d="M 108 80 L 135 80" class="arrow" stroke="#EF4444" marker-end="url(#arr-red9)" />

    <rect x="142" y="68" width="145" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="148" y="84" class="txt-code" fill="#991B1B">Scatter-Gather Merge</text>

    <!-- Callout -->
    <text x="14" y="122" class="txt-note" fill="#991B1B">&#9888; Tail latency bound to slowest shard &#8226; 45ms &gt; 3ms SLA</text>
  </g>

  <!-- RIGHT: 2-Character Prefix Partitioning -->
  <g transform="translate(445, 14)">
    <rect width="395" height="142" class="sketch-box" fill="#F0FDF4" stroke="#86EFAC" />
    <rect x="12" y="8" width="135" height="18" rx="3" fill="#DCFCE7" />
    <text x="18" y="21" class="txt-badge" fill="#166534">PREFIX PARTITIONING</text>
    <text x="160" y="22" class="txt-title" fill="#166534">Deterministic Single-Hop</text>

    <!-- Query input -->
    <rect x="12" y="34" width="371" height="26" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="20" y="51" class="txt-code" fill="#166534">Keystroke "ka" &#8594; Edge Router: Hash("ka")</text>

    <!-- Route chips -->
    <rect x="12" y="68" width="130" height="24" rx="4" fill="#DCFCE7" stroke="#10B981" />
    <text x="18" y="84" class="txt-code" fill="#166534">Router: Prefix "k*"</text>

    <path d="M 148 80 L 175 80" class="arrow" stroke="#10B981" marker-end="url(#arr-green9)" />

    <rect x="182" y="68" width="180" height="24" rx="4" fill="#DCFCE7" stroke="#10B981" />
    <text x="188" y="84" class="txt-code" fill="#166534">Shard K (Direct 1-Hop)</text>

    <!-- Callout -->
    <text x="14" y="122" class="txt-note" fill="#166534">&#10004; Zero scatter-gather overhead &#8226; 1.2ms &#8226; SLA Preserved</text>
  </g>
</svg>
