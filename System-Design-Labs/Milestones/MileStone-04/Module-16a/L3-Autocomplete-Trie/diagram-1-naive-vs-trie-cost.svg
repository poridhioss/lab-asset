<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      @keyframes slowCrawl {
        to { stroke-dashoffset: -20; }
      }
      @keyframes swiftFlow {
        to { stroke-dashoffset: -28; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13.5px; fill: #64748B; }
      .card-err { fill: #FFF5F5; stroke: #F87171; stroke-width: 1.8; rx: 14; }
      .card-win { fill: #F0FDF4; stroke: #34D399; stroke-width: 2.2; rx: 14; }
      .cell-inner { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
      .wire-slow {
        stroke: #EF4444;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 4, 6;
        fill: none;
        animation: slowCrawl 6.0s linear infinite;
      }
      .wire-fast {
        stroke: #10B981;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: swiftFlow 3.8s linear infinite;
      }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .disk-cyl { fill: #FEE2E2; stroke: #EF4444; stroke-width: 1.5; }
      .ram-chip { fill: #DCFCE7; stroke: #10B981; stroke-width: 1.5; rx: 4; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" class="bg" />

  <!-- Global Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">Relational SQL LIKE vs In-Memory Character Trie</text>
    <text x="0" y="18" class="sketch-subtitle">Why disk-bound queries collapse under typing speed compared to in-memory trees</text>
  </g>

  <!-- Left: Naive Relational Database (Disk Scan) -->
  <g transform="translate(40, 68)">
    <rect width="430" height="280" class="card-err" />
    <rect x="18" y="14" width="160" height="20" rx="4" fill="#FEE2E2" />
    <text x="24" y="28" class="txt-badge" fill="#991B1B">NAIVE: RELATIONAL SQL</text>
    <text x="18" y="56" class="txt-heading" fill="#991B1B">Disk B-Tree Scan + Runtime QuickSort</text>

    <!-- Visual Sketch: Disk Platter & Sequential Page Scan -->
    <g transform="translate(18, 72)">
      <rect width="394" height="90" class="cell-inner" stroke="#FCA5A5" />

      <!-- Sketched Disk Cylinder -->
      <g transform="translate(24, 16)">
        <ellipse cx="26" cy="10" rx="22" ry="7" class="disk-cyl" />
        <path d="M 4 10 L 4 42 A 22 7 0 0 0 48 42 L 48 10" class="disk-cyl" />
        <ellipse cx="26" cy="42" rx="22" ry="7" fill="none" stroke="#EF4444" stroke-width="1.5" />
        <text x="14" y="28" class="txt-badge" font-size="8.5px" fill="#991B1B">DISK</text>
      </g>

      <!-- Sequential Block Scan Trail -->
      <g transform="translate(90, 20)">
        <rect x="0" y="0" width="45" height="26" rx="3" fill="#FEE2E2" stroke="#F87171" />
        <text x="6" y="16" class="txt-code" font-size="8.5px" fill="#991B1B">Page 1</text>

        <rect x="52" y="0" width="45" height="26" rx="3" fill="#FEE2E2" stroke="#F87171" />
        <text x="58" y="16" class="txt-code" font-size="8.5px" fill="#991B1B">Page 2</text>

        <rect x="104" y="0" width="45" height="26" rx="3" fill="#FEE2E2" stroke="#F87171" />
        <text x="110" y="16" class="txt-code" font-size="8.5px" fill="#991B1B">Page 3</text>

        <!-- Scanning Wave Arrow -->
        <path d="M 154 13 L 180 13" class="wire-slow" marker-end="url(#arr-red)" />

        <rect x="190" y="0" width="95" height="26" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-dasharray="3,3" />
        <text x="196" y="16" class="txt-code" font-size="8.5px" fill="#DC2626">Scan 50k rows...</text>

        <text x="0" y="48" class="txt-sub" font-size="11.5px" fill="#B91C1C">&#8595; Funnels thousands of rows into runtime QuickSort</text>
      </g>
    </g>

    <!-- Query Snippet -->
    <g transform="translate(18, 172)">
      <rect width="394" height="34" class="cell-inner" />
      <text x="16" y="21" class="txt-code" fill="#B91C1C">WHERE query LIKE 'kacchi%' ORDER BY count DESC LIMIT 5;</text>
    </g>

    <!-- Bottleneck Verdict Scorecard -->
    <g transform="translate(18, 216)">
      <rect width="394" height="48" rx="8" fill="#FEE2E2" stroke="#F87171" stroke-width="1.2" />
      <text x="16" y="20" class="txt-badge" fill="#991B1B">Complexity: O(N &#183; L) disk scan + O(M log M) runtime sort</text>
      <text x="16" y="38" class="txt-heading" font-size="15px" fill="#DC2626">Latency: 45ms – 250ms (FAILS 50ms SLA!)</text>
    </g>
  </g>

  <!-- Right: In-Memory Character Trie (RAM Pointers) -->
  <g transform="translate(490, 68)">
    <rect width="430" height="280" class="card-win" />
    <rect x="18" y="14" width="180" height="20" rx="4" fill="#DCFCE7" />
    <text x="24" y="28" class="txt-badge" fill="#065F46">SYSTEMS APPROACH: TRIE</text>
    <text x="18" y="56" class="txt-heading" fill="#065F46">RAM Pointer Hops + Precomputed Top-5 Slice</text>

    <!-- Visual Sketch: RAM Chip & Pointer Hop Trail -->
    <g transform="translate(18, 72)">
      <rect width="394" height="90" class="cell-inner" stroke="#86EFAC" />

      <!-- Sketched RAM Chip -->
      <g transform="translate(18, 16)">
        <rect x="0" y="0" width="50" height="46" class="ram-chip" />
        <rect x="6" y="6" width="38" height="34" fill="#FFFFFF" stroke="#10B981" rx="2" />
        <text x="14" y="22" class="txt-badge" font-size="8.5px" fill="#065F46">RAM</text>
        <text x="10" y="32" class="txt-code" font-size="7.5px" fill="#047857">0x4A10</text>
      </g>

      <!-- 6 Clean Pointer Hops -->
      <g transform="translate(80, 20)">
        <circle cx="12" cy="13" r="10" fill="#DCFCE7" stroke="#10B981" stroke-width="1.4" />
        <text x="8" y="17" class="txt-code" font-size="9px" font-weight="700" fill="#065F46">'k'</text>

        <path d="M 23 13 L 38 13" class="wire-fast" />

        <circle cx="49" cy="13" r="10" fill="#DCFCE7" stroke="#10B981" stroke-width="1.4" />
        <text x="45" y="17" class="txt-code" font-size="9px" font-weight="700" fill="#065F46">'a'</text>

        <path d="M 60 13 L 75 13" class="wire-fast" />

        <circle cx="86" cy="13" r="10" fill="#DCFCE7" stroke="#10B981" stroke-width="1.4" />
        <text x="82" y="17" class="txt-code" font-size="9px" font-weight="700" fill="#065F46">'c'</text>

        <path d="M 97 13 L 112 13" class="wire-fast" />

        <!-- Terminal Node Double Circle -->
        <circle cx="128" cy="13" r="12" fill="#DCFCE7" stroke="#10B981" stroke-width="1.6" />
        <circle cx="128" cy="13" r="8" fill="none" stroke="#10B981" stroke-width="1.2" />
        <text x="125" y="16" class="txt-code" font-size="9px" font-weight="700" fill="#065F46">'i'</text>

        <path d="M 142 13 L 168 13" class="wire-fast" marker-end="url(#arr-green)" />

        <!-- Direct Precomputed Slice -->
        <rect x="175" y="2" width="125" height="24" rx="4" fill="#ECFDF5" stroke="#10B981" />
        <text x="181" y="17" class="txt-badge" font-size="9px" fill="#065F46">&#8594; topSuggestions[5]</text>

        <text x="0" y="48" class="txt-sub" font-size="11.5px" fill="#047857">&#8594; Exactly 6 RAM pointer hops. Zero runtime sort!</text>
      </g>
    </g>

    <!-- Query Snippet -->
    <g transform="translate(18, 172)">
      <rect width="394" height="34" class="cell-inner" />
      <text x="16" y="21" class="txt-code" fill="#047857">const node = trie.findPrefixNode("kacchi"); return node.topSuggestions.slice(0, 5);</text>
    </g>

    <!-- Performance Verdict Scorecard -->
    <g transform="translate(18, 216)">
      <rect width="394" height="48" rx="8" fill="#DCFCE7" stroke="#34D399" stroke-width="1.2" />
      <text x="16" y="20" class="txt-badge" fill="#065F46">Complexity: O(L) pointer navigation + O(1) array slice</text>
      <text x="16" y="38" class="txt-heading" font-size="15px" fill="#059669">Latency: 1.087 &#181;s (1,000x FASTER THAN SLA!)</text>
    </g>
  </g>
</svg>
