<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowEdge {
        to { stroke-dashoffset: -20; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13.5px; fill: #64748B; }
      .sketch-card {
        fill: #FFFFFF;
        stroke: #334155;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        rx: 12;
      }
      .node-circle { fill: #FFFFFF; stroke: #475569; stroke-width: 1.8; }
      .node-active { fill: #DCFCE7; stroke: #10B981; stroke-width: 2.2; }
      .node-terminal { fill: #DCFCE7; stroke: #10B981; stroke-width: 2.2; }
      .flow-active-edge {
        stroke: #10B981;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 5, 5;
        fill: none;
        animation: flowEdge 3.5s linear infinite;
      }
      .tree-edge { stroke: #94A3B8; stroke-width: 1.6; stroke-linecap: round; fill: none; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; fill: #1E293B; }
      .edge-char { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #2563EB; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="450" class="bg" />

  <!-- Title Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">Character Trie Anatomy: Shared Prefix Trunk</text>
    <text x="0" y="18" class="sketch-subtitle">Common prefix characters are stored once in RAM, eliminating string redundancy</text>
  </g>

  <!-- Left: Spacious Branching N-ary Tree Canvas -->
  <g transform="translate(40, 68)">
    <rect width="630" height="360" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" />
    <text x="18" y="24" class="txt-heading" font-size="15px">N-ary Tree Topology (Shared Trunk vs Sibling Branches)</text>

    <!-- Root Node -->
    <g transform="translate(315, 48)">
      <circle cx="0" cy="0" r="14" class="node-circle" />
      <text x="-4" y="4" class="txt-code" font-weight="700">&#8226;</text>
      <text x="-12" y="-18" class="txt-sub" font-size="11px">Root</text>
    </g>

    <!-- Sibling Branch 1: 'b' (bhuna) -->
    <path d="M 302 52 Q 210 68 140 96" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="215" y="74" class="edge-char" fill="#64748B">'b'</text>
    <g transform="translate(130, 105)">
      <circle cx="0" cy="0" r="12" class="node-circle" />
      <text x="-4" y="4" class="txt-code">'b'</text>
    </g>
    <path d="M 130 117 L 130 142" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(130, 154)">
      <circle cx="0" cy="0" r="13" class="node-terminal" />
      <circle cx="0" cy="0" r="9" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="9px" fill="#065F46">'a'</text>
    </g>
    <rect x="75" y="170" width="110" height="18" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="82" y="183" class="txt-code" font-size="8.5px" fill="#065F46">"bhuna" (9.4k)</text>

    <!-- Sibling Branch 2: 'd' (dhaka) -->
    <path d="M 328 52 Q 420 68 490 96" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="410" y="74" class="edge-char" fill="#64748B">'d'</text>
    <g transform="translate(500, 105)">
      <circle cx="0" cy="0" r="12" class="node-circle" />
      <text x="-4" y="4" class="txt-code">'d'</text>
    </g>
    <path d="M 500 117 L 500 142" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(500, 154)">
      <circle cx="0" cy="0" r="13" class="node-terminal" />
      <circle cx="0" cy="0" r="9" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="9px" fill="#065F46">'a'</text>
    </g>
    <rect x="445" y="170" width="110" height="18" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="452" y="183" class="txt-code" font-size="8.5px" fill="#065F46">"dhaka" (7.8k)</text>

    <!-- Central Food Trunk: 'k' -->
    <path d="M 315 62 L 315 92" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="322" y="80" class="edge-char">'k'</text>
    <g transform="translate(315, 104)">
      <circle cx="0" cy="0" r="12" class="node-active" />
      <text x="-4" y="4" class="txt-code" font-weight="700" fill="#065F46">'k'</text>
    </g>

    <!-- Under 'k': 'h' (khichuri) vs 'a' (kacchi trunk) -->
    <path d="M 305 112 Q 260 128 230 150" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="260" y="132" class="edge-char" fill="#64748B">'h'</text>
    <g transform="translate(220, 160)">
      <circle cx="0" cy="0" r="11" class="node-circle" />
      <text x="-4" y="4" class="txt-code">'h'</text>
    </g>
    <path d="M 220 171 L 220 192" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(220, 202)">
      <circle cx="0" cy="0" r="12" class="node-terminal" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="8.5px" fill="#065F46">'i'</text>
    </g>
    <rect x="165" y="218" width="110" height="18" rx="3" fill="#ECFDF5" stroke="#10B981" />
    <text x="171" y="230" class="txt-code" font-size="8.5px" fill="#065F46">"khichuri" (12.1k)</text>

    <!-- Active Trunk to 'a' -->
    <path d="M 315 116 L 315 146" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="322" y="134" class="edge-char">'a'</text>
    <g transform="translate(315, 158)">
      <circle cx="0" cy="0" r="12" class="node-active" />
      <text x="-4" y="4" class="txt-code" font-weight="700" fill="#065F46">'a'</text>
    </g>

    <!-- Under 'a': Sibling 'l' (kala bhuna) -->
    <path d="M 325 165 Q 365 178 395 198" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="365" y="182" class="edge-char" fill="#64748B">'l'</text>
    <g transform="translate(405, 208)">
      <circle cx="0" cy="0" r="11" class="node-circle" />
      <text x="-3" y="4" class="txt-code">'l'</text>
    </g>
    <path d="M 405 219 L 405 238" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(405, 248)">
      <circle cx="0" cy="0" r="12" class="node-terminal" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="8.5px" fill="#065F46">'a'</text>
    </g>
    <rect x="350" y="262" width="120" height="18" rx="3" fill="#ECFDF5" stroke="#10B981" />
    <text x="356" y="274" class="txt-code" font-size="8.5px" fill="#065F46">"kala bhuna" (14.3k)</text>

    <!-- Shared Trunk Descent: 'c' -> 'c' -> 'h' -> 'i' -->
    <path d="M 315 170 L 315 198" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="322" y="188" class="edge-char">'c'</text>
    <g transform="translate(315, 208)">
      <circle cx="0" cy="0" r="11" class="node-active" />
      <text x="-4" y="4" class="txt-code" font-weight="700" fill="#065F46">'c'</text>
    </g>

    <path d="M 315 219 L 315 244" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="322" y="236" class="edge-char">'c'-'h'</text>
    <g transform="translate(315, 254)">
      <circle cx="0" cy="0" r="11" class="node-active" />
      <text x="-4" y="4" class="txt-code" font-weight="700" fill="#065F46">'h'</text>
    </g>

    <path d="M 315 265 L 315 292" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="322" y="282" class="edge-char">'i'</text>

    <!-- Terminal Double Ring Node: 'kacchi' (8.5k) -->
    <g transform="translate(315, 306)">
      <circle cx="0" cy="0" r="16" class="node-terminal" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#10B981" stroke-width="1.3" />
      <text x="-3" y="4" class="txt-code" font-weight="700" fill="#065F46">'i'</text>
    </g>
    <rect x="235" y="324" width="160" height="20" rx="4" fill="#ECFDF5" stroke="#10B981" />
    <text x="242" y="337" class="txt-code" font-size="9px" font-weight="700" fill="#065F46">&#9733; "kacchi" (8.5k) [Terminal]</text>

    <!-- Suffix Branches out of Terminal 'i' -->
    <!-- to biryani -->
    <path d="M 300 310 Q 230 326 160 344" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(150, 350)">
      <circle cx="0" cy="0" r="12" class="node-terminal" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="8.5px" fill="#065F46">'i'</text>
    </g>
    <text x="75" y="354" class="txt-code" font-size="9px" fill="#065F46">"kacchi biryani"</text>

    <!-- to mutton -->
    <path d="M 330 310 Q 400 326 470 344" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(480, 350)">
      <circle cx="0" cy="0" r="12" class="node-terminal" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="1.2" />
      <text x="-3" y="4" class="txt-code" font-size="8.5px" fill="#065F46">'n'</text>
    </g>
    <text x="498" y="354" class="txt-code" font-size="9px" fill="#065F46">"kacchi mutton"</text>

    <!-- Clean Shared Trunk Label -->
    <g transform="translate(18, 270)">
      <rect width="180" height="42" rx="6" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.2" />
      <text x="10" y="17" class="txt-heading" font-size="12px" fill="#854D0E">SHARED TRUNK:</text>
      <text x="10" y="32" class="txt-sub" font-size="10.5px" fill="#854D0E">'k-a-c-c-h-i' stored ONCE in RAM</text>
    </g>
  </g>

  <!-- Right: Minimal Summary Card -->
  <g transform="translate(690, 68)">
    <rect width="230" height="360" rx="14" class="sketch-card" fill="#F0F7FF" stroke="#3B82F6" />
    <rect x="16" y="14" width="150" height="20" rx="4" fill="#DBEAFE" />
    <text x="22" y="28" class="txt-badge" fill="#1E40AF">PREFIX DEDUPLICATION</text>
    <text x="16" y="58" class="txt-heading" font-size="17px">Zero String Waste</text>

    <!-- Clean Metric Pill 1 -->
    <rect x="16" y="75" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="26" y="98" class="txt-code" font-weight="700" fill="#1D4ED8">1 Trunk = 4 Queries</text>
    <text x="26" y="118" class="txt-sub" font-size="11.5px">kacchi, biryani, mutton, beef</text>

    <!-- Clean Metric Pill 2 -->
    <rect x="16" y="148" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="26" y="171" class="txt-code" font-weight="700" fill="#047857">194 Nodes in Total</text>
    <text x="26" y="191" class="txt-sub" font-size="11.5px">Indexes 25 long query phrases</text>

    <!-- Clean Metric Pill 3 -->
    <rect x="16" y="220" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="26" y="243" class="txt-code" font-weight="700" fill="#0F172A">Zero Heap Churn</text>
    <text x="26" y="263" class="txt-sub" font-size="11.5px">Eliminates V8 GC pauses</text>

    <!-- Bottom Badge -->
    <rect x="16" y="296" width="198" height="36" rx="6" fill="#DBEAFE" />
    <text x="24" y="318" class="txt-badge" font-size="10.5px" fill="#1E40AF">&#10003; 20x Memory Efficiency</text>
  </g>
</svg>
