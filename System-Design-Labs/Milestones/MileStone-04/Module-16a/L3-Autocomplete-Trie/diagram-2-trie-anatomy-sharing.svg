<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowEdge {
        to { stroke-dashoffset: -20; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 14px; fill: #64748B; }
      .sketch-card {
        fill: #FFFFFF;
        stroke: #334155;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        rx: 12;
      }
      .node-circle {
        fill: #FFFFFF;
        stroke: #334155;
        stroke-width: 1.8;
      }
      .node-terminal {
        fill: #ECFDF5;
        stroke: #10B981;
        stroke-width: 2.2;
      }
      .flow-active-edge {
        stroke: #10B981;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 5, 5;
        fill: none;
        animation: flowEdge 3.5s linear infinite;
      }
      .tree-edge {
        stroke: #64748B;
        stroke-width: 1.8;
        stroke-linecap: round;
        fill: none;
      }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; fill: #1E293B; }
      .edge-char { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #2563EB; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" />

  <!-- Title Header -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" class="sketch-title">Character Trie Anatomy: Shared Prefix Trunk &amp; Deduplication</text>
    <text x="0" y="18" class="sketch-subtitle">A single shared character branch powers multiple queries, eliminating string redundancy</text>
  </g>

  <!-- Left: Tree Visual Canvas -->
  <g transform="translate(40, 75)">
    <!-- Tree Boundary Sketch Card -->
    <rect width="520" height="375" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" rx="12" />
    <text x="20" y="26" class="txt-heading" font-size="16px">N-ary Tree Structure (Root &#8594; Shared 'k-a-c-c-h-i' Path)</text>

    <!-- Root Node -->
    <g transform="translate(260, 60)">
      <circle cx="0" cy="0" r="15" class="node-circle" />
      <text x="-4" y="4" class="txt-code" font-weight="700">&#8226;</text>
      <text x="-32" y="-18" class="txt-sub" font-size="11px">Root Node</text>
    </g>

    <!-- Edges from Root -->
    <path d="M 245 70 Q 200 95 160 120" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="195" y="96" class="edge-char">'k'</text>

    <path d="M 275 70 Q 320 95 360 120" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="325" y="96" class="edge-char" fill="#64748B">'d'</text>

    <!-- Level 1: 'k' and 'd' -->
    <g transform="translate(150, 130)">
      <circle cx="0" cy="0" r="14" class="node-circle" stroke="#10B981" />
      <text x="-4" y="4" class="txt-code" font-weight="700">'k'</text>
    </g>
    <g transform="translate(370, 130)">
      <circle cx="0" cy="0" r="14" class="node-circle" />
      <text x="-4" y="4" class="txt-code">'d'</text>
    </g>

    <!-- Down the 'k' trunk: 'k' -> 'a' -> 'c' -->
    <path d="M 150 144 L 150 180" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="160" y="166" class="edge-char">'a'</text>

    <g transform="translate(150, 192)">
      <circle cx="0" cy="0" r="14" class="node-circle" stroke="#10B981" />
      <text x="-4" y="4" class="txt-code" font-weight="700">'a'</text>
    </g>

    <path d="M 150 206 L 150 240" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="160" y="228" class="edge-char">'c'</text>

    <g transform="translate(150, 252)">
      <circle cx="0" cy="0" r="14" class="node-circle" stroke="#10B981" />
      <text x="-4" y="4" class="txt-code" font-weight="700">'c'</text>
    </g>

    <!-- Shared trunk continuation: 'c' -> ... -> 'i' (kacchi) -->
    <path d="M 150 266 L 150 298" class="flow-active-edge" marker-end="url(#arr-green)" />
    <text x="160" y="286" class="edge-char">'c'-'h'-'i'</text>

    <!-- Terminal Node: 'i' ("kacchi") with double concentric ring -->
    <g transform="translate(150, 318)">
      <circle cx="0" cy="0" r="18" class="node-terminal" />
      <circle cx="0" cy="0" r="13" fill="none" stroke="#10B981" stroke-width="1.4" />
      <text x="-4" y="4" class="txt-code" font-weight="700" fill="#065F46">'i'</text>
    </g>
    <rect x="70" y="342" width="160" height="22" fill="#ECFDF5" stroke="#10B981" rx="4" />
    <text x="76" y="357" class="txt-code" font-size="10px" font-weight="700" fill="#065F46">"kacchi" (vol: 8,500)</text>

    <!-- Branching out from "kacchi": ' ' (space) -> "biryani" & "mutton" -->
    <path d="M 166 324 Q 240 330 280 300" class="tree-edge" marker-end="url(#arr-ink)" />
    <text x="215" y="318" class="edge-char">' '</text>

    <!-- Child Node: "biryani" -->
    <g transform="translate(300, 290)">
      <circle cx="0" cy="0" r="16" class="node-terminal" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#10B981" stroke-width="1.3" />
      <text x="-4" y="4" class="txt-code" font-size="10px" font-weight="700" fill="#065F46">'i'</text>
    </g>
    <rect x="322" y="280" width="175" height="22" fill="#ECFDF5" stroke="#10B981" rx="4" />
    <text x="328" y="295" class="txt-code" font-size="10px" font-weight="700" fill="#065F46">"kacchi biryani" (16,400)</text>

    <!-- Child Node: "mutton" -->
    <path d="M 166 328 Q 240 360 280 348" class="tree-edge" marker-end="url(#arr-ink)" />
    <g transform="translate(300, 345)">
      <circle cx="0" cy="0" r="16" class="node-terminal" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#10B981" stroke-width="1.3" />
      <text x="-4" y="4" class="txt-code" font-size="10px" font-weight="700" fill="#065F46">'n'</text>
    </g>
    <rect x="322" y="335" width="175" height="22" fill="#ECFDF5" stroke="#10B981" rx="4" />
    <text x="328" y="350" class="txt-code" font-size="10px" font-weight="700" fill="#065F46">"kacchi mutton" (9,200)</text>
  </g>

  <!-- Right: Memory Deduplication Callout Cards -->
  <g transform="translate(580, 75)">
    <!-- Top Comparison Card -->
    <g>
      <rect width="340" height="175" class="sketch-card" fill="#F0F7FF" stroke="#3B82F6" />
      <rect x="16" y="14" width="160" height="20" fill="#DBEAFE" rx="4" />
      <text x="22" y="28" class="txt-badge" fill="#1E40AF">TRIE PREFIX SHARING</text>
      <text x="16" y="56" class="txt-heading" font-size="16px">1 Shared Path = 5 Queries</text>
      <text x="16" y="76" class="txt-sub">&#8226; 'k-a-c-c-h-i' stored exactly once in memory.</text>
      <text x="16" y="96" class="txt-sub">&#8226; Child words append only suffix characters.</text>
      <text x="16" y="116" class="txt-sub">&#8226; 194 TrieNodes index 25 entire long queries.</text>
      <rect x="16" y="132" width="308" height="26" fill="#DBEAFE" rx="6" />
      <text x="24" y="149" class="txt-badge" fill="#1E40AF">Memory: 4.92 MB (Zero Duplication)</text>
    </g>

    <!-- Bottom Comparison Card: Flat Map Duplication -->
    <g transform="translate(0, 195)">
      <rect width="340" height="180" class="sketch-card" fill="#FFF5F5" stroke="#F87171" />
      <rect x="16" y="14" width="160" height="20" fill="#FEE2E2" rx="4" />
      <text x="22" y="28" class="txt-badge" fill="#991B1B">FLAT MAP ALTERNATIVE</text>
      <text x="16" y="56" class="txt-heading" font-size="16px">20x String Redundancy</text>
      <text x="16" y="76" class="txt-sub">&#8226; Every prefix substring duplicated in keys:</text>
      <text x="26" y="94" class="txt-code" font-size="10px">"k", "ka", "kac", "kacc", "kacch", "kacchi"</text>
      <text x="16" y="116" class="txt-sub">&#8226; V8 string allocations explode heap by 20x.</text>
      <rect x="16" y="136" width="308" height="26" fill="#FEE2E2" rx="6" />
      <text x="24" y="153" class="txt-badge" fill="#991B1B">Heap Churn: Triggers Heavy V8 GC Pauses</text>
    </g>
  </g>
</svg>