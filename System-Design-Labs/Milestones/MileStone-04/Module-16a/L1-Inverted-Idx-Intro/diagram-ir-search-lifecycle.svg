<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#drop-shadow); rx: 8px; }
      .header-blue { fill: #2563EB; }
      .header-indigo { fill: #4F46E5; }
      .header-emerald { fill: #059669; }
      .header-dark { fill: #0F172A; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; }
      .code-main { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #1E293B; }
      .code-dim { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #64748B; }
      .code-blue { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #2563EB; }
      .code-indigo { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #4F46E5; }
      .code-emerald { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #059669; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .label-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748B; }
      .badge-blue { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1; rx: 4px; }
      .badge-indigo { fill: #EEF2FF; stroke: #A5B4FC; stroke-width: 1; rx: 4px; }
      .badge-emerald { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 1; rx: 4px; }
      .badge-amber { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1; rx: 4px; }
      .badge-slate { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; rx: 4px; }
      .rank-pill { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; rx: 4px; }
      .flow-arrow { stroke: #2563EB; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: flow 1.2s linear infinite; }
      .flow-arrow-indigo { stroke: #4F46E5; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: flow 1.2s linear infinite; }
      .flow-arrow-emerald { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: flow 1.2s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 18; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1050" height="360" class="bg" />

  <!-- Diagram Title Header -->
  <text x="40" y="38" class="title-main">The Two-Phase Architecture of Modern Information Retrieval</text>
  <text x="40" y="58" class="title-sub">Separating ultra-fast boolean candidate filtering from computationally intensive relevance ranking</text>

  <!-- ==================== CARD 1: USER QUERY ==================== -->
  <g transform="translate(40, 85)">
    <rect width="210" height="240" class="card" stroke="#3B82F6" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 24 L 0 24 Z" class="header-blue" />
    <text x="12" y="16" class="header-text">USER SEARCH QUERY</text>

    <!-- Query Input Box -->
    <rect x="14" y="38" width="182" height="36" class="badge-blue" />
    <text x="24" y="53" class="label-muted">Raw Search Input:</text>
    <text x="24" y="66" class="code-blue">"distributed cache"</text>

    <!-- Parsed Query Tokens -->
    <text x="14" y="98" class="label-bold">Extracted Query Terms:</text>
    
    <rect x="14" y="108" width="86" height="24" class="badge-slate" />
    <text x="22" y="124" class="code-main">"distribut"</text>

    <rect x="110" y="108" width="86" height="24" class="badge-slate" />
    <text x="126" y="124" class="code-main">"cache"</text>

    <line x1="14" y1="148" x2="196" y2="148" stroke="#E2E8F0" stroke-width="1" />

    <!-- Trigger Context -->
    <text x="14" y="170" class="label-bold">Execution Trigger:</text>
    <text x="14" y="186" class="label-muted">User presses Enter key</text>
    <text x="14" y="200" class="label-muted">Multi-term Boolean AND</text>

    <!-- Latency SLA Badge -->
    <rect x="14" y="212" width="182" height="18" class="badge-blue" />
    <text x="22" y="225" class="code-blue">Network Budget: Sub-100ms</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 250 205 L 285 205" class="flow-arrow" marker-end="url(#arrow-blue)" />

  <!-- ==================== CARD 2: CANDIDATE RETRIEVAL ==================== -->
  <g transform="translate(290, 85)">
    <rect width="250" height="240" class="card" stroke="#6366F1" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 242 0 Q 250 0 250 8 L 250 24 L 0 24 Z" class="header-indigo" />
    <text x="12" y="16" class="header-text">1. CANDIDATE RETRIEVAL (MATCHING)</text>

    <!-- Subtitle Mechanism -->
    <text x="14" y="44" class="label-bold">Mechanism: Inverted Index Lookup</text>
    <rect x="14" y="52" width="222" height="20" class="badge-indigo" />
    <text x="22" y="66" class="code-indigo">Target: Speed (Sub-millisecond)</text>

    <!-- Posting Lists Representation -->
    <text x="14" y="92" class="label-muted">Posting Lists (Document IDs):</text>
    
    <rect x="14" y="100" width="222" height="22" class="badge-slate" />
    <text x="20" y="115" class="code-dim">distribut: [1, 2, 3, 5, 7, 14, 28]</text>

    <rect x="14" y="126" width="222" height="22" class="badge-slate" />
    <text x="20" y="141" class="code-dim">cache:     [1, 3, 7, 9, 12, 19, 28]</text>

    <!-- Two-pointer merge operation -->
    <text x="14" y="166" class="label-bold">Two-Pointer Linear Intersection:</text>
    <text x="14" y="180" class="label-muted">Complexity: O(L1 + L2) CPU scan</text>

    <!-- Filtering Funnel Badge -->
    <rect x="14" y="196" width="222" height="34" class="badge-indigo" />
    <text x="22" y="210" class="label-bold" fill="#312E81">Corpus Funnel:</text>
    <text x="22" y="224" class="code-indigo">10,000,000 docs ──▶ 250 matches</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 540 205 L 575 205" class="flow-arrow-indigo" marker-end="url(#arrow-indigo)" />

  <!-- ==================== CARD 3: RELEVANCE RANKING ==================== -->
  <g transform="translate(580, 85)">
    <rect width="250" height="240" class="card" stroke="#10B981" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 242 0 Q 250 0 250 8 L 250 24 L 0 24 Z" class="header-emerald" />
    <text x="12" y="16" class="header-text">2. RELEVANCE RANKING (SCORING)</text>

    <!-- Subtitle Mechanism -->
    <text x="14" y="44" class="label-bold">Mechanism: Statistical Scoring</text>
    <rect x="14" y="52" width="222" height="20" class="badge-emerald" />
    <text x="22" y="66" class="code-emerald">Target: Quality (Best doc at Rank 1)</text>

    <!-- Scoring Formulas -->
    <text x="14" y="92" class="label-muted">Okapi BM25 Weighting Factors:</text>

    <rect x="14" y="100" width="222" height="22" class="badge-slate" />
    <text x="20" y="115" class="code-dim">• Term Frequency (TF) saturation</text>

    <rect x="14" y="126" width="222" height="22" class="badge-slate" />
    <text x="20" y="141" class="code-dim">• Inverse Document Frequency (IDF)</text>

    <rect x="14" y="152" width="222" height="22" class="badge-slate" />
    <text x="20" y="167" class="code-dim">• Document length normalization</text>

    <!-- Scope Badge -->
    <rect x="14" y="196" width="222" height="34" class="badge-emerald" />
    <text x="22" y="210" class="label-bold" fill="#065F46">Scoring Workload:</text>
    <text x="22" y="224" class="code-emerald">Scores only 250 candidates</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <path d="M 830 205 L 865 205" class="flow-arrow-emerald" marker-end="url(#arrow-emerald)" />

  <!-- ==================== CARD 4: TOP-K SEARCH RESULTS ==================== -->
  <g transform="translate(870, 85)">
    <rect width="140" height="240" class="card" stroke="#0F172A" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 132 0 Q 140 0 140 8 L 140 24 L 0 24 Z" class="header-dark" />
    <text x="12" y="16" class="header-text">TOP-K RESULTS</text>

    <text x="12" y="44" class="label-bold">Sorted Output:</text>

    <!-- Rank 1 Result -->
    <rect x="10" y="54" width="120" height="42" class="badge-emerald" />
    <text x="16" y="69" class="code-emerald" font-size="11px">Rank 1: Doc 1</text>
    <text x="16" y="86" class="code-dim">BM25: 4.82</text>

    <!-- Rank 2 Result -->
    <rect x="10" y="102" width="120" height="42" class="badge-slate" />
    <text x="16" y="117" class="code-main" font-size="11px">Rank 2: Doc 7</text>
    <text x="16" y="134" class="code-dim">BM25: 3.91</text>

    <!-- Rank 3 Result -->
    <rect x="10" y="150" width="120" height="42" class="badge-slate" />
    <text x="16" y="165" class="code-main" font-size="11px">Rank 3: Doc 3</text>
    <text x="16" y="182" class="code-dim">BM25: 2.15</text>

    <!-- SLA Complete -->
    <rect x="10" y="202" width="120" height="24" class="badge-blue" />
    <text x="16" y="218" class="code-blue" font-size="10px">Total: 18.4ms</text>
  </g>
</svg>
