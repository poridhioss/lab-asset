<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#drop-shadow); rx: 8px; }
      .header-bad { fill: #DC2626; }
      .header-good { fill: #059669; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .code-main { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #1E293B; }
      .code-dim { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #64748B; }
      .code-alert { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #DC2626; }
      .code-green { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #059669; }
      .cell-array { fill: #FEE2E2; stroke: #FCA5A5; stroke-width: 1; rx: 4px; }
      .cell-bucket { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 1; rx: 4px; }
      .badge-red { fill: #FEE2E2; stroke: #EF4444; stroke-width: 1; rx: 4px; }
      .badge-text-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #991B1B; }
      .badge-green { fill: #D1FAE5; stroke: #10B981; stroke-width: 1; rx: 4px; }
      .badge-text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #065F46; }
      .flow-arrow-red { stroke: #DC2626; stroke-width: 2; fill: none; stroke-dasharray: 4 3; animation: flow 1s linear infinite; }
      .flow-arrow-green { stroke: #059669; stroke-width: 2.2; fill: none; stroke-dasharray: 5 4; animation: flow 1s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 14; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="950" height="380" class="bg" />

  <!-- Title Header -->
  <text x="40" y="38" class="title-main">Stop-Word Complexity: Array.includes() vs Set.has()</text>
  <text x="40" y="58" class="title-sub">Why choosing a hashed data structure unlocks a 35x leap in tokenization throughput</text>

  <!-- Left: Naive Array.prototype.includes() -->
  <g transform="translate(40, 85)">
    <rect width="420" height="260" class="card" stroke="#FCA5A5" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 290 0 Q 300 0 300 8 L 300 22 L 0 22 Z" class="header-bad" />
    <text x="12" y="15" class="header-text">NAIVE: Array.prototype.includes() — O(N)</text>
    <text x="16" y="44" class="node-title">Linear Memory Scan (Evaluating 120 Words)</text>
    <text x="16" y="60" class="code-dim">for (let i = 0; i &lt; array.length; i++) { if (array[i] === token) ... }</text>

    <!-- Linear Array Blocks with Scan Arrow -->
    <g transform="translate(16, 75)">
      <rect x="0" y="0" width="42" height="30" class="cell-array" />
      <text x="12" y="19" class="code-alert">"a"</text>

      <rect x="48" y="0" width="42" height="30" class="cell-array" />
      <text x="56" y="19" class="code-alert">"in"</text>

      <rect x="96" y="0" width="42" height="30" class="cell-array" />
      <text x="104" y="19" class="code-alert">"on"</text>

      <rect x="144" y="0" width="42" height="30" class="cell-array" />
      <text x="152" y="19" class="code-alert">"at"</text>

      <text x="194" y="19" class="code-dim">... 116 more checks ...</text>
    </g>

    <!-- Scan Path Indicator -->
    <path d="M 16 118 L 360 118" class="flow-arrow-red" marker-end="url(#arrow-red)" />
    <text x="16" y="136" class="code-dim">CPU dereferences pointers sequentially until match is found</text>

    <!-- Metrics Callout Box -->
    <g transform="translate(16, 155)">
      <rect width="388" height="85" rx="6" fill="#FEF2F2" stroke="#FCA5A5" />
      <text x="12" y="22" class="node-title" fill="#991B1B">Cost Across 10,000-Word Document:</text>
      <text x="12" y="42" class="code-alert">• 600,000 sequential pointer comparisons</text>
      <text x="12" y="60" class="code-alert">• Throughput bottleneck: ~200,000 tokens/sec</text>
      <rect x="290" y="8" width="85" height="18" class="badge-red" />
      <text x="296" y="20" class="badge-text-red">CPU Bottleneck</text>
    </g>
  </g>

  <!-- Right: Hashed Set.prototype.has() -->
  <g transform="translate(490, 85)">
    <rect width="420" height="260" class="card" stroke="#10B981" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 260 0 Q 270 0 270 8 L 270 22 L 0 22 Z" class="header-good" />
    <text x="12" y="15" class="header-text">OPTIMAL: Set.prototype.has() — O(1)</text>
    <text x="16" y="44" class="node-title">Hash Bucket Jump (Instant Resolution)</text>
    <text x="16" y="60" class="code-dim">const index = hash(token) &amp; mask; return buckets[index];</text>

    <!-- Hash Jump Illustration -->
    <g transform="translate(16, 75)">
      <!-- Token Input -->
      <rect x="0" y="0" width="75" height="30" class="cell-bucket" />
      <text x="10" y="19" class="code-green">"with"</text>

      <!-- Hash Arrow -->
      <path d="M 80 15 L 140 15" class="flow-arrow-green" marker-end="url(#arrow-green)" />

      <!-- Bucket Table -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="40" height="30" rx="3" fill="#F1F5F9" stroke="#CBD5E1" />
        <text x="8" y="18" class="code-dim">[0]</text>

        <rect x="44" y="0" width="70" height="30" class="cell-bucket" />
        <text x="50" y="18" class="code-green">Bucket 42</text>

        <rect x="118" y="0" width="40" height="30" rx="3" fill="#F1F5F9" stroke="#CBD5E1" />
        <text x="126" y="18" class="code-dim">[N]</text>
      </g>
    </g>

    <text x="16" y="136" class="code-dim">Constant-time lookup independent of stop-word list size</text>

    <!-- Metrics Callout Box -->
    <g transform="translate(16, 155)">
      <rect width="388" height="85" rx="6" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="12" y="22" class="node-title" fill="#065F46">Cost Across 10,000-Word Document:</text>
      <text x="12" y="42" class="code-green">• Exactly 1 hash calculation per word (O(1))</text>
      <text x="12" y="60" class="code-green">• Throughput achieved: 7,000,000+ tokens/sec</text>
      <rect x="290" y="8" width="85" height="18" class="badge-green" />
      <text x="298" y="20" class="badge-text-green">35x Speedup</text>
    </g>
  </g>
</svg>