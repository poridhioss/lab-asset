<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .flow-path {
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: dashFlow 4s linear infinite;
      }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" class="bg" />

  <!-- Top Center: Search Box Input -->
  <g transform="translate(325, 12)">
    <rect width="250" height="40" rx="20" fill="#FFFFFF" stroke="#334155" stroke-width="1.8" />
    <circle cx="22" cy="20" r="6" fill="none" stroke="#64748B" stroke-width="1.6" />
    <line x1="26" y1="24" x2="32" y2="30" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" />
    <text x="42" y="25" class="txt-code" font-size="14px" font-weight="700" fill="#1E293B">re|</text>
    <rect x="180" y="8" width="58" height="24" rx="12" fill="#F1F5F9" />
    <text x="209" y="24" text-anchor="middle" class="txt-badge" fill="#64748B">ENTER</text>
  </g>

  <!-- Branching Flow Connectors -->
  <path d="M 380 52 Q 250 75 220 90" class="flow-path" stroke="#2563EB" marker-end="url(#arr-blue)" />
  <path d="M 520 52 Q 650 75 680 90" class="flow-path" stroke="#16A34A" marker-end="url(#arr-green)" />

  <!-- LEFT: While You Type (Suggestions) -->
  <g transform="translate(30, 85)">
    <rect width="405" height="140" class="sketch-box" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" />
    <rect x="14" y="10" width="135" height="18" rx="3" fill="#DBEAFE" />
    <text x="20" y="23" class="txt-badge" fill="#1D4ED8">WHILE YOU TYPE</text>
    <text x="160" y="24" class="txt-title" fill="#1E40AF">Search Suggestions</text>

    <!-- Suggestion Chips -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#93C5FD" />
      <text x="35" y="16" text-anchor="middle" class="txt-code" fill="#1E40AF">"redis"</text>

      <rect x="78" y="0" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#93C5FD" />
      <text x="113" y="16" text-anchor="middle" class="txt-code" fill="#1E40AF">"react"</text>

      <rect x="156" y="0" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#93C5FD" />
      <text x="191" y="16" text-anchor="middle" class="txt-code" fill="#1E40AF">"regex"</text>

      <rect x="236" y="0" width="140" height="24" rx="4" fill="#DBEAFE" />
      <text x="306" y="16" text-anchor="middle" class="txt-badge" fill="#1D4ED8">&lt; 5ms Keystroke Latency</text>
    </g>

    <!-- Sublabel -->
    <rect x="14" y="74" width="377" height="48" rx="6" fill="#FFFFFF" stroke="#BFDBFE" />
    <text x="24" y="93" class="txt-sub" fill="#1E3A8A">&#8226; Autocomplete predicts user intent before you finish typing</text>
    <text x="24" y="111" class="txt-badge" fill="#2563EB">Powered by Character Trie + Bounded Min-Heap (Labs 3 &amp; 4)</text>
  </g>

  <!-- RIGHT: When You Press Enter (Full-Text Search) -->
  <g transform="translate(465, 85)">
    <rect width="405" height="140" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8" />
    <rect x="14" y="10" width="155" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="23" class="txt-badge" fill="#15803D">WHEN YOU PRESS ENTER</text>
    <text x="180" y="24" class="txt-title" fill="#14532D">Full-Text Search</text>

    <!-- Action Chips -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="115" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
      <text x="57" y="16" text-anchor="middle" class="txt-code" fill="#15803D">Tokenize Query</text>

      <rect x="123" y="0" width="125" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
      <text x="185" y="16" text-anchor="middle" class="txt-code" fill="#15803D">Intersect Postings</text>

      <rect x="256" y="0" width="120" height="24" rx="4" fill="#DCFCE7" />
      <text x="316" y="16" text-anchor="middle" class="txt-badge" fill="#15803D">Rank by Relevance</text>
    </g>

    <!-- Sublabel -->
    <rect x="14" y="74" width="377" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="24" y="93" class="txt-sub" fill="#14532D">&#8226; Scans millions of documents and returns best answers at top</text>
    <text x="24" y="111" class="txt-badge" fill="#16A34A">Powered by Inverted Index + Relevance Scorer (Labs 1, 2 &amp; 5)</text>
  </g>
</svg>