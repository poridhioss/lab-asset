<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="170" class="bg" />

  <!-- LEFT: The Unfiltered Cardinality Leak -->
  <g transform="translate(20, 15)">
    <rect width="400" height="140" class="sketch-box" fill="#FEF2F2" stroke="#F87171" />
    <rect x="12" y="10" width="170" height="18" rx="3" fill="#FEE2E2" />
    <text x="18" y="23" class="txt-badge" fill="#991B1B">NAIVE: UNFILTERED IDENTIFIERS</text>
    <text x="195" y="24" class="txt-title" fill="#991B1B">Cardinality Explosion</text>

    <!-- Raw Stream -->
    <rect x="12" y="38" width="376" height="26" rx="4" fill="#FFFFFF" stroke="#FECACA" />
    <text x="22" y="55" class="txt-code" fill="#7F1D1D">Log: "req 550e8400-e29b-41d4... failed at 0x7fff"</text>

    <!-- Flow -->
    <text x="22" y="80" class="txt-sub" fill="#B91C1C">&#8595; Every unique UUID enters Lexicon Map as unique key &#8595;</text>

    <!-- Impact Badge -->
    <rect x="12" y="90" width="376" height="34" rx="4" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
    <text x="24" y="111" class="txt-badge" fill="#991B1B">&#9888; Lexicon balloons to millions of keys &#8594; RAM OOM Crash</text>
  </g>

  <!-- RIGHT: Normalized Token Classifier -->
  <g transform="translate(440, 15)">
    <rect width="400" height="140" class="sketch-box" fill="#F0FDF4" stroke="#86EFAC" />
    <rect x="12" y="10" width="170" height="18" rx="3" fill="#DCFCE7" />
    <text x="18" y="23" class="txt-badge" fill="#166534">PRODUCTION: TOKEN CLASSIFIER</text>
    <text x="195" y="24" class="txt-title" fill="#14532D">Bounded Footprint</text>

    <!-- Normalized Stream -->
    <rect x="12" y="38" width="376" height="26" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="22" y="55" class="txt-code" fill="#14532D">Classifier: UUID &#8594; __UUID__ | Hex &#8594; __HEX__</text>

    <!-- Flow -->
    <text x="22" y="80" class="txt-sub" fill="#15803D">&#8595; Millions of IDs collapse into single normalized tokens &#8595;</text>

    <!-- Success Badge -->
    <rect x="12" y="90" width="376" height="34" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
    <text x="24" y="111" class="txt-badge" fill="#166534">&#10003; Lexicon Dictionary stays bounded (&lt; 50 MB RAM)</text>
  </g>
</svg>