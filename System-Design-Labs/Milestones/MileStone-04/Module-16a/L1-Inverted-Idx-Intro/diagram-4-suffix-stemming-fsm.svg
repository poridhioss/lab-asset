<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#drop-shadow); rx: 8px; }
      .header-blue { fill: #2563EB; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; }
      .node-card { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.2; rx: 6px; }
      .node-decision { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; rx: 6px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0F172A; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .code-main { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #1E293B; }
      .code-green { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #059669; }
      .badge-green { fill: #D1FAE5; stroke: #10B981; stroke-width: 1; rx: 4px; }
      .badge-text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #065F46; }
      .flow-arrow { stroke: #2563EB; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: flow 1.2s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 18; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="950" height="440" class="bg" />

  <!-- Title Header -->
  <text x="40" y="38" class="title-main">Deterministic Suffix Stemming Decision Tree</text>
  <text x="40" y="58" class="title-sub">Rule-based morphological reduction that maps grammatical variants to shared lexical stems</text>

  <!-- Input Token Node -->
  <g transform="translate(40, 85)">
    <rect width="180" height="55" class="card" stroke="#3B82F6" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 170 0 Q 180 0 180 8 L 180 18 L 0 18 Z" class="header-blue" />
    <text x="10" y="13" class="header-text">INPUT CANDIDATE TOKEN</text>
    <text x="12" y="38" class="code-main">token (e.g. "leaders")</text>
  </g>

  <!-- Root Connector to Decision Hub -->
  <path d="M 220 112 L 270 112" class="flow-arrow" marker-end="url(#arrow-blue)" />

  <!-- Branch 1: Short Root & Invariant Protection -->
  <g transform="translate(280, 85)">
    <rect width="300" height="70" class="node-decision" />
    <text x="12" y="22" class="node-title">1. Guard Checks: Length &amp; Invariants</text>
    <text x="12" y="40" class="code-main">length &lt;= 3  ||  ends with "ss", "us", "is"</text>
    <rect x="12" y="48" width="276" height="16" class="badge-green" />
    <text x="16" y="60" class="badge-text-green">PRESERVE INTACT: "run", "key", "consensus", "this"</text>
  </g>

  <!-- Flow to Morphological Rules -->
  <path d="M 430 155 L 430 185" class="flow-arrow" marker-end="url(#arrow-blue)" />

  <!-- Core Rules Container -->
  <g transform="translate(40, 195)">
    <rect width="870" height="215" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 300 0 Q 310 0 310 8 L 310 22 L 0 22 Z" class="header-blue" />
    <text x="12" y="15" class="header-text">2. MORPHOLOGICAL SUFFIX STRIPPING RULES</text>

    <!-- Rule 1: Plurals -->
    <g transform="translate(20, 40)">
      <rect width="250" height="150" class="node-card" />
      <text x="12" y="24" class="node-title">Plural Suffix Rules</text>
      <text x="12" y="46" class="code-main">• -sses -&gt; -ss ("processes" -&gt; "process")</text>
      <text x="12" y="66" class="code-main">• -ies  -&gt; -y  ("entries"   -&gt; "entry")</text>
      <text x="12" y="86" class="code-main">• -s    -&gt; ''  ("leaders"   -&gt; "leader")</text>
      <rect x="12" y="112" width="135" height="22" class="badge-green" />
      <text x="18" y="127" class="badge-text-green">Result: Singular Root</text>
    </g>

    <!-- Rule 2: Verb Tenses -->
    <g transform="translate(290, 40)">
      <rect width="270" height="150" class="node-card" />
      <text x="12" y="24" class="node-title">Tense &amp; Progressive Rules</text>
      <text x="12" y="46" class="code-main">• -ing (len &gt; 5) -&gt; chop suffix</text>
      <text x="12" y="66" class="code-main">• -ed  (len &gt; 4) -&gt; chop suffix</text>
      <text x="12" y="86" class="code-main">• Deduplicate double consonants</text>
      <rect x="12" y="112" width="170" height="22" class="badge-green" />
      <text x="18" y="127" class="badge-text-green">Result: "sharding" -&gt; "shard"</text>
    </g>

    <!-- Rule 3: Output Contract -->
    <g transform="translate(580, 40)">
      <rect width="270" height="150" class="node-card" stroke="#10B981" />
      <text x="12" y="24" class="node-title" fill="#065F46">The Output Contract</text>
      <text x="12" y="46" class="node-desc">Guarantees that user searching for:</text>
      <text x="12" y="66" class="code-green">"replicated" AND "leaders"</text>
      <text x="12" y="86" class="node-desc">Cleanly matches document discussing:</text>
      <text x="12" y="106" class="code-green">"replicate" AND "leader"</text>
      <rect x="12" y="120" width="130" height="20" class="badge-green" />
      <text x="18" y="134" class="badge-text-green">Zero False Mismatches</text>
    </g>
  </g>
</svg>