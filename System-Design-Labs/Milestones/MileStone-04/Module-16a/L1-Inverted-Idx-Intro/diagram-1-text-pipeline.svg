<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#drop-shadow); rx: 8px; }
      .header-blue { fill: #2563EB; }
      .header-green { fill: #059669; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748B; }
      .code-main { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #1E293B; }
      .code-dim { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #64748B; }
      .code-blue { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #2563EB; }
      .code-green { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #059669; }
      .code-red { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #DC2626; text-decoration: line-through; }
      .token-pill { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1; rx: 4px; }
      .token-pill-drop { fill: #FEE2E2; stroke: #FCA5A5; stroke-width: 1; rx: 4px; }
      .token-pill-final { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 1.2; rx: 4px; }
      .flow-arrow { stroke: #2563EB; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: flow 1.2s linear infinite; }
      @keyframes flow {
        from { stroke-dashoffset: 18; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1050" height="440" class="bg" />

  <!-- Title Header -->
  <text x="40" y="38" class="title-main">The Five Sequential Transformations of a Raw String</text>
  <text x="40" y="58" class="title-sub">Step-by-step token extraction showing how noisy human writing collapses into deterministic search terms</text>

  <!-- Input Card -->
  <g transform="translate(40, 85)">
    <rect width="970" height="60" class="card" stroke="#3B82F6" stroke-width="1.8" />
    <path d="M 0 8 Q 0 0 8 0 L 170 0 Q 180 0 180 8 L 180 22 L 0 22 Z" class="header-blue" />
    <text x="12" y="15" class="header-text">RAW HUMAN INPUT</text>
    <text x="20" y="44" class="code-main">"Raft is a Distributed Consensus algorithm—designed for Leaders!"</text>
  </g>

  <!-- Connector Down to Row 1 -->
  <path d="M 525 145 L 525 170" class="flow-arrow" marker-end="url(#arrow-blue)" />

  <!-- Row 1: Stages 1 and 2 -->
  <g transform="translate(40, 175)">
    <!-- Stage 1: Case Folding -->
    <g transform="translate(0, 0)">
      <rect width="465" height="85" class="card" />
      <path d="M 0 8 Q 0 0 8 0 L 190 0 Q 200 0 200 8 L 200 22 L 0 22 Z" class="header-blue" />
      <text x="12" y="15" class="header-text">1. CASE FOLDING</text>
      <text x="14" y="44" class="code-dim">toLowerCase()</text>
      <text x="14" y="66" class="code-main">"raft is a distributed consensus algorithm—designed for leaders!"</text>
    </g>

    <!-- Flow Connector Between Stage 1 and Stage 2 -->
    <path d="M 465 42 L 500 42" class="flow-arrow" marker-end="url(#arrow-blue)" />

    <!-- Stage 2: Unicode Punctuation Stripping -->
    <g transform="translate(505, 0)">
      <rect width="465" height="85" class="card" />
      <path d="M 0 8 Q 0 0 8 0 L 220 0 Q 230 0 230 8 L 230 22 L 0 22 Z" class="header-blue" />
      <text x="12" y="15" class="header-text">2. UNICODE PUNCTUATION</text>
      <text x="14" y="44" class="code-dim">/[^\p{L}\p{N}\s]/gu -&gt; ' '</text>
      <text x="14" y="66" class="code-main">"raft is a distributed consensus algorithm  designed for leaders "</text>
    </g>
  </g>

  <!-- Connector Down to Row 2 -->
  <path d="M 737 260 L 737 285 L 272 285 L 272 305" class="flow-arrow" marker-end="url(#arrow-blue)" />

  <!-- Row 2: Stages 3, 4, 5 -->
  <g transform="translate(40, 315)">
    <!-- Stage 3 & 4: Split & Stopwords Filter -->
    <g transform="translate(0, 0)">
      <rect width="465" height="95" class="card" />
      <path d="M 0 8 Q 0 0 8 0 L 240 0 Q 250 0 250 8 L 250 22 L 0 22 Z" class="header-blue" />
      <text x="12" y="15" class="header-text">3 &amp; 4. SPLIT &amp; STOPWORD FILTER</text>
      <text x="14" y="42" class="code-dim">split(/\s+/) + Set.has() filter</text>

      <!-- Token Pills (Kept vs Dropped) -->
      <g transform="translate(14, 55)">
        <rect x="0" y="0" width="46" height="24" class="token-pill" />
        <text x="8" y="16" class="code-blue">raft</text>

        <rect x="52" y="0" width="34" height="24" class="token-pill-drop" />
        <text x="60" y="16" class="code-red">is</text>

        <rect x="92" y="0" width="30" height="24" class="token-pill-drop" />
        <text x="101" y="16" class="code-red">a</text>

        <rect x="128" y="0" width="76" height="24" class="token-pill" />
        <text x="136" y="16" class="code-blue">distributed</text>

        <rect x="210" y="0" width="76" height="24" class="token-pill" />
        <text x="218" y="16" class="code-blue">consensus</text>

        <rect x="292" y="0" width="70" height="24" class="token-pill" />
        <text x="299" y="16" class="code-blue">algorithm</text>

        <rect x="368" y="0" width="40" height="24" class="token-pill-drop" />
        <text x="376" y="16" class="code-red">for</text>
      </g>
    </g>

    <!-- Connector Between Stages -->
    <path d="M 465 47 L 500 47" class="flow-arrow" marker-end="url(#arrow-blue)" />

    <!-- Stage 5: Suffix Stemming & Final Array -->
    <g transform="translate(505, 0)">
      <rect width="465" height="95" class="card" stroke="#10B981" />
      <path d="M 0 8 Q 0 0 8 0 L 250 0 Q 260 0 260 8 L 260 22 L 0 22 Z" class="header-green" />
      <text x="12" y="15" class="header-text">5. SUFFIX STEMMING &amp; OUTPUT</text>
      <text x="14" y="42" class="code-dim">Rule-based suffix stripping -&gt; Clean Token Array</text>

      <!-- Final Stemmed Tokens -->
      <g transform="translate(14, 55)">
        <rect x="0" y="0" width="44" height="24" class="token-pill-final" />
        <text x="8" y="16" class="code-green">raft</text>

        <rect x="50" y="0" width="62" height="24" class="token-pill-final" />
        <text x="56" y="16" class="code-green">distribut</text>

        <rect x="118" y="0" width="76" height="24" class="token-pill-final" />
        <text x="125" y="16" class="code-green">consensus</text>

        <rect x="200" y="0" width="70" height="24" class="token-pill-final" />
        <text x="206" y="16" class="code-green">algorithm</text>

        <rect x="276" y="0" width="56" height="24" class="token-pill-final" />
        <text x="283" y="16" class="code-green">design</text>

        <rect x="338" y="0" width="52" height="24" class="token-pill-final" />
        <text x="345" y="16" class="code-green">leader</text>
      </g>
    </g>
  </g>
</svg>