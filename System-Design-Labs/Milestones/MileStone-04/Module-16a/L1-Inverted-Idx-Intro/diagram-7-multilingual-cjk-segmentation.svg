<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="170" class="bg" />

  <!-- LEFT: Latin Whitespace Splitting -->
  <g transform="translate(20, 15)">
    <rect width="400" height="140" class="sketch-box" fill="#F0FDF4" stroke="#86EFAC" />
    <rect x="12" y="10" width="165" height="18" rx="3" fill="#DCFCE7" />
    <text x="18" y="23" class="txt-badge" fill="#166534">LATIN: WHITESPACE BOUNDARIES</text>
    <text x="190" y="24" class="txt-title" fill="#14532D">Simple Regex Split</text>

    <!-- Raw String -->
    <rect x="12" y="38" width="376" height="26" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="22" y="55" class="txt-code" fill="#334155">Input: "cache clustering and sharding"</text>

    <!-- Split Action -->
    <text x="22" y="80" class="txt-sub" fill="#15803D">&#8595; String.prototype.split(/\s+/) &#8595;</text>

    <!-- Result Tokens -->
    <g transform="translate(12, 90)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#FFFFFF" stroke="#16A34A" />
      <text x="37" y="16" text-anchor="middle" class="txt-code" fill="#15803D">"cache"</text>

      <rect x="85" y="0" width="95" height="24" rx="4" fill="#FFFFFF" stroke="#16A34A" />
      <text x="132" y="16" text-anchor="middle" class="txt-code" fill="#15803D">"clustering"</text>

      <rect x="190" y="0" width="85" height="24" rx="4" fill="#FFFFFF" stroke="#16A34A" />
      <text x="232" y="16" text-anchor="middle" class="txt-code" fill="#15803D">"sharding"</text>

      <rect x="285" y="0" width="90" height="24" rx="4" fill="#DCFCE7" />
      <text x="330" y="16" text-anchor="middle" class="txt-badge" fill="#166534">Native O(1)</text>
    </g>

    <text x="22" y="132" class="txt-sub" fill="#166534">Spaces define distinct semantic tokens naturally.</text>
  </g>

  <!-- RIGHT: CJK Morphological Segmentation -->
  <g transform="translate(440, 15)">
    <rect width="400" height="140" class="sketch-box" fill="#EFF6FF" stroke="#93C5FD" />
    <rect x="12" y="10" width="165" height="18" rx="3" fill="#DBEAFE" />
    <text x="18" y="23" class="txt-badge" fill="#1E40AF">CJK: NO WHITESPACES</text>
    <text x="190" y="24" class="txt-title" fill="#1E40AF">Morphological Segmenter</text>

    <!-- Raw String -->
    <rect x="12" y="38" width="376" height="26" rx="4" fill="#FFFFFF" stroke="#93C5FD" />
    <text x="22" y="55" class="txt-code" fill="#1E3A8A">Input: "分散型サーバ" (Distributed Server)</text>

    <!-- Split Action -->
    <text x="22" y="80" class="txt-sub" fill="#1D4ED8">&#8595; Intl.Segmenter('ja', { granularity: 'word' }) &#8595;</text>

    <!-- Result Tokens -->
    <g transform="translate(12, 90)">
      <rect x="0" y="0" width="110" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" />
      <text x="55" y="16" text-anchor="middle" class="txt-code" fill="#1D4ED8">"分散型" (distr)</text>

      <rect x="120" y="0" width="115" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" />
      <text x="177" y="16" text-anchor="middle" class="txt-code" fill="#1D4ED8">"サーバ" (server)</text>

      <rect x="245" y="0" width="130" height="24" rx="4" fill="#DBEAFE" />
      <text x="310" y="16" text-anchor="middle" class="txt-badge" fill="#1D4ED8">Morphology Match</text>
    </g>

    <text x="22" y="132" class="txt-sub" fill="#1D4ED8">Requires linguistic segmentation engine or character N-grams.</text>
  </g>
</svg>