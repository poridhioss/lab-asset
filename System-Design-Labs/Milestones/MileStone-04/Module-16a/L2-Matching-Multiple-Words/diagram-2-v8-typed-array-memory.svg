<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .card-red { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1.5; rx: 8px; }
      .card-green { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 2; rx: 8px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0F172A; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .badge-red { fill: #DC2626; rx: 4px; }
      .badge-green { fill: #059669; rx: 4px; }
      .cell-ptr { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 3px; }
      .cell-obj { fill: #FFFFFF; stroke: #FCA5A5; stroke-width: 1.5; rx: 4px; }
      .cell-packed { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; rx: 3px; }
      .wire-ptr { stroke: #DC2626; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
      .wire-cache { stroke: #059669; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Global Header -->
  <text x="40" y="38" class="text-title">V8 Engine Memory Layout: Dynamic Object Arrays vs Contiguous Typed Buffers</text>
  <text x="40" y="58" class="text-subtitle">How Uint32Array Eliminates Pointer Chasing and Generational Garbage Collection Overhead</text>

  <!-- Top Container: Dynamic Object Graph -->
  <g transform="translate(40, 85)">
    <rect width="880" height="160" class="card-red" />
    <rect x="15" y="15" width="135" height="18" class="badge-red" />
    <text x="22" y="28" class="text-badge">POINTER CHASING &amp; GC</text>
    <text x="160" y="28" class="text-heading" fill="#991B1B">Standard JavaScript Array of Objects: Array&lt;{ docId, tf }&gt;</text>

    <!-- FixedArray of Pointers -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="220" height="45" class="cell-ptr" />
      <text x="10" y="18" class="text-subtitle" fill="#475569">V8 FixedArray (64-bit Pointers)</text>
      <text x="10" y="34" class="text-code" font-size="10">[ ptr_0x1A40, ptr_0x2B80, ... ]</text>
    </g>

    <!-- Scattered Heap Objects -->
    <g transform="translate(265, 45)">
      <!-- Heap Object 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="55" class="cell-obj" />
        <text x="10" y="18" class="text-code" font-size="10" font-weight="700" fill="#991B1B">Object @ 0x1A40 (48B)</text>
        <text x="10" y="34" class="text-body" font-size="10">Hidden Class Map (8B)</text>
        <text x="10" y="48" class="text-body" font-size="10">docId: 104 (8B) | tf: 2 (8B)</text>
      </g>

      <!-- Heap Object 2 -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="55" class="cell-obj" />
        <text x="10" y="18" class="text-code" font-size="10" font-weight="700" fill="#991B1B">Object @ 0x2B80 (48B)</text>
        <text x="10" y="34" class="text-body" font-size="10">Hidden Class Map (8B)</text>
        <text x="10" y="48" class="text-body" font-size="10">docId: 108 (8B) | tf: 1 (8B)</text>
      </g>

      <!-- Heap Object 3 -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="55" class="cell-obj" />
        <text x="10" y="18" class="text-code" font-size="10" font-weight="700" fill="#991B1B">Object @ 0x3C10 (48B)</text>
        <text x="10" y="34" class="text-body" font-size="10">Hidden Class Map (8B)</text>
        <text x="10" y="48" class="text-body" font-size="10">docId: 115 (8B) | tf: 4 (8B)</text>
      </g>

      <!-- Pointer Lines -->
      <path d="M -30 25 L -5 25" class="wire-ptr" marker-end="url(#arr-red)" />
    </g>

    <!-- Metrics Callout -->
    <rect x="15" y="115" width="850" height="30" rx="4" fill="#FFFFFF" stroke="#FECACA" />
    <text x="25" y="134" class="text-body" font-size="11" fill="#991B1B">
      <tspan font-weight="700">Hardware Impact:</tspan> 48–64 bytes/posting • Pointer dereferencing across memory pages causes L1/L2 cache misses • Scavenger GC must inspect every object
    </text>
  </g>

  <!-- Bottom Container: Contiguous Typed Buffer -->
  <g transform="translate(40, 265)">
    <rect width="880" height="165" class="card-green" />
    <rect x="15" y="15" width="135" height="18" class="badge-green" />
    <text x="22" y="28" class="text-badge">HARDWARE STREAMING</text>
    <text x="160" y="28" class="text-heading" fill="#065F46">Contiguous Typed Buffer: Uint32Array(ArrayBuffer)</text>

    <!-- Packed Memory Blocks -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="75" height="32" class="cell-packed" />
      <text x="14" y="20" class="text-code" font-weight="700" fill="#065F46">104 (4B)</text>

      <rect x="80" y="0" width="75" height="32" class="cell-packed" />
      <text x="94" y="20" class="text-code" font-weight="700" fill="#065F46">108 (4B)</text>

      <rect x="160" y="0" width="75" height="32" class="cell-packed" />
      <text x="174" y="20" class="text-code" font-weight="700" fill="#065F46">115 (4B)</text>

      <rect x="240" y="0" width="75" height="32" class="cell-packed" />
      <text x="254" y="20" class="text-code" font-weight="700" fill="#065F46">120 (4B)</text>

      <rect x="320" y="0" width="75" height="32" class="cell-packed" />
      <text x="334" y="20" class="text-code" font-weight="700" fill="#065F46">135 (4B)</text>

      <rect x="400" y="0" width="75" height="32" class="cell-packed" />
      <text x="414" y="20" class="text-code" font-weight="700" fill="#065F46">142 (4B)</text>

      <rect x="480" y="0" width="75" height="32" class="cell-packed" />
      <text x="494" y="20" class="text-code" font-weight="700" fill="#065F46">160 (4B)</text>

      <rect x="560" y="0" width="75" height="32" class="cell-packed" />
      <text x="574" y="20" class="text-code" font-weight="700" fill="#065F46">175 (4B)</text>
    </g>

    <!-- Cache Line Bracket -->
    <g transform="translate(15, 85)">
      <path d="M 0 0 L 0 8 L 635 8 L 635 0" class="wire-cache" />
      <text x="220" y="22" class="text-code" font-size="10" font-weight="700" fill="#059669">Single 64-Byte CPU Cache Line (Fetches 16 Doc IDs in 1 Memory Cycle)</text>
    </g>

    <!-- Metrics Callout -->
    <rect x="15" y="115" width="850" height="35" rx="4" fill="#FFFFFF" stroke="#A7F3D0" />
    <text x="25" y="136" class="text-body" font-size="11" fill="#065F46">
      <tspan font-weight="700">Hardware Impact:</tspan> Exactly 4 bytes per DocID (85%+ RAM Reduction) • Sequential prefetch keeps CPU pipelines full • GC-Invisible (zero scavenger pause)
    </text>
  </g>
</svg>
