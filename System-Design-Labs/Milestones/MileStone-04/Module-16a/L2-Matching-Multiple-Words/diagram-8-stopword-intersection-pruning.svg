<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .txt-note { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arr-red8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arr-green8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="170" class="bg" />

  <!-- LEFT: Raw User Order -->
  <g transform="translate(20, 14)">
    <rect width="395" height="142" class="sketch-box" fill="#FEF2F2" stroke="#FCA5A5" />
    <rect x="12" y="8" width="125" height="18" rx="3" fill="#FEE2E2" />
    <text x="18" y="21" class="txt-badge" fill="#991B1B">RAW INPUT ORDER</text>
    <text x="150" y="22" class="txt-title" fill="#991B1B">Stopword Explosion</text>

    <!-- Query step -->
    <rect x="12" y="34" width="371" height="26" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="20" y="51" class="txt-code" fill="#334155">Query: "the best distributed storage"</text>

    <!-- Flow -->
    <rect x="12" y="68" width="130" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="18" y="84" class="txt-code" fill="#991B1B">"the" (8.2M docs)</text>

    <path d="M 148 80 L 176 80" class="arrow" stroke="#EF4444" marker-end="url(#arr-red8)" />

    <rect x="182" y="68" width="135" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="188" y="84" class="txt-code" fill="#991B1B">"best" (3.1M docs)</text>

    <!-- Callout -->
    <text x="14" y="122" class="txt-note" fill="#991B1B">&#9888; 8,000,000+ comparisons before reaching rarest term &#8226; &gt;500ms Timeout</text>
  </g>

  <!-- RIGHT: Filtered + Shortest-List-First -->
  <g transform="translate(445, 14)">
    <rect width="395" height="142" class="sketch-box" fill="#F0FDF4" stroke="#86EFAC" />
    <rect x="12" y="8" width="130" height="18" rx="3" fill="#DCFCE7" />
    <text x="18" y="21" class="txt-badge" fill="#166534">FILTER + SORT PLAN</text>
    <text x="155" y="22" class="txt-title" fill="#166534">Pruned &amp; Shortest-First</text>

    <!-- Query step -->
    <rect x="12" y="34" width="371" height="26" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="20" y="51" class="txt-code" fill="#166534">Drop Stopwords &#8594; Sort ascending by DF</text>

    <!-- Flow -->
    <rect x="12" y="68" width="165" height="24" rx="4" fill="#DCFCE7" stroke="#10B981" />
    <text x="18" y="84" class="txt-code" fill="#166534">"distributed" (12k)</text>

    <path d="M 183 80 L 210 80" class="arrow" stroke="#10B981" marker-end="url(#arr-green8)" />

    <rect x="216" y="68" width="145" height="24" rx="4" fill="#DCFCE7" stroke="#10B981" />
    <text x="222" y="84" class="txt-code" fill="#166534">"storage" (45k)</text>

    <!-- Callout -->
    <text x="14" y="122" class="txt-note" fill="#166534">&#10004; Intermediate candidates instantly shrink to 780 docs &#8226; 0.4ms</text>
  </g>
</svg>
