<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .txt-note { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="180" class="bg" />

  <!-- TOP CARD: Naive Linear Scan -->
  <g transform="translate(20, 14)">
    <rect width="820" height="68" class="sketch-box" fill="#FEF2F2" stroke="#FCA5A5" />
    <rect x="12" y="8" width="130" height="18" rx="3" fill="#FEE2E2" />
    <text x="18" y="21" class="txt-badge" fill="#991B1B">NAIVE TWO-POINTER</text>
    <text x="155" y="22" class="txt-title" fill="#991B1B">Sequential step-by-step scan over 10M elements</text>

    <!-- Node chips -->
    <rect x="12" y="34" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="26" y="50" class="txt-code" fill="#334155">1</text>
    <path d="M 60 46 L 76 46" class="arrow" stroke="#EF4444" marker-end="url(#arr-red)" />

    <rect x="80" y="34" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="94" y="50" class="txt-code" fill="#334155">2</text>
    <path d="M 128 46 L 144 46" class="arrow" stroke="#EF4444" marker-end="url(#arr-red)" />

    <rect x="148" y="34" width="46" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="162" y="50" class="txt-code" fill="#334155">3</text>
    <path d="M 196 46 L 214 46" class="arrow" stroke="#EF4444" stroke-dasharray="3 3" marker-end="url(#arr-red)" />

    <rect x="218" y="34" width="60" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5" />
    <text x="228" y="50" class="txt-code" fill="#64748B">... 10M</text>

    <!-- Stat callout -->
    <text x="310" y="51" class="txt-note" fill="#991B1B">&#9888; 10,000,000 comparisons &#8226; Memory bandwidth saturated &#8226; O(L1 + L2)</text>
  </g>

  <!-- BOTTOM CARD: Skip Pointers -->
  <g transform="translate(20, 94)">
    <rect width="820" height="74" class="sketch-box" fill="#F0FDF4" stroke="#86EFAC" />
    <rect x="12" y="8" width="105" height="18" rx="3" fill="#DCFCE7" />
    <text x="18" y="21" class="txt-badge" fill="#166534">SKIP POINTERS</text>
    <text x="130" y="22" class="txt-title" fill="#166534">Leaping &#8730;L (3,162) blocks when skip target &lt; query docId</text>

    <!-- Node chips with skip arcs -->
    <rect x="12" y="36" width="56" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="26" y="52" class="txt-code" fill="#166534">1</text>

    <!-- Arc 1 -->
    <path d="M 70 42 Q 135 18 198 42" class="arrow" stroke="#10B981" stroke-width="1.8" marker-end="url(#arr-green)" />
    <text x="110" y="26" class="txt-badge" fill="#047857">+3,162</text>

    <rect x="202" y="36" width="64" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="210" y="52" class="txt-code" fill="#166534">3,162</text>

    <!-- Arc 2 -->
    <path d="M 268 42 Q 335 18 398 42" class="arrow" stroke="#10B981" stroke-width="1.8" marker-end="url(#arr-green)" />
    <text x="310" y="26" class="txt-badge" fill="#047857">+3,162</text>

    <rect x="402" y="36" width="64" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="410" y="52" class="txt-code" fill="#166534">6,324</text>

    <!-- Arc 3 to match -->
    <path d="M 468 42 Q 535 18 598 42" class="arrow" stroke="#10B981" stroke-width="1.8" marker-end="url(#arr-green)" />
    <text x="510" y="26" class="txt-badge" fill="#047857">+3,162</text>

    <rect x="602" y="36" width="80" height="24" rx="4" fill="#DCFCE7" stroke="#10B981" stroke-width="1.6" />
    <text x="612" y="52" class="txt-code" fill="#166534">9,486 &#10003;</text>

    <!-- Stat callout -->
    <text x="696" y="52" class="txt-note" fill="#166534">&#10004; 3,162 checks &#8226; O(&#8730;L)</text>
  </g>
</svg>
