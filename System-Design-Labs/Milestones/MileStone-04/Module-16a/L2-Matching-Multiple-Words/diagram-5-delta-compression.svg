<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .card { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
      .card-accent { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0F172A; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .badge-blue { fill: #2563EB; rx: 4px; }
      .badge-green { fill: #059669; rx: 4px; }
      .cell-raw { fill: #FFFFFF; stroke: #93C5FD; stroke-width: 1.5; rx: 4px; }
      .cell-delta { fill: #D1FAE5; stroke: #059669; stroke-width: 1.5; rx: 4px; }
      .wire-step { stroke: #2563EB; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .wire-recon { stroke: #059669; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" />

  <!-- Global Header -->
  <text x="40" y="38" class="text-title">Delta Gap Compression: Slashing Inverted Index RAM by 70%+</text>
  <text x="40" y="58" class="text-subtitle">Exploiting Strictly Monotonic Sequences: Storing Differences in Variable-Byte Format</text>

  <!-- Stage 1: Raw Monotonic Doc IDs -->
  <g transform="translate(40, 85)">
    <rect width="880" height="90" class="card" />
    <rect x="15" y="15" width="135" height="18" class="badge-blue" />
    <text x="22" y="28" class="text-badge">RAW 32-BIT INTEGERS</text>
    <text x="160" y="28" class="text-heading">Fixed 4-Byte Storage (D0 &lt; D1 &lt; D2 &lt; ...)</text>

    <!-- Raw Value Cells -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="105" height="30" class="cell-raw" />
      <text x="12" y="20" class="text-code">D0 = 1000</text>

      <rect x="115" y="0" width="105" height="30" class="cell-raw" />
      <text x="127" y="20" class="text-code">D1 = 1004</text>

      <rect x="230" y="0" width="105" height="30" class="cell-raw" />
      <text x="242" y="20" class="text-code">D2 = 1007</text>

      <rect x="345" y="0" width="105" height="30" class="cell-raw" />
      <text x="357" y="20" class="text-code">D3 = 1012</text>

      <rect x="460" y="0" width="105" height="30" class="cell-raw" />
      <text x="472" y="20" class="text-code">D4 = 1015</text>

      <rect x="575" y="0" width="105" height="30" class="cell-raw" />
      <text x="587" y="20" class="text-code">D5 = 1022</text>

      <!-- Cost Tag -->
      <text x="710" y="20" class="text-code" font-weight="700" fill="#2563EB">24 Bytes Total</text>
      <text x="800" y="20" class="text-body" fill="#64748B">(6 × 4B)</text>
    </g>
  </g>

  <!-- Transition Arrows -->
  <path d="M 105 180 L 105 200" class="wire-step" marker-end="url(#arr-blue)" />
  <path d="M 220 180 L 220 200" class="wire-step" marker-end="url(#arr-blue)" />
  <path d="M 335 180 L 335 200" class="wire-step" marker-end="url(#arr-blue)" />
  <path d="M 450 180 L 450 200" class="wire-step" marker-end="url(#arr-blue)" />
  <path d="M 565 180 L 565 200" class="wire-step" marker-end="url(#arr-blue)" />
  <path d="M 680 180 L 680 200" class="wire-step" marker-end="url(#arr-blue)" />

  <!-- Stage 2: Delta Difference Encoding & Variable Byte Packing -->
  <g transform="translate(40, 205)">
    <rect width="880" height="110" class="card-accent" />
    <rect x="15" y="15" width="135" height="18" class="badge-green" />
    <text x="22" y="28" class="text-badge">VARIABLE-BYTE DELTAS</text>
    <text x="160" y="28" class="text-heading" fill="#065F46">Gap Calculation: Base = First DocID, then Gap = Current - Previous</text>

    <!-- Packed Delta Cells -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="105" height="50" class="cell-delta" />
      <text x="12" y="22" class="text-code" font-weight="700" fill="#065F46">Base: 1000</text>
      <text x="12" y="38" class="text-body" font-size="10" fill="#047857">Base: 2 Bytes</text>

      <rect x="115" y="0" width="105" height="50" class="cell-delta" />
      <text x="127" y="22" class="text-code" font-weight="700" fill="#065F46">Gap: +4</text>
      <text x="127" y="38" class="text-body" font-size="10" fill="#047857">VByte: 1 Byte</text>

      <rect x="230" y="0" width="105" height="50" class="cell-delta" />
      <text x="242" y="22" class="text-code" font-weight="700" fill="#065F46">Gap: +3</text>
      <text x="242" y="38" class="text-body" font-size="10" fill="#047857">VByte: 1 Byte</text>

      <rect x="345" y="0" width="105" height="50" class="cell-delta" />
      <text x="357" y="22" class="text-code" font-weight="700" fill="#065F46">Gap: +5</text>
      <text x="357" y="38" class="text-body" font-size="10" fill="#047857">VByte: 1 Byte</text>

      <rect x="460" y="0" width="105" height="50" class="cell-delta" />
      <text x="472" y="22" class="text-code" font-weight="700" fill="#065F46">Gap: +3</text>
      <text x="472" y="38" class="text-body" font-size="10" fill="#047857">VByte: 1 Byte</text>

      <rect x="575" y="0" width="105" height="50" class="cell-delta" />
      <text x="587" y="22" class="text-code" font-weight="700" fill="#065F46">Gap: +7</text>
      <text x="587" y="38" class="text-body" font-size="10" fill="#047857">VByte: 1 Byte</text>

      <!-- Cost Tag -->
      <g transform="translate(710, 5)">
        <text x="0" y="16" class="text-code" font-weight="700" fill="#059669">7 Bytes Total</text>
        <text x="0" y="32" class="text-heading" fill="#059669">70.8% Savings</text>
      </g>
    </g>
  </g>

  <!-- Stage 3: Lossless Recovery Bar -->
  <g transform="translate(40, 330)">
    <rect width="880" height="85" class="card" />
    <text x="20" y="28" class="text-heading">Exact Recovery: Add Gaps to Previous DocIDs</text>
    <text x="20" y="48" class="text-code">1000 ──(+4)──▶ 1004 ──(+3)──▶ 1007 ──(+5)──▶ 1012 ──(+3)──▶ 1015 ──(+7)──▶ 1022</text>
    <text x="20" y="68" class="text-body" fill="#64748B">Simple, lossless arithmetic: exact original document IDs restored in a single linear pass.</text>
  </g>
</svg>
