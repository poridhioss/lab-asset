<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .card-red { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1.5; rx: 8px; }
      .card-green { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 2; rx: 8px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0F172A; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .badge-red { fill: #DC2626; rx: 4px; }
      .badge-green { fill: #059669; rx: 4px; }
      .cell { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 4px; }
      .wire-down { stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Global Header -->
  <text x="40" y="38" class="text-title">Multi-Term Optimization: The Shortest-List-First Heuristic</text>
  <text x="40" y="58" class="text-subtitle">Query: "the" (10,000,000 docs) AND "distributed" (50,000 docs) AND "paxos" (400 docs)</text>

  <!-- Left Side: Naive In-Order Evaluation -->
  <g transform="translate(40, 85)">
    <rect width="420" height="345" class="card-red" />
    <rect x="15" y="15" width="130" height="18" class="badge-red" />
    <text x="22" y="28" class="text-badge">UNOPTIMIZED IN-ORDER</text>
    <text x="155" y="28" class="text-heading" fill="#991B1B">Left-to-Right Evaluation</text>

    <!-- Funnel Step 1 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="390" height="75" rx="6" fill="#FFFFFF" stroke="#FECACA" />
      <text x="15" y="22" class="text-code" font-weight="700" fill="#991B1B">Step 1: "the" (10M) ∩ "distributed" (50K)</text>
      <text x="15" y="42" class="text-body">• Traversing 10M-element posting list</text>
      <text x="15" y="60" class="text-code" font-weight="700" fill="#DC2626">Work: 10,050,000 operations | Set: ~48,000 docs</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 210 128 L 210 148" class="wire-down" marker-end="url(#arr-red)" />

    <!-- Funnel Step 2 -->
    <g transform="translate(15, 155)">
      <rect x="0" y="0" width="390" height="75" rx="6" fill="#FFFFFF" stroke="#FECACA" />
      <text x="15" y="22" class="text-code" font-weight="700" fill="#991B1B">Step 2: Intermediate (48K) ∩ "paxos" (400)</text>
      <text x="15" y="42" class="text-body">• Merging 48K candidates with 400 postings</text>
      <text x="15" y="60" class="text-code" font-weight="700" fill="#DC2626">Work: ~48,400 operations | Set: 35 docs</text>
    </g>

    <!-- Total Cost Card -->
    <g transform="translate(15, 245)">
      <rect x="0" y="0" width="390" height="80" rx="6" fill="#FEE2E2" stroke="#F87171" />
      <text x="15" y="24" class="text-heading" fill="#991B1B">Total Cost: 10,098,400 Operations</text>
      <text x="15" y="44" class="text-body" fill="#7F1D1D">• Common stopword forces traversal of entire collection</text>
      <text x="15" y="62" class="text-code" font-weight="700" fill="#B91C1C">Verdict: CPU Spikes &amp; Latency SLA Breached</text>
    </g>
  </g>

  <!-- Right Side: Shortest-List-First Optimization -->
  <g transform="translate(500, 85)">
    <rect width="420" height="345" class="card-green" />
    <rect x="15" y="15" width="145" height="18" class="badge-green" />
    <text x="22" y="28" class="text-badge">SHORTEST-LIST-FIRST</text>
    <text x="170" y="28" class="text-heading" fill="#065F46">Cardinality-Sorted Merge</text>

    <!-- Funnel Step 1 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="390" height="75" rx="6" fill="#FFFFFF" stroke="#A7F3D0" />
      <text x="15" y="22" class="text-code" font-weight="700" fill="#065F46">Step 1: "paxos" (400) ∩ "distributed" (50K)</text>
      <text x="15" y="42" class="text-body">• Intermediate bounded strictly by min(L1, L2) ≤ 400</text>
      <text x="15" y="60" class="text-code" font-weight="700" fill="#059669">Work: Max 50,400 operations | Set: 35 docs</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 210 128 L 210 148" class="wire-down" marker-end="url(#arr-green)" />

    <!-- Funnel Step 2 -->
    <g transform="translate(15, 155)">
      <rect x="0" y="0" width="390" height="75" rx="6" fill="#FFFFFF" stroke="#A7F3D0" />
      <text x="15" y="22" class="text-code" font-weight="700" fill="#065F46">Step 2: Intermediate (35) ∩ "the" (10M)</text>
      <text x="15" y="42" class="text-body">• Candidate set has only 35 docs; skips giant "the" list</text>
      <text x="15" y="60" class="text-code" font-weight="700" fill="#059669">Work: ~100 operations | Set: 35 docs</text>
    </g>

    <!-- Total Cost Card -->
    <g transform="translate(15, 245)">
      <rect x="0" y="0" width="390" height="80" rx="6" fill="#D1FAE5" stroke="#34D399" />
      <text x="15" y="24" class="text-heading" fill="#065F46">Total Cost: ~50,500 Operations</text>
      <text x="15" y="44" class="text-body" fill="#047857">• Intermediate candidates collapse immediately to rarest term</text>
      <text x="15" y="62" class="text-code" font-weight="700" fill="#059669">Verdict: 99.5% CPU Reduction (Sub-1ms Standard)</text>
    </g>
  </g>
</svg>
