<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .flow-arrow { stroke: #64748B; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .flow-green { stroke: #16A34A; stroke-width: 2; stroke-linecap: round; fill: none; }
      .flow-purple { stroke: #7C3AED; stroke-width: 2; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="370" class="bg" />

  <!-- SECTION 1: Client Layer (Left) -->
  <g transform="translate(30, 40)">
    <rect width="180" height="285" class="sketch-box" />
    <rect x="14" y="14" width="115" height="22" rx="4" fill="#E2E8F0" />
    <text x="20" y="29" class="txt-badge" fill="#334155">CLIENT LAYER</text>
    <text x="14" y="60" class="txt-title">Incoming Users</text>
    <text x="14" y="78" class="txt-sub">Live search traffic</text>

    <!-- Query Chips -->
    <rect x="14" y="100" width="152" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="24" y="122" class="txt-code" fill="#0F172A">GET /search?q=phone</text>

    <rect x="14" y="148" width="152" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="24" y="170" class="txt-code" fill="#0F172A">GET /search?q=laptop</text>

    <rect x="14" y="200" width="152" height="56" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="22" y="222" class="txt-badge" fill="#1E40AF">CONCURRENCY</text>
    <text x="22" y="242" class="txt-sub">2,000 queries / sec</text>
  </g>

  <!-- Flow: Client to Gateway -->
  <path d="M 210 182 L 255 182" class="flow-arrow" marker-end="url(#arr)" />
  <rect x="216" y="158" width="34" height="18" rx="4" fill="#F1F5F9" />
  <text x="221" y="171" class="txt-badge" fill="#475569">QPS</text>

  <!-- SECTION 2: Search API Gateway + Circuit Breaker FSM (Center) -->
  <g transform="translate(255, 25)">
    <rect width="410" height="320" class="sketch-box" stroke="#2563EB" stroke-width="2" />
    <rect x="16" y="14" width="155" height="22" rx="4" fill="#DBEAFE" />
    <text x="22" y="29" class="txt-badge" fill="#1E40AF">SEARCH API GATEWAY</text>
    <text x="16" y="60" class="txt-title">Circuit Breaker Resilience Broker</text>
    <text x="16" y="78" class="txt-sub">Shields downstream search backends from saturation</text>

    <!-- FSM State Mini-Cards -->
    <!-- CLOSED Card -->
    <g transform="translate(16, 92)">
      <rect width="378" height="56" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4" />
      <circle cx="22" cy="28" r="8" fill="#22C55E" />
      <text x="38" y="24" class="txt-badge" fill="#166534">CLOSED (Healthy)</text>
      <text x="38" y="42" class="txt-sub">Primary backend healthy &#8212; full search queries pass</text>
    </g>

    <!-- OPEN Card -->
    <g transform="translate(16, 158)">
      <rect width="378" height="66" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4" />
      <circle cx="22" cy="33" r="8" fill="#EF4444" />
      <text x="38" y="23" class="txt-badge" fill="#991B1B">OPEN (Tripped / Quarantined)</text>
      <text x="38" y="41" class="txt-sub">Error &gt; 50% &#8212; fails fast in 0.003ms &amp; diverts to fallback</text>
      <text x="38" y="56" class="txt-badge" fill="#DC2626">Zero network packets sent to primary</text>
    </g>

    <!-- HALF_OPEN Card -->
    <g transform="translate(16, 234)">
      <rect width="378" height="56" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4" />
      <circle cx="22" cy="28" r="8" fill="#F59E0B" />
      <text x="38" y="24" class="txt-badge" fill="#92400E">HALF_OPEN (Trial Recovery)</text>
      <text x="38" y="42" class="txt-sub">Cooldown elapsed &#8212; strictly 1 scout probe admitted</text>
    </g>
  </g>

  <!-- Flow: Gateway to Primary Backend (Top Right) -->
  <path d="M 665 120 C 690 120, 695 95, 720 95" class="flow-green" marker-end="url(#arr-green)" />
  <!-- Fast-fail cut-off slash -->
  <path d="M 685 85 L 701 105" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 701 85 L 685 105" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />
  <rect x="670" y="66" width="46" height="16" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
  <text x="674" y="78" class="txt-code" fill="#991B1B" font-size="9px">TRIPPED</text>

  <!-- Flow: Gateway to Degraded Fallback (Bottom Right) -->
  <path d="M 665 245 C 690 245, 695 260, 720 260" class="flow-purple" marker-end="url(#arr-purple)" />
  <rect x="670" y="268" width="48" height="16" rx="3" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1" />
  <text x="674" y="280" class="txt-code" fill="#6D28D9" font-size="9px">0.05ms</text>

  <!-- SECTION 3: Downstream Destinations (Right) -->
  <!-- Primary: Elasticsearch -->
  <g transform="translate(725, 30)">
    <rect width="225" height="135" class="sketch-box" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.6" />
    <rect x="14" y="12" width="145" height="20" rx="4" fill="#FEE2E2" />
    <text x="20" y="26" class="txt-badge" fill="#991B1B">PRIMARY BACKEND</text>
    <text x="14" y="52" class="txt-title" font-size="15px" style="font-size: 15px; font-weight: 700;">Elasticsearch Cluster</text>
    <text x="14" y="72" class="txt-sub">Full BM25 &amp; aggregations</text>

    <rect x="14" y="86" width="197" height="34" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="22" y="107" class="txt-code" fill="#B91C1C">Frozen (15s GC Freeze)</text>
  </g>

  <!-- Fallback: In-Memory Inverted Index -->
  <g transform="translate(725, 190)">
    <rect width="225" height="145" class="sketch-box" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.6" />
    <rect x="14" y="12" width="155" height="20" rx="4" fill="#EDE9FE" />
    <text x="20" y="26" class="txt-badge" fill="#6D28D9">DEGRADED FALLBACK</text>
    <text x="14" y="52" class="txt-title" font-size="14px" style="font-size: 14px; font-weight: 700;">In-Memory Inverted Idx</text>
    <text x="14" y="72" class="txt-sub">Local heap inverted postings</text>

    <rect x="14" y="86" width="197" height="42" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
    <text x="22" y="104" class="txt-badge" fill="#6D28D9">LATENCY: ~0.05ms</text>
    <text x="22" y="120" class="txt-sub">Guarantees zero downtime</text>
  </g>
</svg>
