<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; }
      .slot-cell { stroke: #334155; stroke-width: 1.8; rx: 8; }
      .arrow { stroke: #2563EB; stroke-width: 2.2; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="360" class="bg" />

  <!-- LEFT PANEL: The Naive Dynamic Array Pitfall -->
  <g transform="translate(35, 30)">
    <rect width="425" height="305" class="sketch-box" fill="#FFFDFD" stroke="#EF4444" stroke-width="1.6" />
    <rect x="16" y="14" width="155" height="22" rx="4" fill="#FEE2E2" />
    <text x="22" y="29" class="txt-badge" fill="#991B1B">NAIVE PITFALL</text>
    <text x="16" y="60" class="txt-title" fill="#DC2626">Dynamic Heap Object Array</text>
    <text x="16" y="78" class="txt-sub">Allocates temporary objects on every single search request</text>

    <!-- Floating Heap Objects -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="120" height="42" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2" />
      <text x="10" y="26" class="txt-code" fill="#991B1B">{ ok: false, t: 12 }</text>

      <rect x="135" y="0" width="120" height="42" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.2" />
      <text x="145" y="26" class="txt-code" fill="#166534">{ ok: true, t: 14 }</text>

      <rect x="270" y="0" width="120" height="42" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2" />
      <text x="280" y="26" class="txt-code" fill="#991B1B">{ ok: false, t: 18 }</text>
    </g>

    <!-- Code Block -->
    <rect x="16" y="152" width="393" height="46" rx="6" fill="#1E293B" />
    <text x="26" y="180" class="txt-code" fill="#F87171">history.push({ ok, t }); // 10,000 objects/sec</text>

    <!-- Consequence Callout -->
    <rect x="16" y="210" width="393" height="78" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" />
    <text x="28" y="234" class="txt-badge" fill="#991B1B">V8 HEAP FRAGMENTATION</text>
    <text x="28" y="254" class="txt-sub">&#8226; Generates thousands of short-lived objects in nursery heap</text>
    <text x="28" y="272" class="txt-sub">&#8226; Triggers 50ms to 200ms Stop-The-World garbage collection pauses</text>
  </g>

  <!-- RIGHT PANEL: Fixed Uint8Array Ring Buffer -->
  <g transform="translate(495, 30)">
    <rect width="430" height="305" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <rect x="16" y="14" width="175" height="22" rx="4" fill="#DCFCE7" />
    <text x="22" y="29" class="txt-badge" fill="#166534">PRODUCTION DESIGN</text>
    <text x="16" y="60" class="txt-title" fill="#15803D">Uint8Array Circular Ring Buffer</text>
    <text x="16" y="78" class="txt-sub">Pre-allocated contiguous memory with modulo head pointer</text>

    <!-- Minimal 5 Slots -->
    <g transform="translate(24, 106)">
      <!-- Slot 0 -->
      <rect x="0" y="0" width="65" height="50" class="slot-cell" fill="#DCFCE7" stroke="#16A34A" />
      <text x="26" y="32" class="txt-title" fill="#166534">1</text>
      <text x="16" y="45" class="txt-code" fill="#166534" font-size="9px">slot 0</text>

      <!-- Slot 1 -->
      <rect x="75" y="0" width="65" height="50" class="slot-cell" fill="#DCFCE7" stroke="#16A34A" />
      <text x="101" y="32" class="txt-title" fill="#166534">1</text>
      <text x="91" y="45" class="txt-code" fill="#166534" font-size="9px">slot 1</text>

      <!-- Slot 2 -->
      <rect x="150" y="0" width="65" height="50" class="slot-cell" fill="#FEE2E2" stroke="#DC2626" />
      <text x="176" y="32" class="txt-title" fill="#DC2626">0</text>
      <text x="166" y="45" class="txt-code" fill="#DC2626" font-size="9px">slot 2</text>

      <!-- Slot 3: Active Head -->
      <rect x="225" y="0" width="65" height="50" class="slot-cell" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.4" />
      <text x="251" y="32" class="txt-title" fill="#1E40AF">0</text>
      <text x="238" y="45" class="txt-code" fill="#1E40AF" font-size="9px">slot 3</text>

      <!-- Slot 4 -->
      <rect x="300" y="0" width="65" height="50" class="slot-cell" fill="#DCFCE7" stroke="#16A34A" />
      <text x="326" y="32" class="txt-title" fill="#166534">1</text>
      <text x="316" y="45" class="txt-code" fill="#166534" font-size="9px">slot 4</text>

      <!-- Head Pointer Arrow -->
      <path d="M 257 -18 L 257 -4" class="arrow" marker-end="url(#arr-blue)" />
      <rect x="208" y="-38" width="98" height="18" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
      <text x="214" y="-25" class="txt-badge" fill="#1E40AF">HEAD POINTER</text>
    </g>

    <!-- Modulo Equation Code Block -->
    <rect x="16" y="172" width="398" height="42" rx="6" fill="#1E293B" />
    <text x="26" y="198" class="txt-code" fill="#86EFAC">head = (head + 1) % capacity; // Modulo Wrap</text>

    <!-- Zero Allocations Callout -->
    <rect x="16" y="226" width="398" height="62" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" />
    <text x="28" y="248" class="txt-badge" fill="#166534">ZERO GC HEAP ALLOCATIONS</text>
    <text x="28" y="268" class="txt-sub">&#8226; Constant-time O(1) writes &#8212; 0 bytes allocated during query serving</text>
  </g>
</svg>
