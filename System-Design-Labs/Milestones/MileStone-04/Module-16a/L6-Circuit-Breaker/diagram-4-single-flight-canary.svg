<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow-red { stroke: #DC2626; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 4, 4; fill: none; }
      .arrow-green { stroke: #16A34A; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .arrow-purple { stroke: #7C3AED; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 5, 5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" class="bg" />

  <!-- TOP PANEL: The Naive Herd Stampede -->
  <g transform="translate(30, 20)">
    <rect width="900" height="155" class="sketch-box" fill="#FFFDFD" stroke="#EF4444" stroke-width="1.6" />
    <rect x="14" y="12" width="180" height="20" rx="4" fill="#FEE2E2" />
    <text x="20" y="26" class="txt-badge" fill="#991B1B">UNLATCHED HALF-OPEN</text>
    <text x="205" y="27" class="txt-title" fill="#DC2626">The Thundering Herd Stampedes the Recovering DB</text>

    <!-- Gateway with herd rushing out -->
    <rect x="30" y="52" width="230" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="74" class="txt-badge" fill="#0F172A">API GATEWAY (HALF-OPEN)</text>
    <text x="42" y="93" class="txt-sub">Cooldown expires at T=3000ms</text>
    <text x="42" y="112" class="txt-code" fill="#DC2626">2,000 concurrent reqs arrive</text>
    <text x="42" y="126" class="txt-sub">No concurrency limit in place</text>

    <!-- Multiple red arrows stampeding -->
    <path d="M 270 70 L 620 70" class="arrow-red" marker-end="url(#arr-red)" />
    <path d="M 270 90 L 620 90" class="arrow-red" marker-end="url(#arr-red)" />
    <path d="M 270 110 L 620 110" class="arrow-red" marker-end="url(#arr-red)" />
    <rect x="370" y="76" width="160" height="24" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="380" y="92" class="txt-badge" fill="#991B1B">2,000 QUERIES HIT AT ONCE</text>

    <!-- Crashing DB -->
    <rect x="630" y="52" width="240" height="85" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" />
    <text x="644" y="74" class="txt-badge" fill="#991B1B">RECOVERING DATABASE</text>
    <text x="644" y="94" class="txt-title" fill="#991B1B">Immediate Re-Crash!</text>
    <text x="644" y="114" class="txt-sub">Overwhelmed during connection pool warm-up</text>
    <text x="644" y="128" class="txt-code" fill="#DC2626">Result: Continuous Flapping Loop</text>
  </g>

  <!-- BOTTOM PANEL: Single-Flight Canary Probe Latch -->
  <g transform="translate(30, 195)">
    <rect width="900" height="165" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6" />
    <rect x="14" y="12" width="220" height="20" rx="4" fill="#DCFCE7" />
    <text x="20" y="26" class="txt-badge" fill="#166534">SINGLE-FLIGHT CANARY LATCH</text>
    <text x="245" y="27" class="txt-title" fill="#15803D">Strictly 1 Scout Probe Tests Health While Traffic Is Shielded</text>

    <!-- Gateway with Latch -->
    <rect x="30" y="50" width="250" height="98" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.4" />
    <text x="42" y="72" class="txt-badge" fill="#166534">API GATEWAY (canaryInFlight)</text>
    <rect x="42" y="82" width="150" height="20" rx="4" fill="#DCFCE7" />
    <text x="48" y="96" class="txt-code" fill="#166534">canaryInFlight = true</text>
    <text x="42" y="118" class="txt-sub">&#8226; Req 1 admitted as scout probe</text>
    <text x="42" y="133" class="txt-sub">&#8226; Reqs 2..2,000 blocked &amp; diverted</text>

    <!-- Single green scout probe arrow -->
    <path d="M 290 75 L 620 75" class="arrow-green" marker-end="url(#arr-green)" />
    <rect x="375" y="62" width="155" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
    <text x="382" y="77" class="txt-badge" fill="#166534">1 SCOUT PROBE (Canary)</text>

    <!-- Fallback bypass arrow -->
    <path d="M 290 120 C 370 120, 390 135, 450 135" class="arrow-purple" marker-end="url(#arr-purple)" />
    <rect x="460" y="122" width="165" height="24" rx="4" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1" />
    <text x="468" y="138" class="txt-badge" fill="#6D28D9">1,999 REQS &#8594; LOCAL CACHE</text>

    <!-- Calm Recovering DB -->
    <rect x="635" y="50" width="240" height="98" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6" />
    <text x="648" y="72" class="txt-badge" fill="#166534">RECOVERING DATABASE</text>
    <text x="648" y="94" class="txt-title" fill="#15803D">Graceful Warm-Up</text>
    <text x="648" y="114" class="txt-sub">Answers 1 lightweight probe smoothly</text>
    <text x="648" y="130" class="txt-code" fill="#166534">200 OK &#8594; FSM Heals to CLOSED</text>
  </g>
</svg>
