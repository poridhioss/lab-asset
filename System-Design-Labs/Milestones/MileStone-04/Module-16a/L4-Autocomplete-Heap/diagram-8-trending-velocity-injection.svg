<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; rx: 10; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="170" class="bg" />

  <!-- DUAL-STREAM INGESTION -->
  <g transform="translate(20, 15)">
    <!-- Stream 1: Historical Baseline -->
    <rect x="0" y="0" width="230" height="65" class="sketch-box" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="14" y="22" class="txt-badge" fill="#64748B">HISTORICAL VOLUME (80%)</text>
    <text x="14" y="48" class="txt-code" fill="#334155">Static Zipf Query Logs</text>

    <!-- Stream 2: Velocity Stream -->
    <rect x="0" y="75" width="230" height="65" class="sketch-box" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" />
    <text x="14" y="97" class="txt-badge" fill="#B45309">5-MIN VELOCITY SPIKE</text>
    <text x="14" y="123" class="txt-code" fill="#92400E">Breaking News Real-Time Log</text>

    <!-- Arrow to Blending Engine -->
    <path d="M 235 32 L 275 60" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4,4" />
    <path d="M 235 107 L 275 80" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- BLENDING FORMULA ENGINE -->
  <g transform="translate(300, 25)">
    <rect width="250" height="120" class="sketch-box" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" />
    <rect x="14" y="10" width="130" height="18" rx="3" fill="#DBEAFE" />
    <text x="20" y="23" class="txt-badge" fill="#1D4ED8">DUAL-TIER SCORING</text>

    <rect x="14" y="38" width="222" height="34" rx="4" fill="#FFFFFF" stroke="#93C5FD" />
    <text x="24" y="59" class="txt-code" font-size="9.5px" fill="#1E40AF">Score = (w1 &#215; Hist) + (w2 &#215; Velocity)</text>

    <text x="24" y="96" class="txt-sub" fill="#1E3A8A">Calculates velocity surge threshold</text>
    <text x="24" y="112" class="txt-sub" fill="#1E3A8A">to override cold historical baseline.</text>
  </g>

  <!-- ARROW TO L1 INJECTION -->
  <path d="M 555 85 L 590 85" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="4,4" />

  <!-- L1 DYNAMIC CACHE INJECTION -->
  <g transform="translate(595, 25)">
    <rect width="245" height="120" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <rect x="14" y="10" width="145" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="23" class="txt-badge" fill="#166534">L1 MAP INJECTION</text>

    <!-- Top 5 Result -->
    <rect x="14" y="38" width="217" height="32" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4" />
    <text x="24" y="58" class="txt-badge" fill="#065F46">&#9889; Trending Item &#8594; Rank 1</text>

    <rect x="14" y="76" width="217" height="34" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="24" y="97" class="txt-sub" fill="#166534">Evicts lowest-scoring cold query</text>
  </g>
</svg>