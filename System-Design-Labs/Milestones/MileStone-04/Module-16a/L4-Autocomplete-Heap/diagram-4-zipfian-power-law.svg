<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13.5px; fill: #64748B; }
      .axis-line { stroke: #475569; stroke-width: 2; stroke-linecap: round; }
      .curve-line { stroke: #10B981; stroke-width: 3.5; stroke-linecap: round; fill: none; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; fill: #1E293B; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" class="bg" />

  <!-- Global Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">Zipfian Power-Law Distribution &amp; L1 Cache Tiering</text>
    <text x="0" y="18" class="sketch-subtitle">Why 20% of query prefixes capture 80% of search keystroke traffic in production</text>
  </g>

  <!-- Main Chart Container -->
  <g transform="translate(60, 68)">
    <rect width="840" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" />

    <!-- Axes -->
    <g transform="translate(80, 20)">
      <!-- Y-Axis (Search Volume) -->
      <line x1="0" y1="190" x2="0" y2="10" class="axis-line" marker-end="url(#arr-axis)" />
      <text x="-60" y="20" class="txt-badge" fill="#475569" transform="rotate(-90, -60, 20)">SEARCH VOLUME</text>

      <!-- X-Axis (Rank) -->
      <line x1="0" y1="190" x2="680" y2="190" class="axis-line" marker-end="url(#arr-axis)" />
      <text x="560" y="210" class="txt-badge" fill="#475569">POPULARITY RANK (r)</text>

      <!-- Shaded Head Area (0 to 140px, representing top 20%) -->
      <path d="M 0 190 L 0 20 Q 30 70 80 120 Q 120 150 140 162 L 140 190 Z" fill="#DCFCE7" fill-opacity="0.8" />

      <!-- Shaded Tail Area (140 to 650px, representing tail 80%) -->
      <path d="M 140 190 L 140 162 Q 220 178 350 184 Q 500 187 650 188 L 650 190 Z" fill="#F1F5F9" fill-opacity="0.8" />

      <!-- Sketched Power-Law Curve -->
      <path d="M 0 20 Q 30 70 80 120 Q 120 150 140 162 Q 220 178 350 184 Q 500 187 650 188" class="curve-line" />

      <!-- Cutoff Boundary Marker -->
      <line x1="140" y1="10" x2="140" y2="190" stroke="#10B981" stroke-width="1.8" stroke-dasharray="4,4" />

      <!-- Head Callout Card -->
      <g transform="translate(15, 30)">
        <rect width="180" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
        <rect x="8" y="8" width="164" height="18" rx="3" fill="#DCFCE7" />
        <text x="12" y="20" class="txt-badge" fill="#065F46">HEAD: TOP 20% QUERIES</text>
        <text x="8" y="38" class="txt-heading" fill="#065F46">&#9889; 80% of All Keystrokes</text>
        <text x="8" y="54" class="txt-sub" font-size="11px">Cached in Flat L1 Map (0.75 &#181;s)</text>
      </g>

      <!-- Tail Callout Card -->
      <g transform="translate(260, 90)">
        <rect width="210" height="64" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
        <rect x="8" y="8" width="194" height="18" rx="3" fill="#F1F5F9" />
        <text x="12" y="20" class="txt-badge" fill="#475569">LONG TAIL: 80% OF CATALOG</text>
        <text x="8" y="38" class="txt-heading" fill="#334155">&#8644; 20% of Keystroke Volume</text>
        <text x="8" y="54" class="txt-sub" font-size="11px">Misses L1 &#8594; Routes to L2 Fallback</text>
      </g>

      <!-- Zipf Math Formula Pill (Right Side) -->
      <g transform="translate(500, 20)">
        <rect width="165" height="54" rx="6" fill="#FEF3C7" stroke="#D97706" />
        <text x="10" y="20" class="txt-badge" fill="#92400E">ZIPF'S LAW FORMULA</text>
        <text x="10" y="40" class="txt-code" font-size="11px" font-weight="700" fill="#92400E">f(r) &#8733; 1 / (r ^ s)</text>
      </g>
    </g>
  </g>
</svg>
