<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-title { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; }
      .sketch-subtitle { font-family: "Caveat", "Virgil", "Comic Neue", "Chalkboard SE", -apple-system, sans-serif; font-size: 13.5px; fill: #64748B; }
      .card-warn { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.8; rx: 14; }
      .card-win { fill: #F0FDF4; stroke: #34D399; stroke-width: 2.2; rx: 14; }
      .cell-inner { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 8; }
      .ptr-edge { stroke: #D97706; stroke-width: 1.5; stroke-dasharray: 3, 3; fill: none; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-heading { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; }
      .node-trie { fill: #FEF3C7; stroke: #D97706; stroke-width: 1.5; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" class="bg" />

  <!-- Global Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" class="sketch-title">Memory Footprint: Character Trie vs Flat Prefix Map</text>
    <text x="0" y="18" class="sketch-subtitle">How flattening truncated prefixes into direct array references slashes 89.1% of heap RAM</text>
  </g>

  <!-- Left: Character Trie Pointer Graph -->
  <g transform="translate(40, 68)">
    <rect width="430" height="265" class="card-warn" />
    <rect x="18" y="14" width="205" height="20" rx="4" fill="#FEF3C7" />
    <text x="24" y="28" class="txt-badge" fill="#92400E">TRADITIONAL: N-ARY TRIE GRAPH</text>
    <text x="18" y="56" class="txt-heading" fill="#92400E">Millions of Linked TrieNode Objects</text>

    <!-- Visual Sketch: Fragmented Pointer Web -->
    <g transform="translate(18, 72)">
      <rect width="394" height="110" class="cell-inner" stroke="#FCD34D" />

      <!-- Scattered Nodes & Pointers -->
      <g transform="translate(30, 15)">
        <!-- Node 1 -->
        <circle cx="20" cy="20" r="14" class="node-trie" />
        <text x="12" y="24" class="txt-code" font-weight="700">'k'</text>
        <path d="M 34 20 L 75 35" class="ptr-edge" marker-end="url(#arr-amber)" />

        <!-- Node 2 -->
        <circle cx="90" cy="40" r="14" class="node-trie" />
        <text x="82" y="44" class="txt-code" font-weight="700">'a'</text>
        <path d="M 104 40 L 145 25" class="ptr-edge" marker-end="url(#arr-amber)" />

        <!-- Node 3 -->
        <circle cx="160" cy="20" r="14" class="node-trie" />
        <text x="152" y="24" class="txt-code" font-weight="700">'c'</text>
        <path d="M 174 25 L 215 50" class="ptr-edge" marker-end="url(#arr-amber)" />

        <!-- Node 4 -->
        <circle cx="230" cy="55" r="14" class="node-trie" />
        <text x="222" y="59" class="txt-code" font-weight="700">'c'</text>

        <!-- Node Overhead Annotations -->
        <g transform="translate(265, 8)">
          <rect width="90" height="66" rx="4" fill="#FEF3C7" stroke="#F59E0B" />
          <text x="6" y="18" class="txt-badge" font-size="8px" fill="#92400E">PER-NODE CHURN</text>
          <text x="6" y="32" class="txt-code" font-size="8px">&#8226; TrieNode (~64B)</text>
          <text x="6" y="46" class="txt-code" font-size="8px">&#8226; Map (~128B)</text>
          <text x="6" y="60" class="txt-code" font-size="8px">&#8226; GC References</text>
        </g>
      </g>
      <text x="14" y="98" class="txt-sub" font-size="11px" fill="#B45309">&#9888; Navigating pointers across heap destroys CPU cache lines</text>
    </g>

    <!-- Verdict Pill -->
    <g transform="translate(18, 195)">
      <rect width="394" height="46" rx="6" fill="#FEF3C7" stroke="#F59E0B" />
      <text x="14" y="18" class="txt-badge" fill="#92400E">&#9679; ~120.2 KB RAM (10k items)</text>
      <text x="14" y="34" class="txt-sub" font-size="11.5px" fill="#78350F">High pointer overhead &#8226; Stop-The-World GC pause risk</text>
    </g>
  </g>

  <!-- Right: Pointerless Flat Prefix Map -->
  <g transform="translate(490, 68)">
    <rect width="430" height="265" class="card-win" />
    <rect x="18" y="14" width="220" height="20" rx="4" fill="#DCFCE7" />
    <text x="24" y="28" class="txt-badge" fill="#065F46">OPTIMIZED: FLAT PREFIX L1 MAP</text>
    <text x="18" y="56" class="txt-heading" fill="#065F46">Direct String Keys &#8594; Compact Arrays (L &#8804; 6)</text>

    <!-- Visual Sketch: Contiguous Key-Value Table -->
    <g transform="translate(18, 72)">
      <rect width="394" height="110" class="cell-inner" stroke="#86EFAC" />

      <!-- Table Rows -->
      <g transform="translate(16, 12)">
        <rect x="0" y="0" width="55" height="22" rx="3" fill="#ECFDF5" stroke="#10B981" />
        <text x="16" y="15" class="txt-code" font-weight="700" fill="#065F46">"k"</text>
        <text x="65" y="15" class="txt-code" font-size="9px" fill="#047857">&#8594; [ "kacchi biryani", "kala bhuna", ...5 ]</text>

        <rect x="0" y="28" width="55" height="22" rx="3" fill="#ECFDF5" stroke="#10B981" />
        <text x="14" y="43" class="txt-code" font-weight="700" fill="#065F46">"ka"</text>
        <text x="65" y="43" class="txt-code" font-size="9px" fill="#047857">&#8594; [ "kacchi biryani", "kala bhuna", ...5 ]</text>

        <rect x="0" y="56" width="55" height="22" rx="3" fill="#ECFDF5" stroke="#10B981" />
        <text x="10" y="71" class="txt-code" font-weight="700" fill="#065F46">"kac"</text>
        <text x="65" y="71" class="txt-code" font-size="9px" fill="#047857">&#8594; [ "kacchi biryani", "kacchi mutton", ...5 ]</text>
      </g>
      <text x="14" y="98" class="txt-sub" font-size="11px" fill="#065F46">&#10003; Zero intermediate pointer objects &#8226; True contiguous memory</text>
    </g>

    <!-- Verdict Pill -->
    <g transform="translate(18, 195)">
      <rect width="394" height="46" rx="6" fill="#DCFCE7" stroke="#10B981" />
      <text x="14" y="18" class="txt-badge" fill="#065F46">&#10004; ~13.1 KB RAM (89.1% Reduction)</text>
      <text x="14" y="34" class="txt-sub" font-size="11.5px" fill="#047857">Sub-microsecond direct hash lookup &#8226; Near-zero GC pressure</text>
    </g>
  </g>
</svg>
