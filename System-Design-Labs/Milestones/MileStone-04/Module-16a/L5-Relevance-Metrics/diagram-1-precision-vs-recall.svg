<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .axis-line { stroke: #94A3B8; stroke-width: 1.5; stroke-linecap: round; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4, 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" class="bg" />

  <!-- LEFT: Precision & Recall Curve Chart -->
  <g transform="translate(30, 25)">
    <rect width="450" height="285" class="sketch-box" />
    
    <!-- Legend Chips -->
    <rect x="20" y="16" width="100" height="20" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
    <circle cx="30" cy="26" r="4" fill="#2563EB" />
    <text x="40" y="29" class="txt-badge" fill="#1D4ED8">Precision@K</text>

    <rect x="130" y="16" width="95" height="20" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <circle cx="140" cy="26" r="4" fill="#16A34A" />
    <text x="150" y="29" class="txt-badge" fill="#15803D">Recall@K</text>

    <!-- Y Axis Grid -->
    <line x1="55" y1="65" x2="415" y2="65" class="grid-line" />
    <text x="45" y="69" text-anchor="end" class="txt-code" fill="#94A3B8">1.0</text>

    <line x1="55" y1="115" x2="415" y2="115" class="grid-line" />
    <text x="45" y="119" text-anchor="end" class="txt-code" fill="#94A3B8">0.7</text>

    <line x1="55" y1="165" x2="415" y2="165" class="grid-line" />
    <text x="45" y="169" text-anchor="end" class="txt-code" fill="#94A3B8">0.5</text>

    <line x1="55" y1="215" x2="415" y2="215" class="axis-line" />
    <text x="45" y="219" text-anchor="end" class="txt-code" fill="#94A3B8">0.0</text>

    <!-- Axes -->
    <line x1="55" y1="60" x2="55" y2="215" class="axis-line" />

    <!-- X Points: K=1 (90), K=3 (180), K=5 (280), K=10 (390) -->
    <text x="90" y="235" text-anchor="middle" class="txt-badge" fill="#475569">K=1</text>
    <text x="180" y="235" text-anchor="middle" class="txt-badge" fill="#475569">K=3</text>
    <text x="280" y="235" text-anchor="middle" class="txt-badge" fill="#475569">K=5</text>
    <text x="390" y="235" text-anchor="middle" class="txt-badge" fill="#475569">K=10</text>

    <!-- Recall Curve (Green - Rising) -->
    <path d="M 90 178 Q 150 140 180 140 T 280 102 T 390 65" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="90" cy="178" r="4.5" fill="#16A34A" />
    <circle cx="180" cy="140" r="4.5" fill="#16A34A" />
    <circle cx="280" cy="102" r="4.5" fill="#16A34A" />
    <circle cx="390" cy="65" r="4.5" fill="#16A34A" />

    <!-- Precision Curve (Blue - Falling) -->
    <path d="M 90 65 Q 140 115 180 115 T 280 126 T 390 152" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="90" cy="65" r="4.5" fill="#2563EB" />
    <circle cx="180" cy="115" r="4.5" fill="#2563EB" />
    <circle cx="280" cy="126" r="4.5" fill="#2563EB" />
    <circle cx="390" cy="152" r="4.5" fill="#2563EB" />

    <!-- Minimal Sketch Callouts -->
    <rect x="70" y="252" width="130" height="22" rx="4" fill="#EFF6FF" />
    <text x="135" y="267" text-anchor="middle" class="txt-sub" fill="#1D4ED8">&#8593; High Purity at Top</text>

    <rect x="250" y="252" width="155" height="22" rx="4" fill="#F0FDF4" />
    <text x="327" y="267" text-anchor="middle" class="txt-sub" fill="#15803D">&#8593; Full Recall at Depth</text>
  </g>

  <!-- RIGHT: Step-by-Step Cutoff Table -->
  <g transform="translate(505, 25)">
    <rect width="365" height="285" class="sketch-box" />
    
    <!-- Table Title Header -->
    <rect x="14" y="14" width="165" height="22" rx="4" fill="#F1F5F9" />
    <text x="22" y="29" class="txt-badge" fill="#334155">QUERY SAMPLE (|REL| = 4)</text>

    <!-- Table Header Row -->
    <text x="22" y="60" class="txt-badge" fill="#64748B">DEPTH</text>
    <text x="90" y="60" class="txt-badge" fill="#64748B">HITS</text>
    <text x="160" y="60" class="txt-badge" fill="#1D4ED8">PRECISION@K</text>
    <text x="270" y="60" class="txt-badge" fill="#15803D">RECALL@K</text>
    <line x1="14" y1="70" x2="351" y2="70" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Row 1: K=1 -->
    <text x="22" y="96" class="txt-code" fill="#0F172A">K = 1</text>
    <text x="90" y="96" class="txt-sub">1 hit</text>
    <text x="160" y="96" class="txt-code" fill="#1D4ED8">1.000 (1/1)</text>
    <text x="270" y="96" class="txt-code" fill="#15803D">0.250 (1/4)</text>
    <line x1="14" y1="108" x2="351" y2="108" stroke="#F1F5F9" />

    <!-- Row 2: K=3 -->
    <text x="22" y="134" class="txt-code" fill="#0F172A">K = 3</text>
    <text x="90" y="134" class="txt-sub">2 hits</text>
    <text x="160" y="134" class="txt-code" fill="#1D4ED8">0.667 (2/3)</text>
    <text x="270" y="134" class="txt-code" fill="#15803D">0.500 (2/4)</text>
    <line x1="14" y1="146" x2="351" y2="146" stroke="#F1F5F9" />

    <!-- Row 3: K=5 -->
    <text x="22" y="172" class="txt-code" fill="#0F172A">K = 5</text>
    <text x="90" y="172" class="txt-sub">3 hits</text>
    <text x="160" y="172" class="txt-code" fill="#1D4ED8">0.600 (3/5)</text>
    <text x="270" y="172" class="txt-code" fill="#15803D">0.750 (3/4)</text>
    <line x1="14" y1="184" x2="351" y2="184" stroke="#F1F5F9" />

    <!-- Row 4: K=10 -->
    <text x="22" y="210" class="txt-code" fill="#0F172A">K = 10</text>
    <text x="90" y="210" class="txt-sub">4 hits</text>
    <text x="160" y="210" class="txt-code" fill="#1D4ED8">0.400 (4/10)</text>
    <text x="270" y="210" class="txt-code" fill="#15803D">1.000 (4/4)</text>
    <line x1="14" y1="222" x2="351" y2="222" stroke="#F1F5F9" />

    <!-- Summary Pill -->
    <rect x="14" y="238" width="337" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="182" y="260" text-anchor="middle" class="txt-sub" fill="#334155">Purity vs Coverage: Search balances both metrics</text>
  </g>
</svg>