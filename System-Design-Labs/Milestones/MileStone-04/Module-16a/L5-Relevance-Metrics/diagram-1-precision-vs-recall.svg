<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="30" y="24" width="840" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="46" class="title">Precision vs. Recall Trade-Off at Varying Cutoff Depths (K)</text>
  <text x="50" y="64" class="subtitle">Why search engines balance result purity against retrieval completeness</text>

  <!-- LEFT: Precision & Recall Curve Chart (420 x 300) -->
  <g transform="translate(30, 95)">
    <rect width="450" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="20" y="28" class="label" font-weight="600">Metric Curves across Rank Cutoff K</text>
    
    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="60" y1="60" x2="420" y2="60" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="64" text-anchor="end" class="axis-label">1.0</text>

    <line x1="60" y1="110" x2="420" y2="110" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="114" text-anchor="end" class="axis-label">0.75</text>

    <line x1="60" y1="160" x2="420" y2="160" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="164" text-anchor="end" class="axis-label">0.50</text>

    <line x1="60" y1="210" x2="420" y2="210" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="214" text-anchor="end" class="axis-label">0.25</text>

    <line x1="60" y1="260" x2="420" y2="260" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="50" y="264" text-anchor="end" class="axis-label">0.0</text>

    <!-- X-Axis Labels -->
    <line x1="60" y1="60" x2="60" y2="260" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- K points: K=1 (x=90), K=3 (x=170), K=5 (x=270), K=10 (x=390) -->
    <text x="90" y="278" text-anchor="middle" class="badge" fill="#475569">K=1</text>
    <text x="170" y="278" text-anchor="middle" class="badge" fill="#475569">K=3</text>
    <text x="270" y="278" text-anchor="middle" class="badge" fill="#475569">K=5</text>
    <text x="390" y="278" text-anchor="middle" class="badge" fill="#475569">K=10</text>

    <!-- Recall Curve (Rising: Green) (x, y): (90, 210) -> (170, 160) -> (270, 110) -> (390, 60) -->
    <path d="M 90 210 Q 150 170 170 160 T 270 110 T 390 60" fill="none" stroke="#10B981" stroke-width="3" />
    <circle cx="90" cy="210" r="4.5" fill="#10B981" />
    <circle cx="170" cy="160" r="4.5" fill="#10B981" />
    <circle cx="270" cy="110" r="4.5" fill="#10B981" />
    <circle cx="390" cy="60" r="4.5" fill="#10B981" />

    <!-- Precision Curve (Falling: Blue) (x, y): (90, 60) -> (170, 126) -> (270, 140) -> (390, 180) -->
    <path d="M 90 60 Q 140 110 170 126 T 270 140 T 390 180" fill="none" stroke="#2563EB" stroke-width="3" />
    <circle cx="90" cy="60" r="4.5" fill="#2563EB" />
    <circle cx="170" cy="126" r="4.5" fill="#2563EB" />
    <circle cx="270" cy="140" r="4.5" fill="#2563EB" />
    <circle cx="390" cy="180" r="4.5" fill="#2563EB" />

    <!-- Legend -->
    <rect x="250" y="15" width="180" height="32" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
    <line x1="260" y1="31" x2="280" y2="31" stroke="#2563EB" stroke-width="2.5" />
    <text x="286" y="35" class="sublabel" font-weight="600">Precision@K</text>
    <line x1="355" y1="31" x2="375" y2="31" stroke="#10B981" stroke-width="2.5" />
    <text x="381" y="35" class="sublabel" font-weight="600">Recall@K</text>
  </g>

  <!-- RIGHT: Step-by-Step Numerical Table (370 x 300) -->
  <g transform="translate(500, 95)">
    <rect width="370" height="300" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
    <rect x="0" y="0" width="370" height="36" rx="8" fill="#F1F5F9" />
    <rect x="0" y="26" width="370" height="10" fill="#F1F5F9" />
    <text x="15" y="23" class="label" font-weight="700">Sample Query (|Relevant| = 4 docs)</text>

    <!-- Table Header -->
    <rect x="15" y="46" width="340" height="26" rx="4" fill="#F8FAFC" />
    <text x="25" y="63" class="badge" fill="#64748B">Cutoff</text>
    <text x="95" y="63" class="badge" fill="#64748B">Hits</text>
    <text x="160" y="63" class="badge" fill="#1D4ED8">Precision@K</text>
    <text x="260" y="63" class="badge" fill="#047857">Recall@K</text>

    <!-- Row 1: K=1 -->
    <line x1="15" y1="102" x2="355" y2="102" stroke="#F1F5F9" />
    <text x="25" y="93" class="badge" fill="#1E293B">K = 1</text>
    <text x="95" y="93" class="sublabel">1 hit</text>
    <text x="160" y="93" class="badge" fill="#2563EB">1.0000 (1/1)</text>
    <text x="260" y="93" class="badge" fill="#10B981">0.2500 (1/4)</text>

    <!-- Row 2: K=3 -->
    <line x1="15" y1="138" x2="355" y2="138" stroke="#F1F5F9" />
    <text x="25" y="129" class="badge" fill="#1E293B">K = 3</text>
    <text x="95" y="129" class="sublabel">2 hits</text>
    <text x="160" y="129" class="badge" fill="#2563EB">0.6667 (2/3)</text>
    <text x="260" y="129" class="badge" fill="#10B981">0.5000 (2/4)</text>

    <!-- Row 3: K=5 -->
    <line x1="15" y1="174" x2="355" y2="174" stroke="#F1F5F9" />
    <text x="25" y="165" class="badge" fill="#1E293B">K = 5</text>
    <text x="95" y="165" class="sublabel">3 hits</text>
    <text x="160" y="165" class="badge" fill="#2563EB">0.6000 (3/5)</text>
    <text x="260" y="165" class="badge" fill="#10B981">0.7500 (3/4)</text>

    <!-- Row 4: K=10 -->
    <text x="25" y="201" class="badge" fill="#1E293B">K = 10</text>
    <text x="95" y="201" class="sublabel">4 hits</text>
    <text x="160" y="201" class="badge" fill="#2563EB">0.4000 (4/10)</text>
    <text x="260" y="201" class="badge" fill="#10B981">1.0000 (4/4)</text>

    <!-- Insights Callout -->
    <rect x="15" y="222" width="340" height="66" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="25" y="242" class="label" font-weight="600" fill="#1E40AF">Architectural Takeaway:</text>
    <text x="25" y="260" class="sublabel">As K expands, Recall rises to 1.0 (all answers surfaced),</text>
    <text x="25" y="275" class="sublabel">but Precision falls to 0.40 as irrelevant results enter.</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="410" width="840" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="48" cy="433" r="5" fill="#3B82F6" />
  <text x="62" y="437" class="label" font-weight="600">Design Target:</text>
  <text x="165" y="437" class="sublabel">For consumer web search, optimize Precision@1 and Precision@3. For legal/medical discovery, optimize Recall@10.</text>
</svg>
