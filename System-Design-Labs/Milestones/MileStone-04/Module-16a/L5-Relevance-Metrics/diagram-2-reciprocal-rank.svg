<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="30" y="24" width="840" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="46" class="title">Reciprocal Rank (RR): Hyperbolic Decay in Navigational Search</text>
  <text x="50" y="64" class="subtitle">Formula: RR = 1 / rank_first — Severe penalty for burying the first relevant result</text>

  <!-- LEFT: 1/x Decay Curve (450 x 300) -->
  <g transform="translate(30, 95)">
    <rect width="450" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="20" y="28" class="label" font-weight="600">The 1 / Rank Hyperbolic Decay Curve</text>

    <!-- Grid lines -->
    <line x1="60" y1="60" x2="420" y2="60" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="64" text-anchor="end" class="axis-label">1.0</text>

    <line x1="60" y1="110" x2="420" y2="110" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="114" text-anchor="end" class="axis-label">0.75</text>

    <line x1="60" y1="160" x2="420" y2="160" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="164" text-anchor="end" class="axis-label">0.50</text>

    <line x1="60" y1="210" x2="420" y2="210" stroke="#E2E8F0" stroke-dasharray="3,3" />
    <text x="50" y="214" text-anchor="end" class="axis-label">0.25</text>

    <line x1="60" y1="260" x2="420" y2="260" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="50" y="264" text-anchor="end" class="axis-label">0.0</text>

    <line x1="60" y1="60" x2="60" y2="260" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- X Axis: Rank 1 (x=90), Rank 2 (x=150), Rank 3 (x=210), Rank 4 (x=270), Rank 5 (x=330), Rank 10 (x=410) -->
    <text x="90" y="278" text-anchor="middle" class="badge" fill="#475569">R1</text>
    <text x="150" y="278" text-anchor="middle" class="badge" fill="#475569">R2</text>
    <text x="210" y="278" text-anchor="middle" class="badge" fill="#475569">R3</text>
    <text x="270" y="278" text-anchor="middle" class="badge" fill="#475569">R4</text>
    <text x="330" y="278" text-anchor="middle" class="badge" fill="#475569">R5</text>
    <text x="410" y="278" text-anchor="middle" class="badge" fill="#475569">R10</text>

    <!-- Fill under curve -->
    <path d="M 90 60 Q 120 130 150 160 T 210 193 T 270 210 T 330 220 T 410 240 L 410 260 L 90 260 Z" fill="#EFF6FF" opacity="0.6" />

    <!-- Hyperbolic Curve: Rank 1 (y=60), Rank 2 (y=160), Rank 3 (y=193.3), Rank 4 (y=210), Rank 5 (y=220), Rank 10 (y=240) -->
    <path d="M 90 60 Q 120 130 150 160 T 210 193 T 270 210 T 330 220 T 410 240" fill="none" stroke="#2563EB" stroke-width="3" />

    <!-- Points -->
    <circle cx="90" cy="60" r="5" fill="#2563EB" />
    <text x="90" y="50" text-anchor="middle" class="badge" fill="#1D4ED8">1.0</text>

    <circle cx="150" cy="160" r="4.5" fill="#EF4444" />
    <text x="150" y="152" text-anchor="middle" class="badge" fill="#B91C1C">0.50 (-50%)</text>

    <circle cx="210" cy="193" r="4.5" fill="#F59E0B" />
    <text x="210" y="185" text-anchor="middle" class="badge" fill="#B45309">0.33 (-67%)</text>

    <circle cx="330" cy="220" r="4" fill="#64748B" />
    <text x="330" y="212" text-anchor="middle" class="badge" fill="#475569">0.20 (-80%)</text>

    <circle cx="410" cy="240" r="4" fill="#64748B" />
    <text x="410" y="232" text-anchor="middle" class="badge" fill="#475569">0.10 (-90%)</text>
  </g>

  <!-- RIGHT: Real-World Scenarios (370 x 300) -->
  <g transform="translate(500, 95)">
    <rect width="370" height="300" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
    <rect x="0" y="0" width="370" height="36" rx="8" fill="#F1F5F9" />
    <rect x="0" y="26" width="370" height="10" fill="#F1F5F9" />
    <text x="15" y="23" class="label" font-weight="700">Navigational Query: "account settings"</text>

    <!-- Case 1: Rank 1 -->
    <rect x="15" y="48" width="340" height="68" rx="6" fill="#F0FDF4" stroke="#86EFAC" />
    <text x="25" y="68" class="badge" fill="#15803D">Scenario A: First Hit at Rank 1</text>
    <text x="25" y="86" class="sublabel">User sees the target link immediately without scrolling.</text>
    <rect x="25" y="92" width="100" height="18" rx="4" fill="#DCFCE7" />
    <text x="75" y="105" text-anchor="middle" class="badge" fill="#166534">RR = 1.0000</text>

    <!-- Case 2: Rank 3 -->
    <rect x="15" y="126" width="340" height="68" rx="6" fill="#FFFBEB" stroke="#FDE68A" />
    <text x="25" y="146" class="badge" fill="#B45309">Scenario B: First Hit at Rank 3</text>
    <text x="25" y="164" class="sublabel">Two irrelevant pages appear first. Attention drops.</text>
    <rect x="25" y="170" width="100" height="18" rx="4" fill="#FEF3C7" />
    <text x="75" y="183" text-anchor="middle" class="badge" fill="#92400E">RR = 0.3333</text>

    <!-- Case 3: Rank 8 -->
    <rect x="15" y="204" width="340" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" />
    <text x="25" y="224" class="badge" fill="#B91C1C">Scenario C: First Hit at Rank 8</text>
    <text x="25" y="242" class="sublabel">Below the mobile fold. >85% of users abandon search.</text>
    <rect x="25" y="248" width="100" height="18" rx="4" fill="#FEE2E2" />
    <text x="75" y="261" text-anchor="middle" class="badge" fill="#991B1B">RR = 0.1250</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="410" width="840" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="48" cy="433" r="5" fill="#10B981" />
  <text x="62" y="437" class="label" font-weight="600">Mean Reciprocal Rank (MRR):</text>
  <text x="255" y="437" class="sublabel">Calculates the arithmetic average of RR across all queries in your evaluation suite.</text>
</svg>
