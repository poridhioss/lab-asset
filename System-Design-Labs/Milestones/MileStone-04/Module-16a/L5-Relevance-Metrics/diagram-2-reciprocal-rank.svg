<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .axis-line { stroke: #94A3B8; stroke-width: 1.5; stroke-linecap: round; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4, 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" class="bg" />

  <!-- LEFT: 1/x Decay Curve -->
  <g transform="translate(30, 25)">
    <rect width="450" height="270" class="sketch-box" />

    <!-- Formula Badge -->
    <rect x="20" y="16" width="160" height="22" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
    <text x="28" y="31" class="txt-badge" fill="#1D4ED8">FORMULA: RR = 1 / rank</text>

    <!-- Y Grid -->
    <line x1="55" y1="60" x2="415" y2="60" class="grid-line" />
    <text x="45" y="64" text-anchor="end" class="txt-code" fill="#94A3B8">1.0</text>

    <line x1="55" y1="110" x2="415" y2="110" class="grid-line" />
    <text x="45" y="114" text-anchor="end" class="txt-code" fill="#94A3B8">0.5</text>

    <line x1="55" y1="160" x2="415" y2="160" class="grid-line" />
    <text x="45" y="164" text-anchor="end" class="txt-code" fill="#94A3B8">0.2</text>

    <line x1="55" y1="210" x2="415" y2="210" class="axis-line" />
    <text x="45" y="214" text-anchor="end" class="txt-code" fill="#94A3B8">0.0</text>

    <!-- Axes -->
    <line x1="55" y1="55" x2="55" y2="210" class="axis-line" />

    <!-- X Points -->
    <text x="85" y="228" text-anchor="middle" class="txt-badge" fill="#475569">R1</text>
    <text x="145" y="228" text-anchor="middle" class="txt-badge" fill="#475569">R2</text>
    <text x="205" y="228" text-anchor="middle" class="txt-badge" fill="#475569">R3</text>
    <text x="285" y="228" text-anchor="middle" class="txt-badge" fill="#475569">R5</text>
    <text x="385" y="228" text-anchor="middle" class="txt-badge" fill="#475569">R10</text>

    <!-- Shading under curve -->
    <path d="M 85 60 Q 115 110 145 135 T 205 160 T 285 180 T 385 195 L 385 210 L 85 210 Z" fill="#EFF6FF" opacity="0.6" />

    <!-- Decay Path -->
    <path d="M 85 60 Q 115 110 145 135 T 205 160 T 285 180 T 385 195" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" />

    <!-- Plotted Key Points -->
    <circle cx="85" cy="60" r="4.5" fill="#16A34A" />
    <text x="85" y="50" text-anchor="middle" class="txt-code" fill="#15803D">1.0</text>

    <circle cx="145" cy="135" r="4.5" fill="#EF4444" />
    <text x="145" y="125" text-anchor="middle" class="txt-code" fill="#B91C1C">0.50 (-50%)</text>

    <circle cx="205" cy="160" r="4.5" fill="#F59E0B" />
    <text x="205" y="152" text-anchor="middle" class="txt-code" fill="#B45309">0.33</text>

    <circle cx="285" cy="180" r="4" fill="#64748B" />
    <text x="285" y="172" text-anchor="middle" class="txt-code" fill="#475569">0.20</text>

    <circle cx="385" cy="195" r="4" fill="#64748B" />
    <text x="385" y="187" text-anchor="middle" class="txt-code" fill="#475569">0.10</text>

    <!-- Bottom Note -->
    <text x="235" y="254" text-anchor="middle" class="txt-sub" fill="#64748B">Hyperbolic penalty for burying the first target</text>
  </g>

  <!-- RIGHT: 3 Minimal Scenario Cards -->
  <g transform="translate(505, 25)">
    <rect width="365" height="270" class="sketch-box" />

    <!-- Scenario A: Rank 1 -->
    <rect x="14" y="16" width="337" height="68" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <rect x="24" y="26" width="60" height="18" rx="3" fill="#DCFCE7" />
    <text x="30" y="39" class="txt-badge" fill="#166534">RANK 1</text>
    <text x="94" y="40" class="txt-title" fill="#14532D">Above the Fold</text>
    <text x="24" y="68" class="txt-sub">Target link visible immediately</text>
    <rect x="245" y="32" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="295" y="48" text-anchor="middle" class="txt-badge" fill="#15803D">RR = 1.000</text>

    <!-- Scenario B: Rank 3 -->
    <rect x="14" y="96" width="337" height="68" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
    <rect x="24" y="106" width="60" height="18" rx="3" fill="#FEF3C7" />
    <text x="30" y="119" class="txt-badge" fill="#92400E">RANK 3</text>
    <text x="94" y="120" class="txt-title" fill="#92400E">Modest Scroll</text>
    <text x="24" y="148" class="txt-sub">User attention drops by 67%</text>
    <rect x="245" y="112" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="295" y="128" text-anchor="middle" class="txt-badge" fill="#B45309">RR = 0.333</text>

    <!-- Scenario C: Rank 8+ -->
    <rect x="14" y="176" width="337" height="68" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
    <rect x="24" y="186" width="65" height="18" rx="3" fill="#FEE2E2" />
    <text x="30" y="199" class="txt-badge" fill="#991B1B">RANK 8+</text>
    <text x="99" y="200" class="txt-title" fill="#991B1B">Abandonment</text>
    <text x="24" y="228" class="txt-sub">Buries result below mobile screen</text>
    <rect x="245" y="192" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#FECACA" />
    <text x="295" y="208" text-anchor="middle" class="txt-badge" fill="#B91C1C">RR = 0.125</text>

    <text x="182" y="258" text-anchor="middle" class="txt-sub" fill="#475569">MRR averages RR across all queries in your test suite</text>
  </g>
</svg>