<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .txt-val { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="320" class="bg" />

  <!-- LEFT: Baseline Matcher -->
  <g transform="translate(30, 20)">
    <rect width="415" height="245" class="sketch-box" fill="#F8FAFC" stroke="#94A3B8" />

    <!-- Header -->
    <rect x="14" y="12" width="75" height="18" rx="3" fill="#E2E8F0" />
    <text x="20" y="25" class="txt-badge" fill="#475569">BASELINE</text>
    <text x="96" y="26" class="txt-title" fill="#334155">Keyword Matcher</text>
    <rect x="305" y="12" width="95" height="18" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="352" y="25" text-anchor="middle" class="txt-badge" fill="#64748B">Term Overlap</text>

    <!-- 2x2 Metric Grid -->
    <g transform="translate(14, 40)">
      <rect x="0" y="0" width="186" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="12" y="20" class="txt-badge" fill="#64748B">MEAN AP (MAP)</text>
      <text x="12" y="42" class="txt-val" fill="#334155">0.6204</text>

      <rect x="198" y="0" width="186" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="12" y="20" class="txt-badge" fill="#64748B">MEAN RR (MRR)</text>
      <text x="12" y="42" class="txt-val" fill="#334155">0.6667</text>

      <rect x="0" y="60" width="186" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="12" y="78" class="txt-badge" fill="#64748B">MEAN P@1</text>
      <text x="12" y="98" class="txt-val" fill="#64748B">0.5000</text>

      <rect x="198" y="60" width="186" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="12" y="78" class="txt-badge" fill="#64748B">MEAN RECALL@3</text>
      <text x="12" y="98" class="txt-val" fill="#64748B">0.6667</text>
    </g>

    <!-- Weakness Chip -->
    <rect x="14" y="160" width="384" height="68" rx="6" fill="#FFF1F2" stroke="#FECDD3" />
    <text x="24" y="180" class="txt-badge" fill="#BE123C">Observed Limitations:</text>
    <text x="24" y="198" class="txt-sub" fill="#991B1B">&#8226; Query A3 failed completely (AP = 0.0000; missed synonyms)</text>
    <text x="24" y="216" class="txt-sub" fill="#991B1B">&#8226; Queries A1 &amp; A2 placed irrelevant docs at Rank 1</text>
  </g>

  <!-- RIGHT: Experimental Ranker -->
  <g transform="translate(475, 20)">
    <rect width="415" height="245" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />

    <!-- Header -->
    <rect x="14" y="12" width="105" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="25" class="txt-badge" fill="#15803D">EXPERIMENTAL</text>
    <text x="126" y="26" class="txt-title" fill="#14532D">Tuned Ranker</text>
    <rect x="305" y="12" width="95" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="352" y="25" text-anchor="middle" class="txt-badge" fill="#166534">BM25 + Hybrid</text>

    <!-- 2x2 Metric Grid -->
    <g transform="translate(14, 40)">
      <rect x="0" y="0" width="186" height="52" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
      <text x="12" y="20" class="txt-badge" fill="#166534">MEAN AP (MAP)</text>
      <text x="12" y="42" class="txt-val" fill="#15803D">1.0000</text>
      <rect x="110" y="26" width="66" height="18" rx="3" fill="#DCFCE7" />
      <text x="143" y="39" text-anchor="middle" class="txt-badge" fill="#15803D">+61.2%</text>

      <rect x="198" y="0" width="186" height="52" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
      <text x="12" y="20" class="txt-badge" fill="#166534">MEAN RR (MRR)</text>
      <text x="12" y="42" class="txt-val" fill="#15803D">1.0000</text>
      <rect x="110" y="26" width="66" height="18" rx="3" fill="#DCFCE7" transform="translate(198, 0)" />
      <text x="341" y="39" text-anchor="middle" class="txt-badge" fill="#15803D">+50.0%</text>

      <rect x="0" y="60" width="186" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
      <text x="12" y="78" class="txt-badge" fill="#166534">MEAN P@1</text>
      <text x="12" y="98" class="txt-val" fill="#15803D">1.0000</text>
      <rect x="110" y="82" width="66" height="18" rx="3" fill="#DCFCE7" />
      <text x="143" y="95" text-anchor="middle" class="txt-badge" fill="#15803D">+100%</text>

      <rect x="198" y="60" width="186" height="48" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
      <text x="12" y="78" class="txt-badge" fill="#166534">MEAN RECALL@3</text>
      <text x="12" y="98" class="txt-val" fill="#15803D">1.0000</text>
      <rect x="110" y="82" width="66" height="18" rx="3" fill="#DCFCE7" transform="translate(198, 0)" />
      <text x="341" y="95" text-anchor="middle" class="txt-badge" fill="#15803D">+50.0%</text>
    </g>

    <!-- Strength Chip -->
    <rect x="14" y="160" width="384" height="68" rx="6" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="24" y="180" class="txt-badge" fill="#15803D">Verified Improvements:</text>
    <text x="24" y="198" class="txt-sub" fill="#166534">&#8226; Consensus papers recovered at Rank 1 (Query A3)</text>
    <text x="24" y="216" class="txt-sub" fill="#166534">&#8226; Zero regression on exact keyword queries (B1-B3)</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="278" width="860" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="460" y="297" text-anchor="middle" class="txt-sub" fill="#334155">Empirical Verdict: +61.2% MAP gain proves system is ready for production deployment.</text>
</svg>