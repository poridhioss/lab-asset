<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .flow-pipe {
        stroke: #64748B;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: dashFlow 4s linear infinite;
      }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="240" class="bg" />

  <!-- Connecting Pipes -->
  <path d="M 230 100 L 258 100" class="flow-pipe" marker-end="url(#arr)" />
  <path d="M 460 100 L 488 100" class="flow-pipe" marker-end="url(#arr)" />
  <path d="M 690 100 L 718 100" class="flow-pipe" marker-end="url(#arr)" />

  <!-- STATION 1: Labs 1 & 2 -->
  <g transform="translate(30, 20)">
    <rect width="200" height="160" class="sketch-box" fill="#F8FAFC" stroke="#CBD5E1" />
    <rect x="14" y="12" width="80" height="18" rx="3" fill="#E2E8F0" />
    <text x="20" y="25" class="txt-badge" fill="#475569">&#10003; COMPLETED</text>
    <text x="14" y="56" class="txt-title" fill="#1E293B">Inverted Index</text>
    <text x="14" y="78" class="txt-sub">Tokenizer &amp; Posting Lists</text>
    <text x="14" y="96" class="txt-sub">Boolean Intersections</text>
    <rect x="14" y="112" width="172" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="100" y="132" text-anchor="middle" class="txt-code" fill="#475569">Core Search Index</text>
  </g>

  <!-- STATION 2: Labs 3 & 4 -->
  <g transform="translate(260, 20)">
    <rect width="200" height="160" class="sketch-box" fill="#F8FAFC" stroke="#CBD5E1" />
    <rect x="14" y="12" width="80" height="18" rx="3" fill="#E2E8F0" />
    <text x="20" y="25" class="txt-badge" fill="#475569">&#10003; COMPLETED</text>
    <text x="14" y="56" class="txt-title" fill="#1E293B">Typeahead Search</text>
    <text x="14" y="78" class="txt-sub">Prefix Character Trie</text>
    <text x="14" y="96" class="txt-sub">Bounded Top-K Min-Heap</text>
    <rect x="14" y="112" width="172" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="100" y="132" text-anchor="middle" class="txt-code" fill="#475569">Sub-1ms Autocomplete</text>
  </g>

  <!-- STATION 3: Lab 5 (Current) -->
  <g transform="translate(490, 20)">
    <rect width="200" height="160" class="sketch-box" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <rect x="14" y="12" width="85" height="18" rx="3" fill="#DBEAFE" />
    <text x="20" y="25" class="txt-badge" fill="#1D4ED8">&#9679; CURRENT LAB</text>
    <text x="14" y="56" class="txt-title" fill="#1E40AF">Relevance Metrics</text>
    <text x="14" y="78" class="txt-sub">Precision, Recall &amp; RR</text>
    <text x="14" y="96" class="txt-sub">Average Precision &amp; MAP</text>
    <rect x="14" y="112" width="172" height="32" rx="6" fill="#FFFFFF" stroke="#93C5FD" />
    <text x="100" y="132" text-anchor="middle" class="txt-code" fill="#1E40AF">IREvaluator Engine</text>
  </g>

  <!-- STATION 4: Production Elasticsearch (Next) -->
  <g transform="translate(720, 20)">
    <rect width="190" height="160" class="sketch-box" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <rect x="14" y="12" width="85" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="25" class="txt-badge" fill="#15803D">&#8594; NEXT UP</text>
    <text x="14" y="56" class="txt-title" fill="#14532D">Production Search</text>
    <text x="14" y="78" class="txt-sub">First Principles vs ES</text>
    <text x="14" y="96" class="txt-sub">Cluster BM25 Shootout</text>
    <rect x="14" y="112" width="162" height="32" rx="6" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="95" y="132" text-anchor="middle" class="txt-code" fill="#166534">Scored by Evaluator</text>
  </g>

  <!-- Bottom Transition Banner -->
  <rect x="30" y="195" width="880" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="470" y="214" text-anchor="middle" class="txt-sub" fill="#334155">Mastering evaluation first allows us to objectively benchmark Elasticsearch in First Principles vs. Elasticsearch in Production.</text>
</svg>