<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .step-num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
      .step-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arrow-roadmap" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="460" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="30" y="24" width="880" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="46" class="title">Module 16a Curriculum Roadmap: Unlocking Main Lab 3</text>
  <text x="50" y="64" class="subtitle">How foundational Information Retrieval metrics power production Elasticsearch cluster evaluation</text>

  <!-- STEP 1: Labs 1 & 2 (190 x 280) -->
  <g transform="translate(30, 95)">
    <rect width="195" height="280" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="0" y="0" width="195" height="36" rx="10" fill="#F1F5F9" />
    <rect x="0" y="26" width="195" height="10" fill="#F1F5F9" />
    <text x="15" y="22" class="step-num" fill="#475569">LABS 1 &amp; 2</text>
    <rect x="110" y="8" width="70" height="20" rx="4" fill="#E2E8F0" />
    <text x="145" y="22" text-anchor="middle" class="badge" fill="#475569">Completed</text>

    <text x="15" y="58" class="step-title" fill="#1E293B">Inverted Index Core</text>
    <text x="15" y="78" class="sublabel">• Text Tokenization</text>
    <text x="15" y="96" class="sublabel">• Posting Lists &amp; Inverted Map</text>
    <text x="15" y="114" class="sublabel">• Boolean Query Intersections</text>
    <text x="15" y="132" class="sublabel">• Term Frequency Scoring</text>

    <rect x="15" y="190" width="165" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="25" y="210" class="badge" fill="#64748B">Core Artifacts:</text>
    <text x="25" y="228" class="sublabel">Tokenizer.js</text>
    <text x="25" y="244" class="sublabel">InvertedIndex.js</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="235" x2="255" y2="235" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-roadmap)" />

  <!-- STEP 2: Labs 3 & 4 (190 x 280) -->
  <g transform="translate(260, 95)">
    <rect width="195" height="280" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="0" y="0" width="195" height="36" rx="10" fill="#F1F5F9" />
    <rect x="0" y="26" width="195" height="10" fill="#F1F5F9" />
    <text x="15" y="22" class="step-num" fill="#475569">LABS 3 &amp; 4</text>
    <rect x="110" y="8" width="70" height="20" rx="4" fill="#E2E8F0" />
    <text x="145" y="22" text-anchor="middle" class="badge" fill="#475569">Completed</text>

    <text x="15" y="58" class="step-title" fill="#1E293B">Typeahead Search</text>
    <text x="15" y="78" class="sublabel">• Character Trie In-Memory</text>
    <text x="15" y="96" class="sublabel">• Bounded Min-Heap (K=5)</text>
    <text x="15" y="114" class="sublabel">• PushPop O(log K) Filtering</text>
    <text x="15" y="132" class="sublabel">• Zipf-Law Flat Prefix Caching</text>

    <rect x="15" y="190" width="165" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="25" y="210" class="badge" fill="#64748B">Core Artifacts:</text>
    <text x="25" y="228" class="sublabel">CharacterTrie.js</text>
    <text x="25" y="244" class="sublabel">MinHeap.js / FlatPrefixMap</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="235" x2="485" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-active)" />

  <!-- STEP 3: Lab 5 (Current Lab) (200 x 280) -->
  <g transform="translate(490, 95)">
    <rect width="200" height="280" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <rect x="0" y="0" width="200" height="36" rx="10" fill="#DBEAFE" />
    <rect x="0" y="26" width="200" height="10" fill="#DBEAFE" />
    <text x="15" y="22" class="step-num" fill="#1D4ED8">LAB 5 (CURRENT)</text>
    <rect x="115" y="8" width="70" height="20" rx="4" fill="#2563EB" />
    <text x="150" y="22" text-anchor="middle" class="badge" fill="#FFFFFF">Mastered</text>

    <text x="15" y="58" class="step-title" fill="#1E40AF">Relevance Metrics</text>
    <text x="15" y="78" class="sublabel">• Cranfield Ground Truth</text>
    <text x="15" y="96" class="sublabel">• Precision@K &amp; Recall@K</text>
    <text x="15" y="114" class="sublabel">• Reciprocal Rank (RR)</text>
    <text x="15" y="132" class="sublabel">• Average Precision &amp; MAP</text>

    <rect x="15" y="185" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#93C5FD" />
    <text x="25" y="205" class="badge" fill="#1D4ED8">Key Production Export:</text>
    <text x="25" y="225" class="badge" font-weight="700" fill="#1E40AF">IREvaluator.js</text>
    <text x="25" y="245" class="sublabel">Reusable Evaluation Engine</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="695" y1="235" x2="720" y2="235" stroke="#059669" stroke-width="2" marker-end="url(#arrow-roadmap)" />

  <!-- STEP 4: Main Lab 3 (185 x 280) -->
  <g transform="translate(725, 95)">
    <rect width="185" height="280" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="36" rx="10" fill="#DCFCE7" />
    <rect x="0" y="26" width="185" height="10" fill="#DCFCE7" />
    <text x="15" y="22" class="step-num" fill="#15803D">MAIN LAB 3</text>
    <rect x="105" y="8" width="65" height="20" rx="4" fill="#BBF7D0" />
    <text x="137" y="22" text-anchor="middle" class="badge" fill="#166534">Next Up</text>

    <text x="15" y="58" class="step-title" fill="#14532D">Production ES</text>
    <text x="15" y="78" class="sublabel">• Docker Compose ES 8.11</text>
    <text x="15" y="96" class="sublabel">• Multi-Field BM25 Index</text>
    <text x="15" y="114" class="sublabel">• Lucene Segments &amp; WAND</text>
    <text x="15" y="132" class="sublabel">• Live System Shootout</text>

    <rect x="15" y="185" width="155" height="80" rx="6" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="25" y="205" class="badge" fill="#15803D">Evaluated With:</text>
    <text x="25" y="225" class="sublabel">Imports IREvaluator.js</text>
    <text x="25" y="245" class="sublabel">Scores Hand-Rolled vs ES</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="395" width="880" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="48" cy="416" r="5" fill="#10B981" />
  <text x="62" y="420" class="label" font-weight="600">Architectural Transition:</text>
  <text x="220" y="420" class="sublabel">By mastering evaluation first, you can objectively quantify Elasticsearch's BM25 advantage in Main Lab 3.</text>
</svg>
