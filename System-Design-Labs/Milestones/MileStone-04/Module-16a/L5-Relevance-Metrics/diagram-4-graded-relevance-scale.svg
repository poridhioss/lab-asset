<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" class="bg" />

  <!-- CARD 1: Grade 0 (Irrelevant) -->
  <g transform="translate(30, 20)">
    <rect width="265" height="210" class="sketch-box" fill="#FEF2F2" stroke="#F87171" />
    <rect x="14" y="14" width="75" height="18" rx="3" fill="#FEE2E2" />
    <text x="20" y="27" class="txt-badge" fill="#991B1B">GRADE 0</text>
    <text x="14" y="56" class="txt-title" fill="#991B1B">Irrelevant / Noise</text>

    <!-- Meaning Chip -->
    <rect x="14" y="70" width="237" height="36" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
    <text x="24" y="92" class="txt-sub" fill="#7F1D1D">Misses user intent entirely</text>

    <!-- Example -->
    <rect x="14" y="114" width="237" height="38" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
    <text x="24" y="132" class="txt-code" fill="#B91C1C">Doc: PostgreSQL SQL Engine</text>
    <text x="24" y="146" class="txt-code" fill="#64748B">(for "cache clustering")</text>

    <!-- Evaluator Action -->
    <rect x="14" y="160" width="237" height="34" rx="6" fill="#FEE2E2" />
    <text x="24" y="181" class="txt-badge" fill="#991B1B">Action: Penalizes Top-K</text>
  </g>

  <!-- CARD 2: Grade 1 (Partially Relevant) -->
  <g transform="translate(315, 20)">
    <rect width="270" height="210" class="sketch-box" fill="#FFFBEB" stroke="#FBBF24" />
    <rect x="14" y="14" width="75" height="18" rx="3" fill="#FEF3C7" />
    <text x="20" y="27" class="txt-badge" fill="#92400E">GRADE 1</text>
    <text x="14" y="56" class="txt-title" fill="#92400E">Partially Relevant</text>

    <!-- Meaning Chip -->
    <rect x="14" y="70" width="242" height="36" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
    <text x="24" y="92" class="txt-sub" fill="#78350F">Adjacent context / background</text>

    <!-- Example -->
    <rect x="14" y="114" width="242" height="38" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
    <text x="24" y="132" class="txt-code" fill="#B45309">Doc: Redis Sentinel Failover</text>
    <text x="24" y="146" class="txt-code" fill="#64748B">(for "cache clustering")</text>

    <!-- Evaluator Action -->
    <rect x="14" y="160" width="242" height="34" rx="6" fill="#FEF3C7" />
    <text x="24" y="181" class="txt-badge" fill="#92400E">Action: Counted when minGrade=1</text>
  </g>

  <!-- CARD 3: Grade 2 (Highly Relevant) -->
  <g transform="translate(605, 20)">
    <rect width="265" height="210" class="sketch-box" fill="#F0FDF4" stroke="#34D399" />
    <rect x="14" y="14" width="75" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="27" class="txt-badge" fill="#166534">GRADE 2</text>
    <text x="14" y="56" class="txt-title" fill="#14532D">Highly Relevant</text>

    <!-- Meaning Chip -->
    <rect x="14" y="70" width="237" height="36" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
    <text x="24" y="92" class="txt-sub" fill="#064E3B">Exact direct answer (Bullseye)</text>

    <!-- Example -->
    <rect x="14" y="114" width="237" height="38" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
    <text x="24" y="132" class="txt-code" fill="#15803D">Doc: Redis Cluster Slot Sharding</text>
    <text x="24" y="146" class="txt-code" fill="#64748B">(for "cache clustering")</text>

    <!-- Evaluator Action -->
    <rect x="14" y="160" width="237" height="34" rx="6" fill="#DCFCE7" />
    <text x="24" y="181" class="txt-badge" fill="#15803D">Action: Must Appear at Rank 1</text>
  </g>

  <!-- Bottom Note -->
  <rect x="30" y="240" width="840" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="259" text-anchor="middle" class="txt-sub" fill="#334155">Lenient mode (grade &#8805; 1) audits general topic coverage; Strict mode (grade == 2) enforces exact answer purity.</text>
</svg>