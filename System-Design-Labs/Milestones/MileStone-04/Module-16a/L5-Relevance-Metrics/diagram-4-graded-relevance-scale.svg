<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="30" y="24" width="840" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="46" class="title">The Cranfield 3-Point Graded Relevance Scale</text>
  <text x="50" y="64" class="subtitle">Standardized ground-truth classification mapping document content to user search intent</text>

  <!-- CARD 1: Grade 0 (Irrelevant) (260 x 270) -->
  <g transform="translate(30, 95)">
    <rect width="265" height="270" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" />
    <rect x="0" y="0" width="265" height="42" rx="10" fill="#FEE2E2" />
    <rect x="0" y="32" width="265" height="10" fill="#FEE2E2" />
    <circle cx="28" cy="21" r="10" fill="#EF4444" />
    <text x="28" y="25" text-anchor="middle" class="badge" fill="#FFFFFF">0</text>
    <text x="46" y="26" class="card-title" fill="#991B1B">Grade 0: Irrelevant</text>

    <text x="18" y="65" class="label" font-weight="600">Definition:</text>
    <text x="18" y="82" class="sublabel">Document does not answer or address</text>
    <text x="18" y="98" class="sublabel">the search intent in any meaningful way.</text>

    <rect x="15" y="115" width="235" height="65" rx="6" fill="#FFFFFF" stroke="#FECACA" />
    <text x="25" y="133" class="badge" fill="#991B1B">Example Intent Match:</text>
    <text x="25" y="150" class="sublabel">Query: "cache clustering"</text>
    <text x="25" y="166" class="sublabel">Doc: "PostgreSQL query optimizer"</text>

    <rect x="15" y="195" width="235" height="60" rx="6" fill="#FEE2E2" />
    <text x="25" y="215" class="badge" fill="#B91C1C">Evaluator Action:</text>
    <text x="25" y="232" class="sublabel">Ignored in precision numerator.</text>
    <text x="25" y="246" class="sublabel">Severe penalty if returned in top-K.</text>
  </g>

  <!-- CARD 2: Grade 1 (Partially Relevant) (260 x 270) -->
  <g transform="translate(315, 95)">
    <rect width="270" height="270" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="42" rx="10" fill="#FEF3C7" />
    <rect x="0" y="32" width="270" height="10" fill="#FEF3C7" />
    <circle cx="28" cy="21" r="10" fill="#F59E0B" />
    <text x="28" y="25" text-anchor="middle" class="badge" fill="#FFFFFF">1</text>
    <text x="46" y="26" class="card-title" fill="#92400E">Grade 1: Partially Relevant</text>

    <text x="18" y="65" class="label" font-weight="600">Definition:</text>
    <text x="18" y="82" class="sublabel">Document covers adjacent concepts,</text>
    <text x="18" y="98" class="sublabel">context, or prerequisite background.</text>

    <rect x="15" y="115" width="240" height="65" rx="6" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="25" y="133" class="badge" fill="#B45309">Example Intent Match:</text>
    <text x="25" y="150" class="sublabel">Query: "cache clustering"</text>
    <text x="25" y="166" class="sublabel">Doc: "Redis Sentinel failover topology"</text>

    <rect x="15" y="195" width="240" height="60" rx="6" fill="#FEF3C7" />
    <text x="25" y="215" class="badge" fill="#92400E">Evaluator Action:</text>
    <text x="25" y="232" class="sublabel">Counted when minGrade = 1.</text>
    <text x="25" y="246" class="sublabel">Excluded under strict mode (minGrade = 2).</text>
  </g>

  <!-- CARD 3: Grade 2 (Highly Relevant) (260 x 270) -->
  <g transform="translate(605, 95)">
    <rect width="265" height="270" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="0" y="0" width="265" height="42" rx="10" fill="#DCFCE7" />
    <rect x="0" y="32" width="265" height="10" fill="#DCFCE7" />
    <circle cx="28" cy="21" r="10" fill="#10B981" />
    <text x="28" y="25" text-anchor="middle" class="badge" fill="#FFFFFF">2</text>
    <text x="46" y="26" class="card-title" fill="#14532D">Grade 2: Highly Relevant</text>

    <text x="18" y="65" class="label" font-weight="600">Definition:</text>
    <text x="18" y="82" class="sublabel">Document directly and authoritatively</text>
    <text x="18" y="98" class="sublabel">answers the user's specific technical intent.</text>

    <rect x="15" y="115" width="235" height="65" rx="6" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="25" y="133" class="badge" fill="#15803D">Example Intent Match:</text>
    <text x="25" y="150" class="sublabel">Query: "cache clustering"</text>
    <text x="25" y="166" class="sublabel">Doc: "Redis Cluster hash slot sharding"</text>

    <rect x="15" y="195" width="235" height="60" rx="6" fill="#DCFCE7" />
    <text x="25" y="215" class="badge" fill="#14532D">Evaluator Action:</text>
    <text x="25" y="232" class="sublabel">Must appear at Rank 1 or 2.</text>
    <text x="25" y="246" class="sublabel">Primary target for high MAP &amp; MRR scores.</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="380" width="840" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="48" cy="401" r="5" fill="#3B82F6" />
  <text x="62" y="405" class="label" font-weight="600">Multi-Tier Invariant:</text>
  <text x="185" y="405" class="sublabel">The SearchEvaluator supports both lenient evaluation (grades >= 1) and strict precision audits (grade == 2).</text>
</svg>
