<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1E293B; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
      .math-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #0369A1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header Section -->
  <rect x="30" y="24" width="900" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="48" class="title">Cranfield Information Retrieval Evaluation Engine</text>
  <text x="50" y="66" class="subtitle">Offline Ground-Truth Benchmarking Architecture: Deterministic Metric Verification</text>
  <rect x="760" y="38" width="150" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
  <text x="835" y="55" text-anchor="middle" class="badge" fill="#1D4ED8">Node.js 20+ Native</text>

  <!-- COLUMN 1: The Three Cranfield Pillars (Left) -->
  <g transform="translate(30, 100)">
    <rect width="250" height="340" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="38" rx="10" fill="#F1F5F9" />
    <rect x="0" y="28" width="250" height="10" fill="#F1F5F9" />
    <text x="125" y="24" text-anchor="middle" class="box-title">1. The 3 Cranfield Pillars</text>

    <!-- Pillar 1: Static Corpus -->
    <rect x="15" y="50" width="220" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="35" cy="72" r="12" fill="#E0F2FE" />
    <text x="35" y="76" text-anchor="middle" class="badge" fill="#0284C7">D</text>
    <text x="56" y="70" class="label" font-weight="600">Static Corpus</text>
    <text x="56" y="86" class="sublabel">Technical Documentation</text>
    <text x="56" y="102" class="sublabel">Docs: #101 .. #304</text>

    <!-- Pillar 2: Benchmark Queries -->
    <rect x="15" y="140" width="220" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="35" cy="164" r="12" fill="#EDE9FE" />
    <text x="35" y="168" text-anchor="middle" class="badge" fill="#7C3AED">Q</text>
    <text x="56" y="162" class="label" font-weight="600">Benchmark Queries</text>
    <text x="56" y="178" class="sublabel">Group A: Conversational</text>
    <text x="56" y="194" class="sublabel">Group B: Exact Keywords</text>
    <text x="56" y="210" class="sublabel">6 Representative Intents</text>

    <!-- Pillar 3: Graded Relevance Qrels -->
    <rect x="15" y="240" width="220" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="35" cy="264" r="12" fill="#FEF3C7" />
    <text x="35" y="268" text-anchor="middle" class="badge" fill="#D97706">J</text>
    <text x="56" y="262" class="label" font-weight="600">Relevance Judgments</text>
    <text x="56" y="278" class="sublabel">Grade 0: Irrelevant</text>
    <text x="56" y="294" class="sublabel">Grade 1: Partially Relevant</text>
    <text x="56" y="310" class="sublabel">Grade 2: Highly Relevant</text>
  </g>

  <!-- Connecting Arrows Column 1 -> Column 2 -->
  <line x1="280" y1="182" x2="330" y2="182" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="280" y1="382" x2="330" y2="382" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- COLUMN 2: Retrieval System & Evaluator (Center) -->
  <g transform="translate(330, 100)">
    <rect width="300" height="340" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="38" rx="10" fill="#EFF6FF" />
    <rect x="0" y="28" width="300" height="10" fill="#EFF6FF" />
    <text x="150" y="24" text-anchor="middle" class="box-title" fill="#1E40AF">2. Search Engine &amp; Evaluator</text>

    <!-- Engine Box -->
    <rect x="15" y="50" width="270" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="25" y="72" class="label" font-weight="600">Search Engine under Test</text>
    <text x="25" y="88" class="sublabel">Inverted Index / BM25 / Semantic Ranker</text>
    <rect x="25" y="98" width="250" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="35" y="115" class="math-text">Input: Query &quot;q&quot;</text>
    <text x="35" y="130" class="math-text">Output: Retrieved [d1, d2, d3, .. dK]</text>

    <!-- Evaluator Engine -->
    <rect x="15" y="175" width="270" height="145" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="25" y="198" class="label" font-weight="700" fill="#1E40AF">IREvaluator.js (SearchEvaluator)</text>
    
    <rect x="25" y="210" width="250" height="32" rx="4" fill="#FFFFFF" stroke="#BFDBFE" />
    <text x="35" y="230" class="sublabel">getRelevantDocs(q, minGrade=1)</text>

    <rect x="25" y="248" width="250" height="32" rx="4" fill="#FFFFFF" stroke="#BFDBFE" />
    <text x="35" y="268" class="sublabel">Set-Based Intersection &amp; Rank Scan</text>

    <rect x="25" y="286" width="250" height="24" rx="4" fill="#DBEAFE" />
    <text x="150" y="302" text-anchor="middle" class="badge" fill="#1D4ED8">IEEE 754 4-Dec Rounding</text>
  </g>

  <!-- Connecting Arrows Column 2 -> Column 3 -->
  <line x1="630" y1="270" x2="680" y2="270" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- COLUMN 3: Evaluation Metrics Scorecard (Right) -->
  <g transform="translate(680, 100)">
    <rect width="250" height="340" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="38" rx="10" fill="#DCFCE7" />
    <rect x="0" y="28" width="250" height="10" fill="#DCFCE7" />
    <text x="125" y="24" text-anchor="middle" class="box-title" fill="#166534">3. IR Scorecard &amp; Metrics</text>

    <!-- Per-Query Metrics -->
    <rect x="15" y="50" width="220" height="130" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="25" y="70" class="label" font-weight="600" fill="#14532D">Per-Query Metrics</text>
    
    <text x="25" y="92" class="badge" fill="#047857">Precision@K</text>
    <text x="115" y="92" class="sublabel">hits / K</text>

    <text x="25" y="114" class="badge" fill="#047857">Recall@K</text>
    <text x="115" y="114" class="sublabel">hits / |Rel|</text>

    <text x="25" y="136" class="badge" fill="#047857">RR (1/rank)</text>
    <text x="115" y="136" class="sublabel">Navigational</text>

    <text x="25" y="158" class="badge" fill="#047857">AP (Avg Prec)</text>
    <text x="115" y="158" class="sublabel">Area under PR</text>

    <!-- Suite Aggregation -->
    <rect x="15" y="195" width="220" height="130" rx="6" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="25" y="215" class="label" font-weight="600" fill="#14532D">Suite Aggregators</text>

    <rect x="25" y="225" width="200" height="42" rx="4" fill="#F0FDF4" stroke="#86EFAC" />
    <text x="35" y="242" class="badge" fill="#15803D">MAP (Mean AP)</text>
    <text x="35" y="258" class="sublabel">System-Wide Benchmark</text>

    <rect x="25" y="275" width="200" height="42" rx="4" fill="#F0FDF4" stroke="#86EFAC" />
    <text x="35" y="292" class="badge" fill="#15803D">MRR (Mean RR)</text>
    <text x="35" y="308" class="sublabel">Navigational Quality</text>
  </g>

  <!-- Footer Banner: Key Architectural Invariants -->
  <rect x="30" y="460" width="900" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="50" cy="488" r="6" fill="#10B981" />
  <text x="65" y="492" class="label" font-weight="600">Architectural Invariant:</text>
  <text x="215" y="492" class="sublabel">Evaluates pure ranking quality independent of latency, cache hits, or UI position bias.</text>
  <rect x="800" y="474" width="115" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
  <text x="857" y="492" text-anchor="middle" class="badge" fill="#475569">Cranfield 1966</text>
</svg>
