<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .station-accent { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .flow-arrow {
        stroke: #64748B;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: dashFlow 4s linear infinite;
      }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="320" class="bg" />

  <!-- Flow Lines Between Stations -->
  <path d="M 230 150 L 260 150" class="flow-arrow" marker-end="url(#arr)" />
  <path d="M 460 150 L 490 150" class="flow-arrow" marker-end="url(#arr)" />
  <path d="M 710 150 L 740 150" class="flow-arrow" marker-end="url(#arr)" />

  <!-- STATION 1: Ground Truth (Answer Key) -->
  <g transform="translate(30, 25)">
    <rect width="200" height="270" class="sketch-box" />
    <rect x="14" y="14" width="105" height="20" rx="4" fill="#EDE9FE" />
    <text x="20" y="28" class="txt-badge" fill="#6D28D9">1. GROUND TRUTH</text>
    <text x="14" y="58" class="txt-title">The Answer Key</text>
    <text x="14" y="76" class="txt-sub">Human-judged labels</text>

    <!-- Grade Chips -->
    <rect x="14" y="92" width="172" height="38" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <text x="24" y="115" class="txt-badge" fill="#166534">Grade 2: Bullseye</text>

    <rect x="14" y="138" width="172" height="38" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
    <text x="24" y="161" class="txt-badge" fill="#92400E">Grade 1: Related</text>

    <rect x="14" y="184" width="172" height="38" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
    <text x="24" y="207" class="txt-badge" fill="#991B1B">Grade 0: Noise</text>

    <rect x="14" y="232" width="172" height="24" rx="4" fill="#F1F5F9" />
    <text x="100" y="248" text-anchor="middle" class="txt-code" fill="#475569">Target: [d101, d104]</text>
  </g>

  <!-- STATION 2: Candidate Search Engines -->
  <g transform="translate(260, 25)">
    <rect width="200" height="270" class="sketch-box" />
    <rect x="14" y="14" width="95" height="20" rx="4" fill="#E0F2FE" />
    <text x="20" y="28" class="txt-badge" fill="#0369A1">2. CANDIDATES</text>
    <text x="14" y="58" class="txt-title">Search Engines</text>
    <text x="14" y="76" class="txt-sub">Algorithms under test</text>

    <rect x="14" y="94" width="172" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="24" y="116" class="txt-badge" fill="#475569">Baseline Matcher</text>
    <text x="24" y="138" class="txt-code" fill="#64748B">&#8594; Naive Keyword</text>

    <rect x="14" y="166" width="172" height="62" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
    <text x="24" y="188" class="txt-badge" fill="#1D4ED8">Tuned Ranker</text>
    <text x="24" y="210" class="txt-code" fill="#1E40AF">&#8594; BM25 / Semantic</text>

    <rect x="14" y="238" width="172" height="20" rx="4" fill="#F1F5F9" />
    <text x="100" y="252" text-anchor="middle" class="txt-code" fill="#334155">Output: Ranked [d1..dK]</text>
  </g>

  <!-- STATION 3: Relevance Metric Engine -->
  <g transform="translate(490, 25)">
    <rect width="220" height="270" class="sketch-box" stroke="#3B82F6" stroke-width="2" fill="#F8FAFC" />
    <rect x="14" y="14" width="105" height="20" rx="4" fill="#DBEAFE" />
    <text x="20" y="28" class="txt-badge" fill="#1E40AF">3. METRIC ENGINE</text>
    <text x="14" y="58" class="txt-title">Relevance Scorer</text>
    <text x="14" y="76" class="txt-sub">Evaluates ranked order</text>

    <!-- 4 Metrics Chips -->
    <rect x="14" y="92" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="22" y="112" class="txt-badge" fill="#1D4ED8">Precision@K</text>
    <text x="196" y="112" text-anchor="end" class="txt-sub">Cleanliness</text>

    <rect x="14" y="132" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="22" y="152" class="txt-badge" fill="#1D4ED8">Recall@K</text>
    <text x="196" y="152" text-anchor="end" class="txt-sub">Coverage</text>

    <rect x="14" y="172" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="22" y="192" class="txt-badge" fill="#1D4ED8">Reciprocal Rank</text>
    <text x="196" y="192" text-anchor="end" class="txt-sub">Instant Hit</text>

    <rect x="14" y="212" width="192" height="34" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="22" y="232" class="txt-badge" fill="#1D4ED8">Average Precision</text>
    <text x="196" y="232" text-anchor="end" class="txt-sub">Position</text>
  </g>

  <!-- STATION 4: Production Decision Scorecard -->
  <g transform="translate(740, 25)">
    <rect width="190" height="270" class="sketch-box" stroke="#16A34A" stroke-width="2" fill="#F0FDF4" />
    <rect x="14" y="14" width="95" height="20" rx="4" fill="#DCFCE7" />
    <text x="20" y="28" class="txt-badge" fill="#15803D">4. SCORECARD</text>
    <text x="14" y="58" class="txt-title">Decision Gate</text>
    <text x="14" y="76" class="txt-sub">System-wide verdict</text>

    <rect x="14" y="94" width="162" height="52" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />
    <text x="22" y="116" class="txt-badge" fill="#166534">MAP (Mean AP)</text>
    <text x="22" y="136" class="txt-code" fill="#15803D">+61.2% Gain</text>

    <rect x="14" y="154" width="162" height="52" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />
    <text x="22" y="176" class="txt-badge" fill="#166534">MRR (Mean RR)</text>
    <text x="22" y="196" class="txt-code" fill="#15803D">+50.0% Gain</text>

    <!-- Final Ship Pill -->
    <rect x="14" y="218" width="162" height="38" rx="6" fill="#16A34A" />
    <text x="95" y="242" text-anchor="middle" class="txt-badge" fill="#FFFFFF">SHIP TO PROD</text>
  </g>
</svg>