<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFDF8; }
      .sketch-box { fill: #FFFFFF; stroke: #334155; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; rx: 12; }
      .txt-badge { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-title { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .txt-sub { font-family: "Caveat", "Virgil", "Comic Neue", -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .txt-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .slot-card { stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" class="bg" />

  <!-- LEFT: Engine A (Top-Heavy) -->
  <g transform="translate(30, 25)">
    <rect width="410" height="245" class="sketch-box" stroke="#16A34A" stroke-width="2" fill="#F0FDF4" />
    
    <!-- Header -->
    <rect x="14" y="12" width="85" height="18" rx="3" fill="#DCFCE7" />
    <text x="20" y="25" class="txt-badge" fill="#166534">ENGINE A</text>
    <text x="105" y="26" class="txt-title" fill="#14532D">Top-Heavy Ranking</text>
    <rect x="295" y="12" width="100" height="18" rx="3" fill="#FFFFFF" stroke="#86EFAC" />
    <text x="345" y="25" text-anchor="middle" class="txt-badge" fill="#15803D">Recall@5 = 1.0</text>

    <!-- Slots 1..5 -->
    <g transform="translate(14, 40)">
      <!-- Slot 1 -->
      <rect y="0" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#86EFAC" />
      <text x="10" y="16" class="txt-badge" fill="#15803D">R1: Relevant</text>
      <text x="372" y="16" text-anchor="end" class="txt-code" fill="#15803D">P@1 = 1.000</text>

      <!-- Slot 2 -->
      <rect y="28" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#86EFAC" />
      <text x="10" y="44" class="txt-badge" fill="#15803D">R2: Relevant</text>
      <text x="372" y="44" text-anchor="end" class="txt-code" fill="#15803D">P@2 = 1.000</text>

      <!-- Slot 3 -->
      <rect y="56" width="382" height="20" class="slot-card" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="10" y="70" class="txt-code" fill="#94A3B8">R3: Irrelevant (skip)</text>

      <!-- Slot 4 -->
      <rect y="80" width="382" height="20" class="slot-card" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="10" y="94" class="txt-code" fill="#94A3B8">R4: Irrelevant (skip)</text>

      <!-- Slot 5 -->
      <rect y="104" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#86EFAC" />
      <text x="10" y="120" class="txt-badge" fill="#15803D">R5: Relevant</text>
      <text x="372" y="120" text-anchor="end" class="txt-code" fill="#15803D">P@5 = 0.600</text>
    </g>

    <!-- Math Calculation Footer -->
    <rect x="14" y="174" width="382" height="58" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />
    <text x="24" y="196" class="txt-sub" fill="#14532D">AP = (1.0 + 1.0 + 0.6) / 3</text>
    <rect x="250" y="184" width="135" height="36" rx="6" fill="#16A34A" />
    <text x="317" y="208" text-anchor="middle" class="txt-title" fill="#FFFFFF">AP = 0.8667</text>
  </g>

  <!-- RIGHT: Engine B (Bottom-Heavy) -->
  <g transform="translate(460, 25)">
    <rect width="410" height="245" class="sketch-box" stroke="#D97706" stroke-width="2" fill="#FFFBEB" />

    <!-- Header -->
    <rect x="14" y="12" width="85" height="18" rx="3" fill="#FEF3C7" />
    <text x="20" y="25" class="txt-badge" fill="#92400E">ENGINE B</text>
    <text x="105" y="26" class="txt-title" fill="#92400E">Bottom-Heavy Ranking</text>
    <rect x="295" y="12" width="100" height="18" rx="3" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="345" y="25" text-anchor="middle" class="txt-badge" fill="#B45309">Recall@5 = 1.0</text>

    <!-- Slots 1..5 -->
    <g transform="translate(14, 40)">
      <!-- Slot 1 -->
      <rect y="0" width="382" height="20" class="slot-card" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="10" y="14" class="txt-code" fill="#94A3B8">R1: Irrelevant (skip)</text>

      <!-- Slot 2 -->
      <rect y="24" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#FDE68A" />
      <text x="10" y="40" class="txt-badge" fill="#B45309">R2: Relevant</text>
      <text x="372" y="40" text-anchor="end" class="txt-code" fill="#B45309">P@2 = 0.500</text>

      <!-- Slot 3 -->
      <rect y="52" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#FDE68A" />
      <text x="10" y="68" class="txt-badge" fill="#B45309">R3: Relevant</text>
      <text x="372" y="68" text-anchor="end" class="txt-code" fill="#B45309">P@3 = 0.667</text>

      <!-- Slot 4 -->
      <rect y="80" width="382" height="24" class="slot-card" fill="#FFFFFF" stroke="#FDE68A" />
      <text x="10" y="96" class="txt-badge" fill="#B45309">R4: Relevant</text>
      <text x="372" y="96" text-anchor="end" class="txt-code" fill="#B45309">P@4 = 0.750</text>

      <!-- Slot 5 -->
      <rect y="108" width="382" height="20" class="slot-card" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="10" y="122" class="txt-code" fill="#94A3B8">R5: Irrelevant (skip)</text>
    </g>

    <!-- Math Calculation Footer -->
    <rect x="14" y="174" width="382" height="58" rx="8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.2" />
    <text x="24" y="196" class="txt-sub" fill="#92400E">AP = (0.5 + 0.667 + 0.75) / 3</text>
    <rect x="250" y="184" width="135" height="36" rx="6" fill="#D97706" />
    <text x="317" y="208" text-anchor="middle" class="txt-title" fill="#FFFFFF">AP = 0.6389</text>
  </g>

  <!-- Bottom Contrast Banner -->
  <rect x="30" y="280" width="840" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="299" text-anchor="middle" class="txt-sub" fill="#334155">Identical Recall (3/3), but Engine A scores +35.7% higher in AP because relevant answers appear first.</text>
</svg>