<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1E293B; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
      .score-large { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="30" y="24" width="840" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="50" y="46" class="title">Average Precision (AP): Rank-Order Position Sensitivity</text>
  <text x="50" y="64" class="subtitle">Comparing two search engines retrieving identical documents with different ranking order</text>

  <!-- LEFT: Engine A (Top-Heavy) (405 x 300) -->
  <g transform="translate(30, 95)">
    <rect width="405" height="300" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="0" y="0" width="405" height="36" rx="10" fill="#DCFCE7" />
    <rect x="0" y="26" width="405" height="10" fill="#DCFCE7" />
    <text x="20" y="23" class="box-title" fill="#14532D">Engine A (Top-Heavy Ranking)</text>
    <rect x="290" y="7" width="100" height="22" rx="4" fill="#BBF7D0" />
    <text x="340" y="22" text-anchor="middle" class="badge" fill="#14532D">Recall@5 = 1.0</text>

    <!-- Ranked Items -->
    <rect x="15" y="48" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="25" y="67" class="badge" fill="#15803D">Rank 1: Relevant</text>
    <text x="180" y="67" class="sublabel">hits = 1</text>
    <text x="260" y="67" class="badge" fill="#15803D">P@1 = 1/1 = 1.000</text>

    <rect x="15" y="84" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="25" y="103" class="badge" fill="#15803D">Rank 2: Relevant</text>
    <text x="180" y="103" class="sublabel">hits = 2</text>
    <text x="260" y="103" class="badge" fill="#15803D">P@2 = 2/2 = 1.000</text>

    <rect x="15" y="120" width="375" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="25" y="137" class="badge" fill="#94A3B8">Rank 3: Irrelevant</text>
    <text x="180" y="137" class="sublabel">skipped</text>
    <text x="260" y="137" class="badge" fill="#94A3B8">rel(3) = 0</text>

    <rect x="15" y="152" width="375" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="25" y="169" class="badge" fill="#94A3B8">Rank 4: Irrelevant</text>
    <text x="180" y="169" class="sublabel">skipped</text>
    <text x="260" y="169" class="badge" fill="#94A3B8">rel(4) = 0</text>

    <rect x="15" y="184" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#BBF7D0" />
    <text x="25" y="203" class="badge" fill="#15803D">Rank 5: Relevant</text>
    <text x="180" y="203" class="sublabel">hits = 3</text>
    <text x="260" y="203" class="badge" fill="#15803D">P@5 = 3/5 = 0.600</text>

    <!-- Calculation Footer -->
    <rect x="15" y="224" width="375" height="62" rx="6" fill="#DCFCE7" stroke="#86EFAC" />
    <text x="25" y="244" class="label" font-weight="600" fill="#14532D">AP Calculation (|Relevant| = 3):</text>
    <text x="25" y="260" class="sublabel">(1.000 + 1.000 + 0.600) / 3 = 2.600 / 3</text>
    <text x="260" y="262" class="score-large" fill="#14532D">AP = 0.8667</text>
  </g>

  <!-- RIGHT: Engine B (Bottom-Heavy) (405 x 300) -->
  <g transform="translate(465, 95)">
    <rect width="405" height="300" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="0" y="0" width="405" height="36" rx="10" fill="#FEF3C7" />
    <rect x="0" y="26" width="405" height="10" fill="#FEF3C7" />
    <text x="20" y="23" class="box-title" fill="#92400E">Engine B (Bottom-Heavy Ranking)</text>
    <rect x="290" y="7" width="100" height="22" rx="4" fill="#FDE68A" />
    <text x="340" y="22" text-anchor="middle" class="badge" fill="#92400E">Recall@5 = 1.0</text>

    <!-- Ranked Items -->
    <rect x="15" y="48" width="375" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="25" y="65" class="badge" fill="#94A3B8">Rank 1: Irrelevant</text>
    <text x="180" y="65" class="sublabel">skipped</text>
    <text x="260" y="65" class="badge" fill="#94A3B8">rel(1) = 0</text>

    <rect x="15" y="80" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="25" y="99" class="badge" fill="#D97706">Rank 2: Relevant</text>
    <text x="180" y="99" class="sublabel">hits = 1</text>
    <text x="260" y="99" class="badge" fill="#D97706">P@2 = 1/2 = 0.500</text>

    <rect x="15" y="116" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="25" y="135" class="badge" fill="#D97706">Rank 3: Relevant</text>
    <text x="180" y="135" class="sublabel">hits = 2</text>
    <text x="260" y="135" class="badge" fill="#D97706">P@3 = 2/3 = 0.667</text>

    <rect x="15" y="152" width="375" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" />
    <text x="25" y="171" class="badge" fill="#D97706">Rank 4: Relevant</text>
    <text x="180" y="171" class="sublabel">hits = 3</text>
    <text x="260" y="171" class="badge" fill="#D97706">P@4 = 3/4 = 0.750</text>

    <rect x="15" y="188" width="375" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="25" y="205" class="badge" fill="#94A3B8">Rank 5: Irrelevant</text>
    <text x="180" y="205" class="sublabel">skipped</text>
    <text x="260" y="205" class="badge" fill="#94A3B8">rel(5) = 0</text>

    <!-- Calculation Footer -->
    <rect x="15" y="224" width="375" height="62" rx="6" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="25" y="244" class="label" font-weight="600" fill="#92400E">AP Calculation (|Relevant| = 3):</text>
    <text x="25" y="260" class="sublabel">(0.500 + 0.667 + 0.750) / 3 = 1.917 / 3</text>
    <text x="260" y="262" class="score-large" fill="#B45309">AP = 0.6389</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="410" width="840" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="48" cy="433" r="5" fill="#10B981" />
  <text x="62" y="437" class="label" font-weight="600">The Takeaway:</text>
  <text x="160" y="437" class="sublabel">Engine A delivers a +35.6% higher AP than Engine B because front-loading hits minimizes user search friction.</text>
</svg>
