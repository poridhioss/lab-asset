<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .track-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .track-red { stroke: #ef4444; stroke-width: 2.4; fill: none; }
      .track-amber { stroke: #f59e0b; stroke-width: 2.4; fill: none; }
      .track-green { stroke: #10b981; stroke-width: 2.4; fill: none; }

      .pulse-blue {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-blue-rev {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowRev 0.85s linear infinite;
      }
      .pulse-red {
        stroke: #fca5a5; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-amber {
        stroke: #fde68a; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-green {
        stroke: #a7f3d0; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }

      @keyframes flowFwd { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 30; } }
    </style>
  </defs>
  <rect width="1024" height="512" fill="#ffffff"/>

  <!-- FLOW ARROWS -->
  <g id="tracks">
    <!-- 1. Client -> Nginx API Gateway -->
    <path d="M 165 142 L 228 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 165 142 L 222 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 2. Nginx API Gateway -> Express API Service -->
    <path d="M 410 142 L 442 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 410 142 L 436 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 3. Express -> Redis 7 (SETNX) -->
    <path d="M 632 142 L 712 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 632 142 L 706 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 4. Redis 7 -> Express (Response, pointing left) -->
    <path d="M 712 171 L 638 171" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 712 171 L 638 171" class="pulse-blue-rev"><animate attributeName="stroke-dashoffset" from="0" to="30" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 5. Redis 7 -> Orders Database -->
    <path d="M 852 142 L 880 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 852 142 L 874 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 6. Orders Database -> HTTP Response -->
    <path d="M 950 245 L 950 445 L 602 445" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 950 245 L 950 445 L 602 445" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 7. HTTP Response -> Client -->
    <path d="M 424 445 L 75 445 L 75 253" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 424 445 L 75 445 L 75 253" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 8. Error: 401 Unauthorized -->
    <path d="M 294 245 L 294 280 L 225 280 L 225 312" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 294 245 L 294 280 L 225 280 L 225 306" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 9. Error: 429 Too Many Requests -->
    <path d="M 334 245 L 334 280 L 395 280 L 395 312" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 334 245 L 334 280 L 395 280 L 395 306" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 10. Error: 409 Conflict (SORASORI / COMPLETELY STRAIGHT VERTICAL!) -->
    <path d="M 565 245 L 565 312" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 565 245 L 565 306" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 11. Success: 201 Created & 200 OK (Replay) (From Express x=605 down and right) -->
    <path d="M 605 245 L 605 280 L 719 280 L 719 312" class="track-green" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>
    <path d="M 605 245 L 605 280 L 719 280 L 719 306" class="pulse-green"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <path d="M 719 280 L 878 280 L 878 312" class="track-green" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>
    <path d="M 719 280 L 878 280 L 878 306" class="pulse-green"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>
  </g>

  <!-- FLOW LABELS -->
  <g id="flow-labels">
    <text x="672" y="126" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Check / Set Lock</text>
    <text x="672" y="137" fill="#475569" font-size="8.5" font-weight="600" text-anchor="middle">(SETNX)</text>

    <text x="672" y="190" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Get / Save</text>
    <text x="672" y="201" fill="#475569" font-size="8.5" font-weight="600" text-anchor="middle">(Response)</text>
  </g>

  <!-- CARD 1: CLIENT -->
  <g id="card-1-client">
    <rect x="8" y="51" width="158" height="194" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="87" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Client</text>

    <g transform="translate(35, 92)">
      <rect x="14" y="8" width="76" height="48" rx="4" fill="#1e293b"/>
      <rect x="18" y="12" width="68" height="40" rx="2" fill="#38bdf8"/>
      <polygon points="18,12 58,12 42,52 18,52" fill="#ffffff" opacity="0.15"/>
      <path d="M 6 56 L 98 56 C 100 56 102 58 100 60 L 94 63 C 93 64 91 64 89 64 L 15 64 C 13 64 11 64 10 63 L 4 60 C 2 58 4 56 6 56 Z" fill="#64748b"/>
    </g>

    <text x="87" y="172" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">HTTP Request</text>

    <rect x="16" y="182" width="142" height="52" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="87" y="197" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">X-API-Key</text>
    <text x="87" y="211" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">Idempotency-Key</text>
    <text x="87" y="224" fill="#0369a1" font-size="9" font-weight="600" text-anchor="middle">JSON body</text>
  </g>

  <!-- CARD 2: NGINX API GATEWAY -->
  <g id="card-2-nginx">
    <rect x="228" y="51" width="182" height="194" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="319" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Nginx API Gateway</text>

    <g transform="translate(303, 88)">
      <polygon points="16,0 30,8 30,24 16,32 2,24 2,8" fill="#009639"/>
      <text x="16" y="22" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">N</text>
    </g>

    <g transform="translate(236, 130)">
      <rect x="0" y="0" width="166" height="30" rx="4" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="83" y="19" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Check API Key (Authentication)</text>

      <rect x="0" y="36" width="166" height="30" rx="4" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="83" y="55" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Rate Limit (5 req/s with burst)</text>

      <rect x="0" y="72" width="166" height="30" rx="4" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="83" y="91" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Forward Request (Keep headers)</text>
    </g>
  </g>

  <!-- CARD 3: EXPRESS API SERVICE -->
  <g id="card-3-express">
    <rect x="442" y="51" width="190" height="194" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="537" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Express API Service</text>

    <g transform="translate(458, 88)">
      <polygon points="10,2 18,6.8 18,16.2 10,21 2,16.2 2,6.8" fill="#339933"/>
      <text x="10" y="14" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">JS</text>
      <text x="24" y="14" fill="#339933" font-size="12" font-weight="800">node</text>
      <rect x="56" y="3" width="15" height="15" rx="2" fill="#539e43"/>
      <text x="63.5" y="14" fill="#ffffff" font-size="7.5" font-weight="800" text-anchor="middle">JS</text>

      <rect x="80" y="2" width="60" height="17" rx="3" fill="#1e293b"/>
      <text x="110" y="14" fill="#ffffff" font-size="9.5" font-weight="600" text-anchor="middle">express</text>
    </g>

    <g transform="translate(448, 130)">
      <rect x="0" y="0" width="178" height="30" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="89" y="19" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Validate Request (OpenAPI 3)</text>

      <rect x="0" y="36" width="178" height="30" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="89" y="55" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Idempotency (Redis lock+cache)</text>

      <rect x="0" y="72" width="178" height="30" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="89" y="91" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">Create Order (if valid)</text>
    </g>
  </g>

  <!-- CARD 4: REDIS 7 -->
  <g id="card-4-redis">
    <rect x="712" y="51" width="140" height="194" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="782" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Redis 7</text>

    <g transform="translate(740, 88)">
      <polygon points="36,24 68,34 36,44 4,34" fill="#b91c1c"/>
      <polygon points="4,34 36,44 36,50 4,40" fill="#991b1b"/>
      <polygon points="68,34 36,44 36,50 68,40" fill="#7f1d1d"/>

      <polygon points="36,12 68,22 36,32 4,22" fill="#dc2626"/>
      <polygon points="4,22 36,32 36,38 4,28" fill="#b91c1c"/>
      <polygon points="68,22 36,32 36,38 68,28" fill="#991b1b"/>

      <polygon points="36,0 68,10 36,20 4,10" fill="#ef4444"/>
      <polygon points="4,10 36,20 36,26 4,16" fill="#dc2626"/>
      <polygon points="68,10 36,20 36,26 68,16" fill="#b91c1c"/>
    </g>

    <g transform="translate(720, 150)">
      <rect x="0" y="0" width="124" height="38" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="62" y="17" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">IN_PROGRESS Lock</text>
      <text x="62" y="30" fill="#475569" font-size="8.5" font-weight="500" text-anchor="middle">(TTL 60s)</text>

      <rect x="0" y="44" width="124" height="38" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="62" y="61" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Cache Response</text>
      <text x="62" y="74" fill="#475569" font-size="8.5" font-weight="500" text-anchor="middle">(TTL 24h, 2xx only)</text>
    </g>
  </g>

  <!-- CARD 5: ORDERS DATABASE -->
  <g id="card-5-db">
    <rect x="880" y="51" width="138" height="194" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="949" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Orders Database</text>

    <g transform="translate(913, 102)">
      <path d="M 0 46 C 0 54 60 54 60 46 L 60 58 C 60 66 0 66 0 58 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="46" rx="30" ry="7" fill="#334155"/>
      <path d="M 0 24 C 0 32 60 32 60 24 L 60 36 C 60 44 0 44 0 36 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="24" rx="30" ry="7" fill="#334155"/>
      <path d="M 0 2 C 0 10 60 10 60 2 L 60 14 C 60 22 0 22 0 14 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="7" rx="30" ry="7" fill="#475569"/>
    </g>

    <text x="949" y="210" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Store new order</text>
    <text x="949" y="224" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(only once)</text>
  </g>

  <!-- BOTTOM 5 BRANCH CARDS -->
  <!-- 1. 401 Unauthorized -->
  <g id="card-401">
    <rect x="146" y="318" width="160" height="68" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="166" cy="342" r="10" fill="#dc2626"/>
    <path d="M 162 338 L 170 346 M 170 338 L 162 346" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="184" y="341" fill="#0f172a" font-size="10" font-weight="800">401 Unauthorized</text>
    <text x="184" y="356" fill="#475569" font-size="8" font-weight="500">(Invalid/Missing Key)</text>
  </g>

  <!-- 2. 429 Too Many Requests -->
  <g id="card-429">
    <rect x="316" y="318" width="166" height="68" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="336" cy="342" r="10" fill="#dc2626"/>
    <path d="M 332 338 L 340 346 M 340 338 L 332 346" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="354" y="341" fill="#0f172a" font-size="10" font-weight="800">429 Too Many Requests</text>
    <text x="354" y="356" fill="#475569" font-size="8" font-weight="500">(Rate limit exceeded)</text>
  </g>

  <!-- 3. 409 Conflict -->
  <g id="card-409">
    <rect x="492" y="318" width="146" height="68" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="512" cy="342" r="10" fill="#dc2626"/>
    <path d="M 508 338 L 516 346 M 516 338 L 508 346" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="530" y="340" fill="#0f172a" font-size="10" font-weight="800">409 Conflict</text>
    <text x="530" y="353" fill="#475569" font-size="8" font-weight="500">(Duplicate request</text>
    <text x="530" y="364" fill="#475569" font-size="8" font-weight="500">while processing)</text>
  </g>

  <!-- 4. 201 Created -->
  <g id="card-201">
    <rect x="648" y="318" width="142" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="668" cy="342" r="10" fill="#16a34a"/>
    <path d="M 664 342 L 667 345 L 673 339" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="686" y="341" fill="#0f172a" font-size="10.5" font-weight="800">201 Created</text>
    <text x="686" y="356" fill="#475569" font-size="8.5" font-weight="500">(New order, cached)</text>
  </g>

  <!-- 5. 200 OK (Replay) -->
  <g id="card-200">
    <rect x="800" y="318" width="156" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="820" cy="342" r="10" fill="#16a34a"/>
    <path d="M 816 342 L 819 345 L 825 339" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="838" y="340" fill="#0f172a" font-size="10" font-weight="800">200 OK (Replay)</text>
    <text x="838" y="353" fill="#475569" font-size="8" font-weight="500">(Cached response,</text>
    <text x="838" y="365" fill="#059669" font-size="8" font-weight="700">X-Cache: HIT)</text>
  </g>

  <!-- BOTTOM: HTTP RESPONSE -->
  <g id="card-response-bottom">
    <rect x="424" y="424" width="178" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="513" y="442" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">HTTP Response</text>
    <text x="513" y="455" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(JSON or Error)</text>
  </g>
</svg>