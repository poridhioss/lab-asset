<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .track-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .track-red { stroke: #ef4444; stroke-width: 2.4; fill: none; }
      .track-amber { stroke: #f59e0b; stroke-width: 2.4; fill: none; }
      .track-green { stroke: #10b981; stroke-width: 2.4; fill: none; }

      .pulse-blue {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-blue-rev {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowRev 0.85s linear infinite;
      }
      .pulse-red {
        stroke: #fca5a5; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-amber {
        stroke: #fde68a; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-green {
        stroke: #a7f3d0; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }

      @keyframes flowFwd { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 30; } }
    </style>
  </defs>
  <rect width="1024" height="512" fill="#ffffff"/>

  <!-- FLOW ARROWS -->
  <g id="tracks">
    <!-- 1. Client -> Poridhi LB -->
    <path d="M 174 142 L 260 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 174 142 L 254 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 2. Poridhi LB -> Node.js Server -->
    <path d="M 440 142 L 530 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 440 142 L 524 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 3. Node.js Server -> Orders DB -->
    <path d="M 750 142 L 826 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 750 142 L 820 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 4. Orders DB -> HTTP Response (5) -->
    <path d="M 925 245 L 925 442 L 572 442" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 925 245 L 925 442 L 572 442" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 5. HTTP Response (5) -> Client (1) -->
    <path d="M 352 442 L 80 442 L 80 253" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 352 442 L 80 442 L 80 253" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- Validation Fails: Server -> Error Response -->
    <path d="M 663 245 L 663 280" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 663 245 L 663 276" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- Error Response -> Client (1) -->
    <path d="M 630 372 L 96 372 L 96 253" class="track-red" marker-end="url(#arr-red)"/>
    <path d="M 630 372 L 96 372 L 96 253" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>
  </g>

  <!-- FLOW LABELS -->
  <g id="flow-labels">
    <!-- Step 2: HTTP Request -->
    <circle cx="217" cy="118" r="12" fill="#2563eb"/>
    <text x="217" y="122" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="217" y="156" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">HTTP</text>
    <text x="217" y="169" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Request</text>

    <!-- Step 3: Forward to port 5000 -->
    <circle cx="485" cy="118" r="12" fill="#2563eb"/>
    <text x="485" y="122" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="485" y="156" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Forward</text>
    <text x="485" y="169" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">to port 5000</text>

    <!-- Step 4: Process Data -->
    <circle cx="788" cy="118" r="12" fill="#2563eb"/>
    <text x="788" y="122" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="788" y="156" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Process</text>
    <text x="788" y="169" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Data</text>

    <!-- Validation fails label -->
    <text x="704" y="268" fill="#dc2626" font-size="11" font-weight="700">If validation fails</text>
  </g>

  <!-- CARD 1: CLIENT -->
  <g id="card-1-client">
    <rect x="14" y="51" width="160" height="194" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="34" cy="71" r="13" fill="#0284c7"/>
    <text x="34" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="94" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Client</text>

    <g transform="translate(36, 96)">
      <rect x="14" y="12" width="88" height="56" rx="4" fill="#1e293b"/>
      <rect x="18" y="16" width="80" height="48" rx="2" fill="#38bdf8"/>
      <polygon points="18,16 68,16 48,64 18,64" fill="#ffffff" opacity="0.15"/>
      <path d="M 6 68 L 110 68 C 112 68 114 70 112 72 L 106 75 C 105 76 103 76 101 76 L 15 76 C 13 76 11 76 10 75 L 4 72 C 2 70 4 68 6 68 Z" fill="#64748b"/>
      <rect x="52" y="68" width="12" height="2" rx="1" fill="#94a3b8"/>
    </g>

    <text x="94" y="195" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Send HTTP Request</text>
    <rect x="47" y="206" width="94" height="24" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="94" y="222" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle">POST / GET</text>
  </g>

  <!-- CARD 2: PORIDHI LOAD BALANCER -->
  <g id="card-2-lb">
    <rect x="268" y="51" width="172" height="194" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="288" cy="71" r="13" fill="#7c3aed"/>
    <text x="288" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="360" y="69" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Poridhi</text>
    <text x="360" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Load Balancer</text>

    <g transform="translate(309, 120)">
      <rect x="0" y="0" width="90" height="28" rx="4" fill="#334155"/>
      <circle cx="18" cy="14" r="3" fill="#4ade80"/>
      <circle cx="74" cy="14" r="3" fill="#4ade80"/>
      <line x1="30" y1="14" x2="62" y2="14" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

      <rect x="0" y="34" width="90" height="28" rx="4" fill="#334155"/>
      <circle cx="18" cy="48" r="3" fill="#4ade80"/>
      <circle cx="74" cy="48" r="3" fill="#4ade80"/>
      <line x1="30" y1="48" x2="62" y2="48" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="354" y="222" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Public URL</text>
  </g>

  <!-- CARD 3: NODE.JS + EXPRESS SERVER -->
  <g id="card-3-server">
    <rect x="536" y="51" width="214" height="194" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="556" cy="71" r="13" fill="#059669"/>
    <text x="556" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="648" y="69" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Node.js + Express</text>
    <text x="648" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Server</text>

    <!-- Node.js + Express Logos -->
    <g transform="translate(552, 114)">
      <polygon points="12,2 22,7.8 22,19.2 12,25 2,19.2 2,7.8" fill="#339933"/>
      <text x="12" y="17" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">JS</text>
      <text x="30" y="17" fill="#339933" font-size="14" font-weight="800">node</text>
      <rect x="68" y="4" width="18" height="18" rx="3" fill="#539e43"/>
      <text x="77" y="17" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">JS</text>
      <rect x="98" y="3" width="68" height="20" rx="4" fill="#1e293b"/>
      <text x="132" y="17" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">express</text>
    </g>

    <!-- Inner Validation Box -->
    <g transform="translate(550, 160)">
      <rect x="0" y="0" width="186" height="58" rx="8" fill="#ffffff" stroke="#dcfce7" stroke-width="1.5"/>
      <g transform="translate(16, 17)">
        <circle cx="12" cy="12" r="11" fill="#334155"/>
        <circle cx="12" cy="12" r="5" fill="#ffffff"/>
        <path d="M 12 0 L 12 4 M 12 20 L 12 24 M 0 12 L 4 12 M 20 12 L 24 12 M 3.5 3.5 L 6.5 6.5 M 17.5 17.5 L 20.5 20.5 M 3.5 20.5 L 6.5 17.5 M 17.5 6.5 L 20.5 3.5" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="50" y="25" fill="#0f172a" font-size="11" font-weight="700">Validate request</text>
      <text x="50" y="41" fill="#475569" font-size="10" font-weight="500">(using OpenAPI contract)</text>
    </g>
  </g>

  <!-- CARD 4: IN-MEMORY ORDERS DATABASE -->
  <g id="card-4-db">
    <rect x="832" y="51" width="178" height="194" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="852" cy="71" r="13" fill="#d97706"/>
    <text x="852" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="925" y="69" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">In-Memory</text>
    <text x="925" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Orders Database</text>

    <!-- Database Cylinder 3D -->
    <g transform="translate(890, 116)">
      <path d="M 0 46 C 0 54 70 54 70 46 L 70 60 C 70 68 0 68 0 60 Z" fill="#1e293b"/>
      <ellipse cx="35" cy="46" rx="35" ry="8" fill="#334155"/>
      <path d="M 0 24 C 0 32 70 32 70 24 L 70 38 C 70 46 0 46 0 38 Z" fill="#1e293b"/>
      <ellipse cx="35" cy="24" rx="35" ry="8" fill="#334155"/>
      <path d="M 0 2 C 0 10 70 10 70 2 L 70 16 C 70 24 0 24 0 16 Z" fill="#1e293b"/>
      <ellipse cx="35" cy="8" rx="35" ry="8" fill="#475569"/>
    </g>
    <text x="921" y="222" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Store / Read Orders</text>
  </g>

  <!-- ERROR RESPONSE CARD -->
  <g id="card-error">
    <rect x="630" y="286" width="210" height="118" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="655" cy="308" r="13" fill="#dc2626"/>
    <path d="M 650 303 L 660 313 M 660 303 L 650 313" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="734" y="313" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Error Response</text>

    <!-- RFC 7807 Document Box -->
    <g transform="translate(648, 332)">
      <path d="M 14 6 L 36 6 L 46 16 L 46 44 L 14 44 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
      <path d="M 36 6 L 36 16 L 46 16" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.8"/>
      <text x="30" y="32" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">JSON</text>
      <text x="60" y="20" fill="#0f172a" font-size="11" font-weight="700">RFC 7807</text>
      <text x="60" y="35" fill="#475569" font-size="10" font-weight="500">Problem Details</text>
    </g>
  </g>

  <!-- CARD 5: HTTP RESPONSE -->
  <g id="card-5-response">
    <rect x="352" y="390" width="214" height="98" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="375" cy="412" r="13" fill="#0284c7"/>
    <text x="375" y="416" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="456" y="417" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">HTTP Response</text>

    <!-- Document icon -->
    <g transform="translate(372, 432)">
      <path d="M 12 4 L 32 4 L 40 12 L 40 38 L 12 38 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
      <path d="M 32 4 L 32 12 L 40 12" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.8"/>
      <text x="26" y="26" fill="#0f172a" font-size="8" font-weight="800" text-anchor="middle">JSON</text>
    </g>

    <text x="480" y="445" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Return JSON Data</text>
    <text x="480" y="460" fill="#475569" font-size="11" font-weight="500" text-anchor="middle">(or Error)</text>
  </g>
</svg>