<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .track-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .track-red { stroke: #ef4444; stroke-width: 2.4; fill: none; }
      .track-amber { stroke: #f59e0b; stroke-width: 2.4; fill: none; }
      .track-green { stroke: #10b981; stroke-width: 2.4; fill: none; }

      .pulse-blue {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-blue-rev {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowRev 0.85s linear infinite;
      }
      .pulse-red {
        stroke: #fca5a5; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-amber {
        stroke: #fde68a; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-green {
        stroke: #a7f3d0; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }

      @keyframes flowFwd { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 30; } }
    </style>
  </defs>
  <rect width="1024" height="512" fill="#ffffff"/>

  <!-- FLOW ARROWS -->
  <g id="tracks">
    <!-- 1. Client -> Poridhi LB -->
    <path d="M 165 142 L 232 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 165 142 L 226 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 2. Poridhi LB -> Node.js Server -->
    <path d="M 387 142 L 424 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 387 142 L 418 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 3. Server -> Redis (SETNX) top arrow -->
    <path d="M 622 142 L 696 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 622 142 L 690 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 4. Redis -> Server (Get Response) bottom arrow pointing left -->
    <path d="M 698 171 L 626 171" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 698 171 L 626 171" class="pulse-blue-rev"><animate attributeName="stroke-dashoffset" from="0" to="30" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 5. Redis -> Orders DB -->
    <path d="M 836 142 L 864 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 836 142 L 858 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 6. Orders DB -> HTTP Response (6) -->
    <path d="M 940 245 L 940 465 L 638 465" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 940 245 L 940 465 L 638 465" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 7. HTTP Response (6) -> Client (1) -->
    <path d="M 400 465 L 82 465 L 82 253" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 400 465 L 82 465 L 82 253" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- Branch A: Server -> Duplicate Request While Processing -->
    <path d="M 508 245 L 508 280 L 422 280 L 422 305" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 508 245 L 508 280 L 422 280 L 422 300" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- Branch B: Server -> Duplicate Request After Success -->
    <path d="M 541 245 L 541 280 L 641 280 L 641 305" class="track-amber" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>
    <path d="M 541 245 L 541 280 L 641 280 L 641 300" class="pulse-amber"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>
  </g>

  <!-- FLOW LABELS -->
  <g id="flow-labels">
    <!-- Step 2: HTTP Request -->
    <circle cx="196" cy="118" r="12" fill="#2563eb"/>
    <text x="196" y="122" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="196" y="156" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">HTTP</text>
    <text x="196" y="168" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Request</text>

    <!-- Redis Lock / Cache Labels -->
    <text x="660" y="126" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Check / Set Lock</text>
    <text x="660" y="137" fill="#475569" font-size="9" font-weight="600" text-anchor="middle">(SETNX)</text>

    <text x="660" y="190" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Get / Save</text>
    <text x="660" y="201" fill="#475569" font-size="9" font-weight="600" text-anchor="middle">Response</text>
    <text x="660" y="212" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">(TTL 24h)</text>
  </g>

  <!-- CARD 1: CLIENT -->
  <g id="card-1-client">
    <rect x="14" y="51" width="154" height="194" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="34" cy="71" r="13" fill="#0284c7"/>
    <text x="34" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="94" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Client</text>

    <g transform="translate(32, 96)">
      <rect x="14" y="12" width="88" height="56" rx="4" fill="#1e293b"/>
      <rect x="18" y="16" width="80" height="48" rx="2" fill="#38bdf8"/>
      <polygon points="18,16 68,16 48,64 18,64" fill="#ffffff" opacity="0.15"/>
      <path d="M 6 68 L 110 68 C 112 68 114 70 112 72 L 106 75 C 105 76 103 76 101 76 L 15 76 C 13 76 11 76 10 75 L 4 72 C 2 70 4 68 6 68 Z" fill="#64748b"/>
      <rect x="52" y="68" width="12" height="2" rx="1" fill="#94a3b8"/>
    </g>

    <rect x="22" y="196" width="138" height="38" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="91" y="211" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">POST /api/v1/orders</text>
    <text x="91" y="225" fill="#0369a1" font-size="9" font-weight="600" text-anchor="middle">(with Idempotency-Key)</text>
  </g>

  <!-- CARD 2: PORIDHI LOAD BALANCER -->
  <g id="card-2-lb">
    <rect x="232" y="51" width="155" height="194" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="252" cy="71" r="13" fill="#7c3aed"/>
    <text x="252" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="316" y="69" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Poridhi</text>
    <text x="316" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Load Balancer</text>

    <g transform="translate(268, 118)">
      <rect x="0" y="0" width="84" height="26" rx="4" fill="#334155"/>
      <circle cx="16" cy="13" r="3" fill="#4ade80"/>
      <circle cx="68" cy="13" r="3" fill="#4ade80"/>
      <line x1="26" y1="13" x2="56" y2="13" stroke="#475569" stroke-width="2"/>

      <rect x="0" y="32" width="84" height="26" rx="4" fill="#334155"/>
      <circle cx="16" cy="45" r="3" fill="#4ade80"/>
      <circle cx="68" cy="45" r="3" fill="#4ade80"/>
      <line x1="26" y1="45" x2="56" y2="45" stroke="#475569" stroke-width="2"/>
    </g>

    <text x="310" y="215" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Public URL</text>
    <text x="310" y="228" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(port 5000)</text>
  </g>

  <!-- CARD 3: NODE.JS + EXPRESS SERVER -->
  <g id="card-3-server">
    <rect x="424" y="51" width="198" height="194" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="444" cy="71" r="13" fill="#059669"/>
    <text x="444" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="532" y="69" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Node.js + Express</text>
    <text x="532" y="84" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Server</text>

    <!-- Node.js + Express Logos -->
    <g transform="translate(448, 96)">
      <polygon points="10,2 18,6.8 18,16.2 10,21 2,16.2 2,6.8" fill="#339933"/>
      <text x="10" y="14" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">JS</text>
      <text x="24" y="14" fill="#339933" font-size="12" font-weight="800">node</text>
      <rect x="56" y="3" width="15" height="15" rx="2" fill="#539e43"/>
      <text x="63.5" y="14" fill="#ffffff" font-size="7.5" font-weight="800" text-anchor="middle">JS</text>

      <rect x="80" y="2" width="60" height="17" rx="3" fill="#1e293b"/>
      <text x="110" y="14" fill="#ffffff" font-size="9.5" font-weight="600" text-anchor="middle">express</text>
    </g>

    <g transform="translate(438, 130)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="85" y="19" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">1. Validate Idempotency-Key</text>

      <rect x="0" y="36" width="170" height="30" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="85" y="55" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">2. Check Redis (lock / cache)</text>

      <rect x="0" y="72" width="170" height="30" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="85" y="91" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">3. Create order (if new)</text>
    </g>
  </g>

  <!-- CARD 4: REDIS 7 -->
  <g id="card-4-redis">
    <rect x="698" y="51" width="138" height="194" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="718" cy="71" r="13" fill="#dc2626"/>
    <text x="718" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="772" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Redis 7</text>

    <!-- Redis 3D Layers -->
    <g transform="translate(726, 102)">
      <polygon points="40,32 75,44 40,56 5,44" fill="#b91c1c"/>
      <polygon points="5,44 40,56 40,64 5,52" fill="#991b1b"/>
      <polygon points="75,44 40,56 40,64 75,52" fill="#7f1d1d"/>
      <polygon points="40,18 75,30 40,42 5,30" fill="#dc2626"/>
      <polygon points="5,30 40,42 40,50 5,38" fill="#b91c1c"/>
      <polygon points="75,30 40,42 40,50 75,38" fill="#991b1b"/>
      <polygon points="40,4 75,16 40,28 5,16" fill="#ef4444"/>
      <polygon points="5,16 40,28 40,36 5,24" fill="#dc2626"/>
      <polygon points="75,16 40,28 40,36 75,24" fill="#b91c1c"/>
      <polygon points="35,12 45,8 45,16 35,20" fill="#ffffff" opacity="0.8"/>
      <circle cx="56" cy="18" r="3" fill="#ffffff" opacity="0.8"/>
    </g>

    <text x="767" y="196" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Idempotency Lock</text>
    <text x="767" y="210" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">+ Cached Response</text>
  </g>

  <!-- CARD 5: ORDERS DATABASE -->
  <g id="card-5-db">
    <rect x="864" y="51" width="146" height="194" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="884" cy="71" r="13" fill="#d97706"/>
    <text x="884" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="946" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Orders Database</text>

    <!-- Database Cylinder 3D -->
    <g transform="translate(907, 114)">
      <path d="M 0 46 C 0 54 60 54 60 46 L 60 58 C 60 66 0 66 0 58 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="46" rx="30" ry="7" fill="#334155"/>
      <path d="M 0 24 C 0 32 60 32 60 24 L 60 36 C 60 44 0 44 0 36 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="24" rx="30" ry="7" fill="#334155"/>
      <path d="M 0 2 C 0 10 60 10 60 2 L 60 14 C 60 22 0 22 0 14 Z" fill="#1e293b"/>
      <ellipse cx="30" cy="7" rx="30" ry="7" fill="#475569"/>
    </g>

    <text x="937" y="212" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">Store new order</text>
    <text x="937" y="226" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(if not duplicate)</text>
  </g>

  <!-- BRANCH A: DUPLICATE WHILE PROCESSING -->
  <g id="card-branch-a">
    <rect x="320" y="310" width="190" height="114" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="344" cy="332" r="13" fill="#dc2626"/>
    <text x="344" y="336" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">A</text>
    <text x="424" y="330" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Duplicate Request</text>
    <text x="424" y="344" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">(While Processing)</text>

    <!-- Hourglass -->
    <g transform="translate(345, 362)">
      <path d="M 4 4 L 24 4 L 14 18 L 24 32 L 4 32 L 14 18 Z" fill="#fee2e2" stroke="#1e293b" stroke-width="2"/>
      <line x1="2" y1="4" x2="26" y2="4" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2" y1="32" x2="26" y2="32" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="8,8 20,8 14,16" fill="#f87171"/>
      <polygon points="14,24 10,30 18,30" fill="#f87171"/>
    </g>

    <text x="426" y="375" fill="#0f172a" font-size="11" font-weight="700">Return</text>
    <text x="426" y="390" fill="#dc2626" font-size="11" font-weight="800">409 Conflict</text>
  </g>

  <!-- BRANCH B: DUPLICATE AFTER SUCCESS -->
  <g id="card-branch-b">
    <rect x="548" y="310" width="200" height="114" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="572" cy="332" r="13" fill="#d97706"/>
    <text x="572" y="336" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">B</text>
    <text x="654" y="330" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Duplicate Request</text>
    <text x="654" y="344" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">(After Success)</text>

    <!-- Document JSON -->
    <g transform="translate(570, 362)">
      <path d="M 4 2 L 18 2 L 26 10 L 26 32 L 4 32 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
      <path d="M 18 2 L 18 10 L 26 10" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.8"/>
      <text x="15" y="24" fill="#0f172a" font-size="7" font-weight="800" text-anchor="middle">JSON</text>
    </g>

    <text x="608" y="373" fill="#0f172a" font-size="10" font-weight="600">Return cached</text>
    <text x="608" y="386" fill="#0f172a" font-size="10" font-weight="600">response</text>
    <text x="608" y="400" fill="#059669" font-size="9.5" font-weight="700">(X-Cache: HIT)</text>
  </g>

  <!-- CARD 6: HTTP RESPONSE -->
  <g id="card-6-response">
    <rect x="400" y="444" width="238" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="420" cy="465" r="12" fill="#0284c7"/>
    <text x="420" y="469" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">6</text>
    <text x="526" y="470" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">HTTP Response (JSON or Error)</text>
  </g>
</svg>