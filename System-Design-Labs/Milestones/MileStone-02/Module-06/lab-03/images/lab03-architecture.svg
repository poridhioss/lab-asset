<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .track-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .track-red { stroke: #ef4444; stroke-width: 2.4; fill: none; }
      .track-amber { stroke: #f59e0b; stroke-width: 2.4; fill: none; }
      .track-green { stroke: #10b981; stroke-width: 2.4; fill: none; }

      .pulse-blue {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-blue-rev {
        stroke: #93c5fd; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowRev 0.85s linear infinite;
      }
      .pulse-red {
        stroke: #fca5a5; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-amber {
        stroke: #fde68a; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }
      .pulse-green {
        stroke: #a7f3d0; stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 6 9; fill: none;
        animation: flowFwd 0.85s linear infinite;
      }

      @keyframes flowFwd { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 30; } }
    </style>
  </defs>
  <rect width="1024" height="512" fill="#ffffff"/>

  <!-- FLOW ARROWS -->
  <g id="tracks">
    <!-- 1. Client -> Poridhi LB -->
    <path d="M 174 142 L 241 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 174 142 L 235 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 2. Poridhi LB -> Nginx Gateway -->
    <path d="M 404 142 L 439 142" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 404 142 L 433 142" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 3. Nginx Gateway -> Orders Service (blue) -->
    <path d="M 656 128 L 758 128" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 656 128 L 752 128" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 4. Nginx Gateway -> Users Service (amber) -->
    <path d="M 656 195 L 758 195" class="track-amber" marker-end="url(#arr-amber)"/>
    <path d="M 656 195 L 752 195" class="pulse-amber"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 5. 401 Unauthorized (Red dashed) -->
    <path d="M 531 245 L 531 280 L 456 280 L 456 312" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 531 245 L 531 280 L 456 280 L 456 306" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 6. 429 Too Many Requests (Red dashed) -->
    <path d="M 568 245 L 568 280 L 655 280 L 655 312" class="track-red" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <path d="M 568 245 L 568 280 L 655 280 L 655 306" class="pulse-red"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 7. Internal Services -> HTTP Response (4) -->
    <path d="M 936 245 L 936 440 L 648 440" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 936 245 L 936 440 L 648 440" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>

    <!-- 8. HTTP Response (4) -> Client (1) -->
    <path d="M 393 440 L 88 440 L 88 253" class="track-blue" marker-end="url(#arr-blue)"/>
    <path d="M 393 440 L 88 440 L 88 253" class="pulse-blue"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.85s" repeatCount="indefinite"/></path>
  </g>

  <!-- FLOW LABELS -->
  <g id="flow-labels">
    <!-- Step 2: HTTP Request -->
    <circle cx="206" cy="118" r="12" fill="#2563eb"/>
    <text x="206" y="122" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="206" y="156" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">HTTP</text>
    <text x="206" y="168" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Request</text>

    <!-- Routing endpoints -->
    <text x="704" y="120" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">/api/v1/orders</text>
    <text x="704" y="187" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">/api/v1/users</text>
  </g>

  <!-- CARD 1: CLIENT -->
  <g id="card-1-client">
    <rect x="14" y="51" width="160" height="194" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="34" cy="71" r="13" fill="#0284c7"/>
    <text x="34" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="94" y="76" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Client</text>

    <!-- Laptop Icon -->
    <g transform="translate(36, 92)">
      <rect x="14" y="8" width="76" height="48" rx="4" fill="#1e293b"/>
      <rect x="18" y="12" width="68" height="40" rx="2" fill="#38bdf8"/>
      <polygon points="18,12 58,12 42,52 18,52" fill="#ffffff" opacity="0.15"/>
      <path d="M 6 56 L 98 56 C 100 56 102 58 100 60 L 94 63 C 93 64 91 64 89 64 L 15 64 C 13 64 11 64 10 63 L 4 60 C 2 58 4 56 6 56 Z" fill="#64748b"/>
    </g>

    <text x="94" y="172" fill="#334155" font-size="10.5" font-weight="600" text-anchor="middle">Send HTTP Request</text>

    <!-- Pill with request endpoints -->
    <rect x="24" y="182" width="140" height="52" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="94" y="196" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">GET /orders</text>
    <text x="94" y="210" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">GET /users</text>
    <text x="94" y="224" fill="#0369a1" font-size="8.5" font-weight="600" text-anchor="middle">(with X-API-Key)</text>
  </g>

  <!-- CARD 2: PORIDHI LOAD BALANCER -->
  <g id="card-2-lb">
    <rect x="241" y="51" width="163" height="194" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="261" cy="71" r="13" fill="#7c3aed"/>
    <text x="261" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="328" y="69" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Poridhi</text>
    <text x="328" y="85" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Load Balancer</text>

    <g transform="translate(282, 114)">
      <rect x="0" y="0" width="82" height="24" rx="4" fill="#334155"/>
      <circle cx="16" cy="12" r="3" fill="#4ade80"/>
      <circle cx="66" cy="12" r="3" fill="#4ade80"/>
      <line x1="26" y1="12" x2="54" y2="12" stroke="#475569" stroke-width="2"/>

      <rect x="0" y="28" width="82" height="24" rx="4" fill="#334155"/>
      <circle cx="16" cy="40" r="3" fill="#4ade80"/>
      <circle cx="66" cy="40" r="3" fill="#4ade80"/>
      <line x1="26" y1="40" x2="54" y2="40" stroke="#475569" stroke-width="2"/>
    </g>

    <text x="322" y="215" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Public URL</text>
    <text x="322" y="228" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(port 8080)</text>
  </g>

  <!-- CARD 3: NGINX API GATEWAY -->
  <g id="card-3-nginx">
    <rect x="439" y="51" width="217" height="194" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="459" cy="71" r="13" fill="#059669"/>
    <text x="459" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="554" y="75" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Nginx API Gateway</text>

    <g transform="translate(537, 88)">
      <polygon points="16,0 30,8 30,24 16,32 2,24 2,8" fill="#009639"/>
      <text x="16" y="22" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">N</text>
    </g>

    <g transform="translate(449, 130)">
      <rect x="0" y="0" width="197" height="28" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="98" y="18" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">1. Check X-API-Key (authentication)</text>

      <rect x="0" y="34" width="197" height="28" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="98" y="52" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">2. Rate Limit (5 req/s with burst)</text>

      <rect x="0" y="68" width="197" height="28" rx="4" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
      <text x="98" y="86" fill="#0f172a" font-size="9.5" font-weight="600" text-anchor="middle">3. Route to correct service</text>
    </g>
  </g>

  <!-- INTERNAL SERVICES (DOCKER NETWORK) -->
  <g id="card-internal-services">
    <rect x="742" y="51" width="272" height="194" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="878" y="75" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Internal Services (Docker Network)</text>

    <!-- Orders Service -->
    <g transform="translate(758, 96)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="46" height="36" rx="4" fill="#334155"/>
      <circle cx="20" cy="23" r="2.5" fill="#4ade80"/>
      <circle cx="20" cy="37" r="2.5" fill="#4ade80"/>
      <text x="70" y="27" fill="#0f172a" font-size="10.5" font-weight="700">Orders Service</text>
      <text x="70" y="42" fill="#475569" font-size="9.5" font-weight="500">(port 3001)</text>

      <rect x="160" y="0" width="76" height="60" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
      <text x="198" y="27" fill="#0369a1" font-size="9.5" font-weight="700" text-anchor="middle">Handle</text>
      <text x="198" y="42" fill="#0369a1" font-size="9.5" font-weight="700" text-anchor="middle">/orders</text>
    </g>

    <!-- Users Service -->
    <g transform="translate(758, 168)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="46" height="36" rx="4" fill="#334155"/>
      <circle cx="20" cy="23" r="2.5" fill="#4ade80"/>
      <circle cx="20" cy="37" r="2.5" fill="#4ade80"/>
      <text x="70" y="27" fill="#0f172a" font-size="10.5" font-weight="700">Users Service</text>
      <text x="70" y="42" fill="#475569" font-size="9.5" font-weight="500">(port 3002)</text>

      <rect x="160" y="0" width="76" height="60" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="198" y="27" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">Handle</text>
      <text x="198" y="42" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">/users</text>
    </g>
  </g>

  <!-- ERROR 401 CARD -->
  <g id="card-error-401">
    <rect x="353" y="318" width="190" height="74" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="379" cy="342" r="13" fill="#dc2626"/>
    <path d="M 374 337 L 384 347 M 384 337 L 374 347" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="456" y="342" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">401 Unauthorized</text>
    <text x="456" y="359" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(Invalid / Missing X-API-Key)</text>
  </g>

  <!-- ERROR 429 CARD -->
  <g id="card-error-429">
    <rect x="565" y="318" width="220" height="74" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="591" cy="342" r="13" fill="#dc2626"/>
    <path d="M 586 337 L 596 347 M 596 337 L 586 347" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="682" y="342" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">429 Too Many Requests</text>
    <text x="682" y="359" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">(Rate limit exceeded)</text>
  </g>

  <!-- CARD 4: HTTP RESPONSE -->
  <g id="card-4-response">
    <rect x="393" y="418" width="254" height="46" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="414" cy="441" r="12" fill="#0284c7"/>
    <text x="414" y="445" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    
    <rect x="434" y="428" width="24" height="26" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="446" y="446" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">{ }</text>

    <text x="468" y="445" fill="#0f172a" font-size="11.5" font-weight="700">HTTP Response (JSON or Error)</text>
  </g>
</svg>